<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AIT PANEL</title>
<style>
  html,body{margin:0;height:100%;background:#04060a;color:#fff;font-family:system-ui,sans-serif}
  #target-game-frame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;background:#000}
  #panel{position:fixed;left:8px;right:8px;bottom:8px;z-index:5;background:#0d1220;border:1px solid #223;border-radius:14px;padding:10px}
  .card-title{font-weight:700;letter-spacing:.4px}
  .state{font-size:12px;opacity:.85}
  button{background:#1b2a4a;color:#fff;border:0;border-radius:10px;padding:8px 12px;margin-top:8px}
</style>
</head>
<body>
  <iframe id="target-game-frame" src="about:blank" allow="autoplay" title="Game"></iframe>

  <div id="panel">
    <div class="card-title">AIT</div>
    <div class="state" id="stateLabel">boot</div>
    <div>Min deposit: <span id="rechargeAmt">&#8377;500</span></div>
    <button id="btnWingo" type="button">WINGO</button>
    <button id="btnRecharge" type="button">DEPOSIT</button>
  </div>

<script>
/* ── Typical freshly-uploaded design (AIT jaisa): route detection HASH se ──
   Formatting jaan-boojh kar purane templates se alag rakhi gayi hai taaki
   htmlprocessor ke purane narrow regex isse patch na kar paayein. */
var REGISTER_URL = "https://oldsite.example/#/register?invitationCode=ABC123";
var DEPOSIT_URL  = "https://oldsite.example/#/wallet/Recharge";
var WINGO_URL    = "https://oldsite.example/#/saasLottery/WinGo?gameCode=WinGo_30S&lottery=WinGo";
var minDeposit   = 500;

var gameFrame = document.getElementById("target-game-frame");
var isOnRegisterPage = false;
var lastPageState = null;
var _lastRouteKind = null;

function playAudio(file) {
  if (window.ZAYRO && typeof window.ZAYRO.playSound === "function") window.ZAYRO.playSound(file);
}

window.setState = function (name) {
  lastPageState = name;
  var el = document.getElementById("stateLabel");
  if (el) el.textContent = name;
};

function navTo(target) {
  if (!target) return;
  if (gameFrame) gameFrame.src = target;
  if (typeof window.setUrl === "function") window.setUrl(target, { source: "panel" });
}

window.setUrl = function (incoming) {
  var text = String(incoming || "").toLowerCase();
  var h = text.split("#")[1] || "";

  isOnRegisterPage = h.indexOf("/register") >= 0 || h.indexOf("invitationcode") >= 0 || h.indexOf("invitecode") >= 0;
  var isLogin = h.indexOf("/login") >= 0;
  var isWingo = h.indexOf("/saaslottery") >= 0 || h.indexOf("wingo") >= 0 || h.indexOf("lottery") >= 0;

  _lastRouteKind = isOnRegisterPage ? "register" : (isLogin ? "login" : (isWingo ? "wingo" : "other"));

  if (isOnRegisterPage) { playAudio("register.mp3"); window.setState("wait"); return; }
  if (isLogin) { window.setState("wait"); return; }
  if (isWingo) { window.setState("wingo"); return; }
  window.setState("home");
};

document.getElementById("btnWingo").addEventListener("click", function () { navTo(WINGO_URL); });
document.getElementById("btnRecharge").addEventListener("click", function () { navTo(DEPOSIT_URL); });

if (gameFrame) gameFrame.src = REGISTER_URL;
window.setUrl(REGISTER_URL);
</script>
</body>
</html>
