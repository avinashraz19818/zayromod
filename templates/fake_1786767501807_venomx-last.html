<style>
/* ================================================================
   VENOMX VIP — API CORE v7.2
   RED CORE DESIGN (WAPAS) + NEW SHAPE / NEW STATES / NEW TEXT
================================================================ */
:root{
  --red-light:#d24bff;
  --red-main:#c026ff;
  --red-dark:#5b0080;
  --red-glow:rgba(192,38,255,.6);
  --red-soft:rgba(192,38,255,.14);
  --line:rgba(192,38,255,.35);
  --ink:#f6ecff;
  --ink-dim:#d9c2f0;
  --amber:#ffb300;
  --green:#00ff66;
  --cyan:#00e5ff;
}

/* ---------- RESET & BASE ---------- */
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;overflow:hidden;}
body{
  font-family:'Share Tech Mono',monospace;
  color:var(--ink);
  background:#000 !important;
  letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;
}
#target-game-frame{position:absolute;top:0;left:0;width:100%;height:100%;border:none;z-index:1;}

/* ================================================================
   NEW LIVE-WINNING KILL FEED (SLANTED + SLIDE-IN FROM RIGHT)
================================================================ */
#liveWinLayer{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99990;overflow:hidden;}
.lw-card{
  position:absolute;top:70px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;
  padding:6px 10px 6px 7px;max-width:88vw;width:auto;
  clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);
  background:
    repeating-linear-gradient(135deg,rgba(192,38,255,.10) 0 6px,transparent 6px 12px),
    linear-gradient(120deg,#12041a 0%,#07030d 55%,#12041a 100%);
  box-shadow:inset 0 0 0 1px rgba(192,38,255,.55),inset 0 0 16px rgba(192,38,255,.14),0 8px 22px rgba(0,0,0,.8);
  opacity:0;
  animation:lwIn .5s cubic-bezier(.18,1.12,.3,1.18) forwards,lwOut .3s ease-in 4.2s forwards;
}
@keyframes lwIn{
  0%{transform:translateX(120%);opacity:0;}
  55%{transform:translateX(-52%);opacity:1;}
  78%{transform:translateX(-49%);opacity:1;}
  100%{transform:translateX(-50%);opacity:1;}
}
@keyframes lwOut{to{transform:translateX(120%);opacity:0;}}
.lw-card::after{
  content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,#d24bff,#d9c2f0,#d24bff);
  transform-origin:left center;animation:lwTimer 4.4s linear forwards;opacity:.75;
}
@keyframes lwTimer{from{transform:scaleX(1);}to{transform:scaleX(0);}}
.lw-sig{
  flex:0 0 auto;
  font-family:'Bungee',sans-serif;font-size:8px;line-height:1;
  color:var(--red-main);border:1px solid var(--red-main);border-radius:2px;
  padding:3px 5px;transform:rotate(-8deg);
  text-shadow:0 0 6px var(--red-glow);
  box-shadow:0 0 6px var(--red-glow),inset 0 0 4px rgba(192,38,255,.2);
  animation:sigFlick 1.6s steps(1,end) infinite;
}
@keyframes sigFlick{0%,100%{opacity:1;}52%{opacity:.55;}54%{opacity:1;}78%{opacity:.7;}80%{opacity:1;}}
.lw-avatar{
  position:relative;flex-shrink:0;
  width:32px;height:32px;border-radius:50%;
  background:#160a20;border:1.5px solid rgba(212,75,255,.6);
  box-shadow:0 0 10px rgba(192,38,255,.25);
  overflow:hidden;display:grid;place-items:center;
}
.lw-avatar::after{
  content:"";position:absolute;inset:-3px;border-radius:50%;
  border:1px solid rgba(212,75,255,.55);border-top-color:transparent;border-left-color:transparent;
  animation:lwRing 2.4s linear infinite;
}
@keyframes lwRing{to{transform:rotate(360deg);}}
.lw-avatar-fb{font-family:'Chakra Petch',sans-serif;font-weight:900;color:#d9a1ff;font-size:13px;}
.lw-avatar img{width:100%;height:100%;object-fit:cover;}
.lw-text{display:flex;flex-direction:column;line-height:1.3;min-width:0;flex:0 1 auto;}
.lw-text *{white-space:nowrap;}
.lw-label{
  display:inline-flex;align-items:center;gap:5px;
  font-family:'Orbitron',sans-serif;font-size:6.5px;font-weight:900;
  letter-spacing:.2em;color:#d9a1ff;
  white-space:nowrap;
}
.lw-label::before{
  content:"";width:5px;height:5px;border-radius:50%;background:#d24bff;
  box-shadow:0 0 6px rgba(212,75,255,.9);animation:lwDot 1.2s ease-in-out infinite;
}
@keyframes lwDot{0%,100%{opacity:.35;}50%{opacity:1;}}
.lw-name{
  font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:700;color:#efe4ff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lw-amt{
  display:inline;
  font-family:'Audiowide',cursive;font-size:12.5px;color:#d24bff;
  text-shadow:0 0 8px rgba(212,75,255,.5);
  white-space:nowrap;margin-left:7px;
  animation:amtPop .38s cubic-bezier(.2,1.4,.3,1) .28s both;
}
@keyframes amtPop{0%{transform:scale(.35);opacity:0;}70%{transform:scale(1.18);}100%{transform:scale(1);opacity:1;}}
/* ================================================================
   FLOATING LAUNCH TRIGGER
================================================================ */
#miniBtn{
  position:fixed;right:18px;bottom:115px;z-index:9998;
  width:56px;height:56px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  touch-action:none;pointer-events:auto !important;
  background:
    radial-gradient(circle at 34% 26%,rgba(216,140,255,.28),transparent 60%),
    linear-gradient(155deg,#1b0a2e 0%,#0a0414 55%,#000 100%);
  border:1px solid rgba(212,75,255,.55);
  box-shadow:0 12px 26px rgba(0,0,0,.85),0 6px 12px rgba(0,0,0,.6),0 0 12px var(--red-glow),inset 0 1px 0 rgba(255,255,255,.10);
  animation:mbFloat 4s ease-in-out infinite;
}
@keyframes mbFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
#miniBtn img{display:block;width:72%;height:72%;max-width:72%;max-height:72%;object-fit:cover;object-position:center;border-radius:50%;overflow:hidden;background:rgba(0,0,0,.3);position:relative;z-index:3;filter:drop-shadow(0 0 6px var(--red-glow));}
.mb-ring{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);pointer-events:none;z-index:2;}
.mb-ring circle{fill:none;stroke:#c026ff;stroke-width:2;stroke-linecap:round;stroke-dasharray:26 14;transform-origin:50% 50%;animation:mbRingSpin 6s linear infinite;filter:drop-shadow(0 0 3px rgba(192,38,255,.65));}
.mb-ring circle.r2{stroke:rgba(255,255,255,.75);stroke-width:1.2;stroke-dasharray:6 30;animation:mbRingSpin 4s linear infinite reverse;}
@keyframes mbRingSpin{to{transform:rotate(360deg);}}
.mb-orbit{position:absolute;inset:-6px;animation:mbRingSpin 3.2s linear infinite;pointer-events:none;z-index:2;}
.mb-orbit i{position:absolute;top:-2px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(212,75,255,.95);}
#miniBtn::before{
  content:"";position:absolute;inset:-1px;border-radius:50%;
  border:1px solid rgba(212,75,255,.35);z-index:-1;animation:mbHalo 2.6s ease-in-out infinite;
}
@keyframes mbHalo{0%,100%{transform:scale(1);opacity:.4;}50%{transform:scale(1.14);opacity:0;}}
#miniBtn:active{transform:scale(.93);}

/* ================================================================
   MAIN PANEL — NEW SHAPE : CUT-CORNER ARMOR PLATE
================================================================ */
#injector-container{
  position:fixed;right:14px;bottom:95px;z-index:9999;
  width:238px;display:none;touch-action:none;
  animation:panelPop .15s cubic-bezier(.15,1.1,.3,1) both;
}
@keyframes panelPop{from{opacity:0;transform:translateY(8px) scale(.94);}to{opacity:1;transform:none;}}

.card-outer{
  position:relative;padding:2px;
  clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 20px,100% calc(100% - 20px),calc(100% - 20px) 100%,20px 100%,0 calc(100% - 20px),0 20px);
  background:linear-gradient(150deg,#d24bff 0%,#5b0080 30%,#1a0626 52%,#5b0080 72%,#d24bff 100%);
  animation:outerGlow 3.2s ease-in-out infinite alternate;
  pointer-events:auto !important;
}
@keyframes outerGlow{
  from{filter:drop-shadow(0 0 6px rgba(192,38,255,.35)) drop-shadow(0 6px 10px rgba(0,0,0,.72)) drop-shadow(0 18px 28px rgba(0,0,0,.88));}
  to{filter:drop-shadow(0 0 14px rgba(192,38,255,.6)) drop-shadow(0 6px 10px rgba(0,0,0,.72)) drop-shadow(0 18px 28px rgba(0,0,0,.88));}
}
.card-outer.shake{animation:shakeHit .55s ease both;}
@keyframes shakeHit{
  0%,100%{transform:translate(0,0);}
  10%{transform:translate(-4px,2px);}20%{transform:translate(4px,-2px);}
  30%{transform:translate(-3px,-3px);}40%{transform:translate(3px,3px);}
  50%{transform:translate(-2px,2px);}60%{transform:translate(2px,-2px);}
  70%{transform:translate(-1px,1px);}80%{transform:translate(1px,-1px);}
}

/* ARMOR BOLTS */
.bolt{
  position:absolute;width:9px;height:9px;border-radius:50%;z-index:8;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#f3d9ff,#5b0080 60%,#26003f);
  box-shadow:0 0 4px rgba(192,38,255,.8),inset 0 -1px 2px rgba(0,0,0,.6);
}
.bolt::after{
  content:"";position:absolute;left:50%;top:50%;width:72%;height:1.5px;
  background:rgba(0,0,0,.55);transform:translate(-50%,-50%) rotate(45deg);
}
.bolt.b1{left:8px;top:8px;} .bolt.b2{right:8px;top:8px;}
.bolt.b3{left:8px;bottom:8px;} .bolt.b4{right:8px;bottom:8px;}

.card-stroke{position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none;overflow:visible;}
.card-stroke rect{
  x:2px;y:2px;width:calc(100% - 4px);height:calc(100% - 4px);
  fill:none;stroke:rgba(255,255,255,.85);stroke-width:2.2;
  stroke-dasharray:14 86;stroke-linecap:round;
  filter:drop-shadow(0 0 4px rgba(255,255,255,.6)) drop-shadow(0 0 7px rgba(192,38,255,.5));
  animation:strokeRun 3.2s linear infinite;
}
.card-stroke rect.s2{stroke:#c026ff;animation-delay:-1.6s;stroke-dasharray:10 90;}
@keyframes strokeRun{to{stroke-dashoffset:-100;}}

.card-inner{
  position:relative;overflow:hidden;padding:7px 8px 8px;margin:1px;
  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px);
  background:#07030d;
  box-shadow:inset 0 0 18px rgba(192,38,255,.18);
  display:flex;flex-direction:column;
}

/* CRT + SHEEN */
.crt-overlay{
  position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);
  animation:crtFlicker 7s steps(60) infinite;
}
@keyframes crtFlicker{0%,100%{opacity:.5;}8%{opacity:.38;}9%{opacity:.55;}54%{opacity:.42;}55%{opacity:.6;}}
.laser-sweep{
  position:absolute;left:0;right:0;top:-35%;height:32%;z-index:5;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(192,38,255,.14) 60%,rgba(192,38,255,.5) 100%);
  animation:sweepDown 4.2s linear infinite;opacity:.8;
}
@keyframes sweepDown{0%{top:-35%;}100%{top:115%;}}

/* ---------- HEADER : DANGER-TAPE TITLE BAR ---------- */
.card-header{
  position:relative;z-index:4;display:flex;flex-direction:column;
  align-items:stretch;justify-content:center;gap:4px;padding:1px 1px 5px;min-width:0;
}
.title-bar{
  position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:5px 8px;margin:0 -1px;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 100%,0 100%);
  background:
    repeating-linear-gradient(135deg,rgba(0,0,0,.30) 0 5px,transparent 5px 10px),
    linear-gradient(180deg,#c026ff 0%,#8a00cc 50%,#5b0080 100%);
  box-shadow:0 4px 10px rgba(0,0,0,.7),0 1px 3px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.45);
}
.tb-live{
  font-family:'Share Tech Mono',monospace;font-size:6.5px;font-weight:700;letter-spacing:.14em;
  color:#fff;display:inline-flex;align-items:center;gap:3px;
  text-shadow:0 1px 2px rgba(0,0,0,.75);flex:0 0 auto;
}
.tb-live .dot{width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 5px #fff;animation:dotFlicker 1.4s ease-in-out infinite;}
@keyframes dotFlicker{0%,100%{opacity:1;}40%{opacity:.25;}60%{opacity:.7;}80%{opacity:.15;}}
.title-bar .card-title-line1{
  font-family:'Audiowide',cursive;font-size:12px;line-height:1.1;color:#fff;letter-spacing:.02em;
  text-shadow:0 2px 0 rgba(64,0,110,.9),0 0 10px rgba(255,255,255,.35);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;
}
.tb-ver{
  font-family:'Orbitron',sans-serif;font-size:6.5px;font-weight:900;letter-spacing:.12em;
  color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.6);
  padding:1px 4px;background:rgba(0,0,0,.28);border-radius:2px;flex:0 0 auto;
}
/* REDCORE-COMPATIBLE NAME CLASSES (panel auto-replace ke liye, no visual change) */
.card-title-line1{position:relative;min-width:0;}
.card-title-line1 .at{color:#c026ff;}
.mode-strip{
  position:relative;display:flex;align-items:center;justify-content:space-between;gap:5px;
  padding:3px 6px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(192,38,255,.07),rgba(0,0,0,.45));
}
.mode-badge{
  font-family:'Orbitron',sans-serif;font-size:6.8px;font-weight:900;letter-spacing:.16em;
  color:#fff;background:linear-gradient(180deg,#c026ff,#5b0080);
  padding:2px 6px;transform:skewX(-10deg);
  box-shadow:0 0 8px var(--red-glow);flex:0 0 auto;
}
.card-stat{font-family:'Share Tech Mono',monospace;font-size:6.2px;font-weight:700;color:var(--ink-dim);white-space:nowrap;}
.card-stat .val{color:#c026ff;text-shadow:0 0 5px var(--red-glow);}

/* ---------- SCREEN ---------- */
.card-screen{
  position:relative;z-index:3;margin:0 5px;min-height:120px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(192,38,255,.5);border-radius:4px;
  background:
    radial-gradient(ellipse at 50% 42%,rgba(192,38,255,.15),rgba(70,0,120,.18) 44%,rgba(6,1,10,.97) 100%),

    linear-gradient(90deg,rgba(192,38,255,.10) 1px,transparent 1px);
  background-size:100% 100%,16px 16px,16px 16px;
  background-position:center center;
  box-shadow:0 0 12px rgba(192,38,255,.48),inset 0 0 26px rgba(192,38,255,.16),inset 0 -18px 30px rgba(0,0,0,.85);
  overflow:hidden;
}
/* PER-STATE SCREEN ACCENTS */
.card-screen.state-wait{border-color:rgba(192,38,255,.55);}
.card-screen.state-low{border-color:rgba(255,179,0,.55);box-shadow:0 0 12px rgba(255,179,0,.4),inset 0 0 26px rgba(255,179,0,.1),inset 0 -18px 30px rgba(0,0,0,.85);}
.card-screen.state-ready{border-color:rgba(0,255,102,.5);box-shadow:0 0 12px rgba(0,255,102,.38),inset 0 0 26px rgba(0,255,102,.09),inset 0 -18px 30px rgba(0,0,0,.85);}
.card-screen.state-scan{border-color:rgba(0,229,255,.55);box-shadow:0 0 12px rgba(0,229,255,.38),inset 0 0 26px rgba(0,229,255,.09),inset 0 -18px 30px rgba(0,0,0,.85);}
.card-screen.state-big{border-color:rgba(0,255,102,.6);box-shadow:0 0 14px rgba(0,255,102,.48),inset 0 0 26px rgba(0,255,102,.13),inset 0 -18px 30px rgba(0,0,0,.85);}
.card-screen.state-small{border-color:rgba(0,213,255,.6);box-shadow:0 0 14px rgba(0,213,255,.48),inset 0 0 26px rgba(0,213,255,.13),inset 0 -18px 30px rgba(0,0,0,.85);}

#ember-canvas{position:absolute;inset:0;z-index:1;pointer-events:none;}

/* CORNERS */
.sc-corner{
  position:absolute;width:13px;height:13px;border-style:solid;z-index:5;pointer-events:none;
  border-color:#c026ff;filter:drop-shadow(0 0 4px rgba(192,38,255,.7));
}
.sc-tl{top:-7px;left:-7px;border-width:3px 0 0 3px;}
.sc-tr{top:-7px;right:-7px;border-width:3px 3px 0 0;}
.sc-bl{bottom:-7px;left:-7px;border-width:0 0 3px 3px;}
.sc-br{bottom:-7px;right:-7px;border-width:0 3px 3px 0;}
.sc-corner.c-amber{border-color:#ffb300;filter:drop-shadow(0 0 4px rgba(255,179,0,.7));}
.sc-corner.c-green{border-color:#00ff66;filter:drop-shadow(0 0 4px rgba(0,255,102,.7));}
.sc-corner.c-cyan{border-color:#00e5ff;filter:drop-shadow(0 0 4px rgba(0,229,255,.7));}
.sc-corner.c-blue{border-color:#00d5ff;filter:drop-shadow(0 0 4px rgba(0,213,255,.7));}

/* ---------- STATE VIEWS (ALL NEW STYLES) ---------- */
#sv-wait,#sv-low,#sv-ready,#sv-scan,#sv-result{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  width:100%;position:relative;z-index:4;gap:2px;
  animation:svIn .22s cubic-bezier(.15,.6,.35,1) both;
}
@keyframes svIn{from{opacity:0;transform:scale(.94);filter:blur(3px);}to{opacity:1;transform:scale(1);filter:blur(0);}}

/* SPIDER EMBLEM (ICON) */
.spider-emblem{
  position:relative;width:38px;height:38px;flex:0 0 auto;margin:0 auto 4px;
  display:flex;align-items:center;justify-content:center;overflow:visible;
  border:1.5px solid #c026ff;border-radius:50%;
  box-shadow:0 0 14px var(--red-glow),inset 0 0 12px rgba(0,0,0,.9);
  animation:emblemPulse 1.9s ease-in-out infinite alternate;
}
@keyframes emblemPulse{
  from{box-shadow:0 0 9px var(--red-glow),inset 0 0 12px rgba(0,0,0,.9);}
  to{box-shadow:0 0 20px var(--red-glow),inset 0 0 12px rgba(0,0,0,.9);}
}
.spider-emblem::before{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  border:1.5px dashed #c026ff;opacity:.75;
  animation:spinCW 4s linear infinite;
}
@keyframes spinCW{100%{transform:rotate(360deg);}}
@keyframes spinCCW{100%{transform:rotate(-360deg);}}
.spider-emblem img{
  display:block;width:74%;height:74%;max-width:74%;max-height:74%;
  object-fit:cover;object-position:center;border-radius:50%;overflow:hidden;
  background:rgba(0,0,0,.4);position:relative;z-index:3;
  filter:drop-shadow(0 0 7px var(--red-glow));
  animation:embFloat 3s ease-in-out infinite;
}
@keyframes embFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-2px) scale(1.05);}}

/* NEW TEXT STYLES */
.state-title{
  font-family:'Russo One','Chakra Petch',sans-serif;font-size:12.5px;line-height:1.2;text-align:center;
  color:#fff;letter-spacing:.06em;text-transform:uppercase;
  text-shadow:0 0 8px rgba(255,255,255,.3),0 0 14px rgba(192,38,255,.5);

  text-shadow:0 0 10px var(--red-glow),1.5px 1.5px 0 rgba(0,0,0,.9);

}
.state-hint{
  font-family:'Share Tech Mono',monospace;font-size:7.8px;font-weight:700;line-height:1.2;text-align:center;

}
.bal-chip{
  display:inline-flex;align-items:center;gap:4px;
  font-family:'Share Tech Mono',monospace;font-size:7.5px;font-weight:700;letter-spacing:.1em;
  color:#d9c2f0;border:1px solid var(--line);background:rgba(0,0,0,.55);
  padding:1px 7px;transform:skewX(-6deg);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bal-chip span{transform:skewX(6deg);}
.online-chip{
  display:inline-flex;align-items:center;gap:4px;
  font-family:'Orbitron',sans-serif;font-size:6.5px;font-weight:900;letter-spacing:.22em;
  color:#00ff66;border:1px solid rgba(0,255,102,.5);background:rgba(0,0,0,.55);
  padding:1px 6px;text-shadow:0 0 6px rgba(0,255,102,.6);
}
.online-chip::before{content:"";width:4px;height:4px;border-radius:50%;background:#00ff66;box-shadow:0 0 5px #00ff66;animation:lwDot 1.2s ease-in-out infinite;}

/* WAIT : PADLOCK */
.lock-ic{
  position:relative;width:11px;height:9px;margin:0 auto 3px;
  border:1.5px solid #c026ff;border-radius:2px;
  box-shadow:0 0 8px var(--red-glow);
  animation:lockSwing 2.6s ease-in-out infinite;
}
.lock-ic::before{
  content:"";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  width:7px;height:7px;border:1.5px solid #c026ff;border-bottom:none;border-radius:5px 5px 0 0;
}
.lock-ic::after{
  content:"";position:absolute;left:50%;top:1px;transform:translateX(-50%);
  width:2px;height:4px;background:#c026ff;border-radius:1px;
}
@keyframes lockSwing{0%,100%{transform:rotate(0);}10%{transform:rotate(-7deg);}20%{transform:rotate(6deg);}30%{transform:rotate(-4deg);}40%{transform:rotate(0);}}

/* LOW : WARNING TRIANGLE */
.warn-tri{
  width:14px;height:12px;margin:0 auto 3px;
  background:#ffb300;clip-path:polygon(50% 0,0 100%,100% 100%);
  filter:drop-shadow(0 0 6px rgba(255,179,0,.7));
  display:grid;place-items:end center;
  animation:triBlink 1s ease-in-out infinite alternate;
}
.warn-tri span{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:8px;color:#000;line-height:1;padding-bottom:1px;}
@keyframes triBlink{from{filter:drop-shadow(0 0 4px rgba(255,179,0,.4));}to{filter:drop-shadow(0 0 9px rgba(255,179,0,.95));}}

/* ---------- SCAN VIEW : TARGET LOCK RADAR ---------- */
.sv-scan-title{
  position:relative;
  font-family:'Russo One','Chakra Petch',sans-serif;font-size:11px;line-height:1.2;text-align:center;
  color:#fff;letter-spacing:.12em;text-transform:uppercase;margin-bottom:1px;
  text-shadow:0 0 8px rgba(255,255,255,.3),0 0 14px rgba(192,38,255,.5);
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
}
.sv-scan-title::before,.sv-scan-title::after{
  content:attr(data-text);position:absolute;inset:0;opacity:0;pointer-events:none;
}
.sv-scan-title.hit::before{color:#d24bff;animation:stageGlitchA .32s steps(2,end) 1;}
.sv-scan-title.hit::after{color:#00e5ff;animation:stageGlitchB .32s steps(2,end) 1;}
@keyframes stageGlitchA{
  0%,100%{opacity:0;}
  35%{opacity:.9;transform:translate(-2px,1px);clip-path:inset(0 0 55% 0);}
  65%{opacity:.6;transform:translate(2px,-1px);clip-path:inset(60% 0 0 0);}
}
@keyframes stageGlitchB{
  0%,100%{opacity:0;}
  30%{opacity:.8;transform:translate(2px,1px);clip-path:inset(40% 0 25% 0);}
  70%{opacity:.5;transform:translate(-2px,0);clip-path:inset(15% 0 65% 0);}
}
.radar-scope{
  position:relative;width:60px;height:60px;margin:2px auto 0;flex:0 0 auto;
  border-radius:50%;overflow:hidden;
  border:1px solid rgba(192,38,255,.55);
  background:radial-gradient(circle at 50% 50%,rgba(192,38,255,.10),rgba(8,2,14,.92) 72%);
  box-shadow:0 0 12px rgba(192,38,255,.35),inset 0 0 14px rgba(192,38,255,.16);
}
.rs-ring{position:absolute;border-radius:50%;border:1px solid rgba(192,38,255,.3);}
.rs-ring.r1{inset:18%;}
.rs-ring.r2{inset:34%;}
.rs-grid{
  position:absolute;inset:0;opacity:.55;
  background:
    linear-gradient(rgba(192,38,255,.25) 1px,transparent 1px),
    linear-gradient(90deg,rgba(192,38,255,.25) 1px,transparent 1px);
  background-size:50% 50%;background-position:center center;
}
.rs-sweep{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(192,38,255,.55) 0deg 34deg,rgba(192,38,255,.14) 54deg,transparent 72deg 360deg);
  animation:spinCW 1.05s linear infinite;
}
.rs-center{
  position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;
  border-radius:50%;background:#d24bff;box-shadow:0 0 6px #c026ff;
}
.rs-pct{
  position:absolute;left:0;right:0;top:50%;margin-top:-9px;text-align:center;
  font-family:'Teko',sans-serif;font-size:16px;font-weight:600;line-height:1;
  color:#fff;text-shadow:0 0 8px rgba(192,38,255,.85);
}
.rs-pct.locked{color:#00ff66;text-shadow:0 0 10px rgba(0,255,102,.9);animation:pctLock .5s cubic-bezier(.2,1.4,.3,1) both;}
@keyframes pctLock{0%{transform:scale(.4);}70%{transform:scale(1.4);}100%{transform:scale(1);}}
.rs-blips{position:absolute;inset:0;pointer-events:none;}
.rs-blip{
  position:absolute;width:5px;height:5px;margin:-2.5px;border-radius:50%;
  background:#fff;box-shadow:0 0 6px #c026ff;
  animation:blipPop .62s ease-out forwards;
}
.rs-blip.final{width:7px;height:7px;margin:-3.5px;background:#00ff66;box-shadow:0 0 10px #00ff66;animation:blipPop .4s ease-out forwards;}
@keyframes blipPop{0%{transform:scale(.4);opacity:1;}55%{transform:scale(1.45);opacity:.95;}100%{transform:scale(2.4);opacity:0;}}
.rs-lock-brackets{position:absolute;inset:-8px;pointer-events:none;transition:inset .26s cubic-bezier(.16,1,.3,1);}
.rb{
  position:absolute;width:9px;height:9px;border-style:solid;border-color:#fff;
  filter:drop-shadow(0 0 3px rgba(255,255,255,.8));
  opacity:0;transition:opacity .2s ease;
}
.rb-tl{top:0;left:0;border-width:2px 0 0 2px;}
.rb-tr{top:0;right:0;border-width:2px 2px 0 0;}
.rb-bl{bottom:0;left:0;border-width:0 0 2px 2px;}
.rb-br{bottom:0;right:0;border-width:0 2px 2px 0;}
.radar-scope.locking .rb{opacity:1;}
.radar-scope.locking .rs-lock-brackets{inset:-2px;}
.radar-scope.locked .rb{border-color:#00ff66;filter:drop-shadow(0 0 4px rgba(0,255,102,.9));}
.rs-hit{
  position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;
  border-radius:50%;border:2px solid #fff;opacity:0;pointer-events:none;
}
.rs-hit.go{animation:rsShock .7s ease-out forwards;}
@keyframes rsShock{0%{transform:scale(.3);opacity:1;}100%{transform:scale(8);opacity:0;}}
.mini-log{
  width:96%;margin:4px auto 0;min-height:21px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:1px;text-align:left;
}
.ml-line{
  font-family:'JetBrains Mono','Share Tech Mono',monospace;
  font-size:6.8px;line-height:1.4;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;
  animation:typeLine .12s steps(20,end) forwards;
}
@keyframes typeLine{0%{max-width:0;}100%{max-width:100%;}}
.ml-line.info{color:#d9c2f0;}
.ml-line.warn{color:#ffb300;text-shadow:0 0 4px rgba(255,179,0,.5);}
.ml-line.success{color:#00ff66;text-shadow:0 0 4px rgba(0,255,102,.55);}

/* ---------- RESULT VIEW : SIGNAL LOCKED ---------- */
#sv-result{gap:2px;}
.res-stamp{
  display:inline-block;
  font-family:'Share Tech Mono',monospace;font-size:6.6px;font-weight:700;letter-spacing:.26em;
  color:#c026ff;border:1px solid rgba(192,38,255,.6);padding:1px 8px;
  transform:skewX(-10deg);background:rgba(0,0,0,.55);
  text-shadow:0 0 6px var(--red-glow);margin-bottom:1px;white-space:nowrap;
  animation:stampIn .4s cubic-bezier(.2,1.2,.3,1) .05s both;
}
@keyframes stampIn{0%{transform:skewX(-10deg) scale(1.6) rotate(-6deg);opacity:0;}100%{transform:skewX(-10deg) scale(1) rotate(0);opacity:1;}}
.res-main-row{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;padding:7px 2px 4px;
}
.res-bs-badge{
  position:relative;overflow:visible;
  font-family:'Bungee','Arial Black',sans-serif;font-size:15px;line-height:1;
  color:#fff;padding:6px 7px;
  transform:rotate(-6deg);
  background:linear-gradient(180deg,#d24bff 0%,#5b0080 100%);
  border:1.5px solid rgba(255,255,255,.5);
  box-shadow:0 0 14px var(--red-glow),inset 0 -3px 5px rgba(0,0,0,.35),inset 0 2px 4px rgba(255,255,255,.35);
  text-shadow:0 1px 0 rgba(0,0,0,.6);
  animation:badgeThrob 1.1s ease-in-out infinite alternate;
}
.res-bs-badge.big{
  background:linear-gradient(180deg,#00ff66 0%,#006b2b 100%);
  box-shadow:0 0 16px rgba(0,255,102,.55),inset 0 -3px 5px rgba(0,0,0,.35),inset 0 2px 4px rgba(255,255,255,.35);
}
.res-bs-badge.small{
  background:linear-gradient(180deg,#00d5ff 0%,#004d66 100%);
  box-shadow:0 0 16px rgba(0,213,255,.55),inset 0 -3px 5px rgba(0,0,0,.35),inset 0 2px 4px rgba(255,255,255,.35);
}
.res-bs-badge::before,.res-bs-badge::after{
  content:attr(data-text);position:absolute;inset:0;
  display:grid;place-items:center;opacity:0;pointer-events:none;
}
.res-bs-badge::before{color:#fff;animation:glitchBadgeA 2.8s steps(1,end) infinite;}
.res-bs-badge::after{color:#00e5ff;animation:glitchBadgeB 2.8s steps(1,end) infinite;}
@keyframes glitchBadgeA{0%,84%,100%{opacity:0;}85%{opacity:.85;transform:translate(-2px,1px);clip-path:inset(0 0 55% 0);}88%{opacity:0;}94%{opacity:.85;transform:translate(2px,-1px);clip-path:inset(60% 0 0 0);}}
@keyframes glitchBadgeB{0%,80%,100%{opacity:0;}81%{opacity:.7;transform:translate(2px,1px);clip-path:inset(40% 0 25% 0);}86%{opacity:0;}96%{opacity:.7;transform:translate(-2px,-1px);clip-path:inset(15% 0 65% 0);}}
@keyframes badgeThrob{
  from{transform:rotate(-6deg) scale(1);filter:brightness(1);}
  to{transform:rotate(-6deg) scale(1.07);filter:brightness(1.18);}
}
.res-bs-badge .bs-goo{
  position:absolute;bottom:-5px;left:24%;width:6px;height:8px;border-radius:0 0 60% 60%;
  background:inherit;background-size:auto;filter:brightness(.7);
  animation:dripPulse 2.2s ease-in-out infinite;
}
.res-bs-badge .bs-goo.g2{left:64%;animation-delay:1.1s;width:4px;}
@keyframes dripPulse{0%,100%{height:6px;opacity:.85;}50%{height:12px;opacity:1;}}

.res-ball-wrap{position:relative;width:46px;height:46px;display:grid;place-items:center;flex:0 0 auto;}
.res-ball{position:relative;width:44px;height:44px;display:grid;place-items:center;animation:ballIn .5s cubic-bezier(.175,.885,.32,1.3) .12s both;}
@keyframes ballIn{0%{transform:scale(.3) rotate(-20deg);opacity:0;filter:blur(4px);}100%{transform:scale(1) rotate(0);opacity:1;filter:blur(0);}}
.res-ball::before{
  content:"";position:absolute;inset:-2px;border-radius:50%;
  border:2px dashed #c026ff;
  box-shadow:inset 0 0 10px rgba(192,38,255,.35),0 0 10px var(--red-glow);
  animation:spinCW 3.4s linear infinite;
}
.res-ball::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.18);
  border-top-color:#c026ff;border-bottom-color:#c026ff;
  box-shadow:0 0 6px var(--red-glow);
  animation:spinCCW 2.4s linear infinite;
}
.ball-number-img{
  width:40px;height:40px;object-fit:contain;position:relative;z-index:3;
  filter:drop-shadow(0 0 8px var(--red-glow));
}
.res-num-text{
  position:absolute;inset:0;display:none;place-items:center;z-index:4;
  font-family:'Teko',sans-serif;font-size:27px;font-weight:600;line-height:1;
  color:#c026ff;text-shadow:0 0 10px var(--red-glow);
}
.res-num-text.on{display:grid;}
.result-period-bottom{
  margin-top:3px;position:relative;z-index:3;
  font-family:'Share Tech Mono',monospace;font-size:8px;font-weight:700;
  color:#fff;letter-spacing:.18em;text-align:center;
  text-shadow:0 0 8px var(--red-glow);
  background:linear-gradient(90deg,transparent,rgba(192,38,255,.4),transparent);
  padding:2px 18px;
  border-top:1px solid rgba(192,38,255,.6);border-bottom:1px solid rgba(192,38,255,.6);
  animation:svIn .3s ease both;animation-delay:200ms;
}
.res-shock{
  position:absolute;left:50%;top:52%;width:14px;height:14px;margin:-7px;
  border-radius:50%;border:2px solid #fff;opacity:0;z-index:6;pointer-events:none;
}
.res-shock.go{animation:shockWave .75s ease-out forwards;}
@keyframes shockWave{
  0%{transform:scale(.2);opacity:.95;border-width:3px;}
  100%{transform:scale(9);opacity:0;border-width:1px;}
}

/* ---------- BUTTONS ---------- */
.card-buttons{position:relative;z-index:4;display:flex;gap:7px;padding:2px 0 0;align-items:stretch;pointer-events:auto !important;}
#action-btn{
  flex:1 1 0;min-width:0;position:relative;overflow:hidden;padding:8px 4px;
  clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);
  border:none;white-space:nowrap;cursor:pointer;
  font-family:'Chakra Petch','Orbitron',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:#fff;text-align:center;
  background:linear-gradient(180deg,#d24bff 0%,#7a00b3 45%,#3d0066 100%);
  box-shadow:0 0 13px var(--red-glow),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 6px rgba(0,0,0,.5);
  transition:transform .15s ease,filter .15s ease;
  text-shadow:0 1px 3px rgba(0,0,0,.7);
  pointer-events:auto !important;z-index:10000;
  animation:btnBreath 2s ease-in-out infinite alternate;
}
@keyframes btnBreath{
  from{box-shadow:0 0 9px rgba(192,38,255,.5),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 6px rgba(0,0,0,.5);}
  to{box-shadow:0 0 20px rgba(192,38,255,1),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 6px rgba(0,0,0,.5);}
}
#action-btn:active{transform:scale(.94) translateY(1px);filter:brightness(1.25);}
#action-btn::after{
  content:"";position:absolute;top:0;left:-140%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
  transform:skewX(-25deg);animation:btnSheen 2.2s ease-in-out infinite;
}
@keyframes btnSheen{0%{left:-140%;}45%,100%{left:150%;}}
#action-btn.scanning{
  background:repeating-linear-gradient(45deg,#1e0033 0 6px,#0f001a 6px 12px);
  color:#e0b3ff;animation:stripeMove .8s linear infinite;box-shadow:none;text-shadow:none;
}
@keyframes stripeMove{to{background-position:17px 0;}}
.hide-btn{
  flex:0 0 32%;min-width:0;position:relative;overflow:hidden;padding:8px 4px;cursor:pointer;white-space:nowrap;
  clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);
  font-family:'Chakra Petch','Orbitron',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:#fff;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.03));
  border:none;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7),inset 0 1px 0 rgba(255,255,255,.5),0 0 10px rgba(255,255,255,.2);
  transition:transform .15s ease,background .15s ease;pointer-events:auto !important;z-index:10000;
  text-shadow:0 1px 2px rgba(0,0,0,.8);
}
.hide-btn:active{transform:scale(.94) translateY(1px);background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.1));}

/* ---------- HIT FLASH ---------- */
#hitFlash{
  position:fixed;inset:0;z-index:999998;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.95),rgba(192,38,255,.55) 35%,transparent 72%);
}
#hitFlash.go{animation:hitFlashAnim .6s ease-out forwards;}
@keyframes hitFlashAnim{0%{opacity:0;}12%{opacity:.9;}100%{opacity:0;}}

*::-webkit-scrollbar{width:3px;}
*::-webkit-scrollbar-thumb{background:#c026ff;border-radius:10px;}

@media (max-width:360px){
  #injector-container{width:216px;}
  .title-bar .card-title-line1{font-size:11px;}
  .card-stat{font-size:5.8px;}
  .card-screen{min-height:112px;}
  .state-title{font-size:11.5px;}
  .res-bs-badge{font-size:13.5px;padding:5px 6px;}
  .res-ball-wrap{width:42px;height:42px;}
  .res-ball{width:40px;height:40px;}
  .ball-number-img{width:36px;height:36px;}
  #action-btn{font-size:9.5px;}
  .hide-btn{font-size:8.5px;}
}
</style>
</head>
<body>

<iframe id="target-game-frame" src="about:blank" allow="autoplay"></iframe>

<div id="liveWinLayer" aria-hidden="true"></div>

<div id="miniBtn" role="button" aria-label="Open prediction panel">
  <svg class="mb-ring" viewBox="0 0 62 62" preserveAspectRatio="none">
    <circle class="r1" cx="31" cy="31" r="27"/>
    <circle class="r2" cx="31" cy="31" r="24"/>
  </svg>
  <div class="mb-orbit"><i></i></div>
  <img src="my_icon.png" alt="">
</div>

<div id="injector-container">
  <div class="card-outer" id="cardOuter">
    <span class="bolt b1"></span><span class="bolt b2"></span>
    <span class="bolt b3"></span><span class="bolt b4"></span>

    <svg class="card-stroke" preserveAspectRatio="none"><rect pathLength="100" rx="16"/><rect class="s2" pathLength="100" rx="16"/></svg>

    <div class="card-inner">
      <div class="crt-overlay"></div>
      <div class="laser-sweep"></div>

      <div class="card-header">
        <div class="title-bar">
          <span class="tb-live"><span class="dot"></span>LIVE</span>
          <div class="card-title-line1 cb-main">SpidyXtrade VIP</div>
          <span class="tb-ver">V7.2</span>
        </div>
        <div class="mode-strip">
          <span class="mode-badge" id="modeBadge">AUTH</span>
          <span class="card-stat">BYPASS : <span class="val" id="stat-mod">ON</span></span>
          <span class="card-stat">PING : <span class="val" id="stat-ping">19MS</span></span>
        </div>
      </div>

            <div class="card-screen state-wait" id="cardScreen">
        <canvas id="ember-canvas"></canvas>

        <div class="sc-corner sc-tl" id="sc-tl"></div>
        <div class="sc-corner sc-tr" id="sc-tr"></div>
        <div class="sc-corner sc-bl" id="sc-bl"></div>
        <div class="sc-corner sc-br" id="sc-br"></div>

        <div id="sv-wait">
          <div class="spider-emblem"><img src="my_icon.png" alt=""></div>
          <div class="lock-ic"></div>
          <div class="state-title">SYSTEM LOCKED</div>
          <div class="state-sub">VIP ACCESS REQUIRED</div>
          <div class="state-hint">REGISTER OR LOGIN TO UNLOCK</div>

        <div id="sv-low">
          <div class="warn-tri"><span>!</span></div>
          <div class="state-title" style="color:#ffb300;text-shadow:0 0 10px rgba(255,179,0,.55);">LOW BALANCE</div>
          <div class="state-sub" style="color:#ffb300;text-shadow:0 0 10px rgba(255,179,0,.55),1.5px 1.5px 0 rgba(0,0,0,.9);" id="sv-low-amount">ACCESS DENIED</div>
          <div class="state-hint" id="sv-low-current">MIN DEPOSIT &#8377;300</div>
        </div>

        <div id="sv-ready">
          <div class="spider-emblem"><img src="my_icon.png" alt=""></div>

          <div class="bal-chip"><span id="sv-ready-bal">BALANCE &#8377;0.00</span></div>
          <div class="state-hint" id="sv-ready-hint">TAP OPEN WINGO TO START</div>

          <div class="sv-scan-title" id="scanStageTitle" data-text="SCANNING SIGNAL">SCANNING SIGNAL</div>
          <div class="radar-scope" id="radarScope">
            <div class="rs-ring r1"></div>
            <div class="rs-ring r2"></div>
            <div class="rs-grid"></div>
            <div class="rs-sweep"></div>
            <div class="rs-blips" id="rsBlips"></div>
            <div class="rs-center"></div>
            <div class="rs-pct" id="rsPct">0%</div>
            <div class="rs-lock-brackets">
              <span class="rb rb-tl"></span><span class="rb rb-tr"></span>
              <span class="rb rb-bl"></span><span class="rb rb-br"></span>
            </div>
            <div class="rs-hit" id="rsHit"></div>
          </div>
          <div class="mini-log" id="miniLog"></div>
        </div>

        <div id="sv-result">
          <div class="res-stamp">SIGNAL LOCKED</div>
          <div class="res-main-row">
            <div class="res-bs-badge" id="resBsBadge" data-text="BIG">BIG<span class="bs-goo"></span><span class="bs-goo g2"></span></div>
            <div class="res-ball-wrap">
              <div class="res-ball">
                <img class="ball-number-img" id="ballNum" src="0.png" alt="" onerror="this.style.display='none';document.getElementById('resNumText').classList.add('on');">
                <span class="res-num-text" id="resNumText">0</span>
              </div>
            </div>
          </div>
          <div class="result-period-bottom" id="res-period-bottom">PERIOD: 0000</div>
          <div class="res-shock" id="resShock"></div>
        </div>

      </div>

      <div class="card-buttons">
        <button id="action-btn" class="locked" type="button">REGISTER</button>

      </div>

    </div>
  </div>
</div>

<div id="hitFlash"></div>

<script>

/* -- GHOST-CLICK PROTECTION FOR APK WEBVIEW -- */
function attachBtnHandler(id, handler){
  var el = document.getElementById(id);
  if(!el) return;
  var isHandling = false;
  var execute = function(e){
    if(e){
      try { e.preventDefault(); e.stopPropagation(); } catch(err){}
    }
    if(isHandling) return;
    isHandling = true;
    handler();
    setTimeout(function(){ isHandling = false; }, 400);
  };
  el.addEventListener('click', execute);
  el.addEventListener('touchend', function(e){
    if(e.cancelable){
       try { e.preventDefault(); } catch(err){}
    }
    execute(e);
  }, {passive: false});
}

var emberCanvas=document.getElementById('ember-canvas');
var ectx=emberCanvas?emberCanvas.getContext('2d'):null;
var embers=[];

function resizeCanvas(){
  var screen=document.getElementById('cardScreen');
  if(!screen||!emberCanvas)return;
  emberCanvas.width=screen.offsetWidth;
  emberCanvas.height=screen.offsetHeight;
}
window.addEventListener('resize',resizeCanvas);

function spawnEmber(init){
  if(!emberCanvas)return;
  embers.push({
    x:Math.random()*emberCanvas.width,
    y:init?Math.random()*emberCanvas.height:emberCanvas.height+2,
    vx:(Math.random()-.5)*.3,
    vy:-(0.3+Math.random()*0.9),
    r:0.6+Math.random()*1.6,
    life:1,
    fade:0.008+Math.random()*0.02,
    tw:Math.random()*Math.PI*2
  });
}
function drawEmbers(){
  if(!ectx||!emberCanvas||emberCanvas.width===0)return;
  ectx.clearRect(0,0,emberCanvas.width,emberCanvas.height);
  for(var i=embers.length-1;i>=0;i--){
    var e=embers[i];
    e.x+=e.vx;e.y+=e.vy;e.life-=e.fade;e.tw+=0.08;
    if(e.life<=0||e.y<-4){embers.splice(i,1);continue;}
    var a=Math.max(0,Math.min(1,e.life));
    var flick=0.75+0.25*Math.sin(e.tw*3);
    ectx.beginPath();
    ectx.fillStyle='#c026ff';
    ectx.globalAlpha=a*flick;
    ectx.arc(e.x,e.y,e.r,0,6.2832);
    ectx.fill();
    ectx.globalAlpha=a*flick*0.32;
    ectx.beginPath();
    ectx.arc(e.x,e.y,e.r*2.7,0,6.2832);
    ectx.fill();
  }
  ectx.globalAlpha=1;
  if(Math.random()<0.45)spawnEmber(false);
}
setInterval(drawEmbers,33);

/* ================================================================
   REAL RESULT ENGINE — DRAW API (prediction-style display)
================================================================ */
function parseDrawResponse(j){
  var arr=null;
  if(j&&typeof j==='object'){
    if(Array.isArray(j.data))arr=j.data;
    else if(j.data&&Array.isArray(j.data.list))arr=j.data.list;
    else if(j.data&&Array.isArray(j.data.result))arr=j.data.result;
    else if(j.data&&Array.isArray(j.data.records))arr=j.data.records;
    else if(j.data&&Array.isArray(j.data.items))arr=j.data.items;
    else if(Array.isArray(j.list))arr=j.list;
    if(j.data&&j.data.current){
      var cur=j.data.current;
      if(cur&&(cur.number!==undefined||cur.result!==undefined||cur.value!==undefined)){
        arr=[cur].concat(arr||[]);
      }
    }
  }
  if(!arr&&Array.isArray(j))arr=j;
  if(!arr)return null;
  for(var i=0;i<arr.length;i++){
    var it=arr[i]||{};
    var num=(it.number!==undefined&&it.number!==null&&it.number!=='')?it.number
            :(it.result!==undefined&&it.result!==null&&it.result!=='')?it.result
            :(it.value!==undefined&&it.value!==null&&it.value!=='')?it.value:null;
    if(num===null||num===undefined)continue;
    num=parseInt(num,10);
    if(isNaN(num))continue;
    num=Math.abs(num)%10;
    var iss=it.issueNumber||it.issue||it.issueId||it.period||it.id||'';
    return {n:String(num),s:num>=5?'BIG':'SMALL',issue:String(iss)};
  }
  return null;
}

async function fetchPeriod(){
  try{
    var u=DRAW_API_URL+((DRAW_API_URL.indexOf('?')>=0)?'&':'?')+'_t='+Date.now();
    var res=await fetch(u,{method:'GET',headers:{'Accept':'application/json'},cache:'no-store'});
    if(!res.ok)throw new Error('http '+res.status);
    var j=await res.json();
    var r=parseDrawResponse(j);
    if(r){
      if(r.issue)lastPeriod=r.issue;
      predData={n:r.n,s:r.s};
      var pBot=document.getElementById('res-period-bottom');
      if(pBot&&lastPeriod)pBot.textContent='PERIOD: '+lastPeriod.slice(-4);
    }
  }catch(e){
    if(!predData)predData=LOGIC[Math.floor(Math.random()*10)];

(function(){
  var sx,sy,sl,st,drag=false;
  var skipIds=['action-btn','hideBtn'];
  function inSkip(t){return skipIds.some(function(id){var b=document.getElementById(id);return b&&b.contains(t);});}
  var cardOuter=document.getElementById('cardOuter');
  function startDrag(cx,cy){drag=true;var r=panel.getBoundingClientRect();sx=cx;sy=cy;sl=r.left;st=r.top;panel.style.right='auto';panel.style.bottom='auto';panel.style.left=sl+'px';panel.style.top=st+'px';}
  cardOuter.addEventListener("touchstart",function(e){if(inSkip(e.target))return;startDrag(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  cardOuter.addEventListener("mousedown",function(e){if(inSkip(e.target))return;startDrag(e.clientX,e.clientY);e.preventDefault();});
  document.addEventListener("touchmove",function(e){if(!drag)return;e.preventDefault();panel.style.left=Math.max(0,Math.min(innerWidth-panel.offsetWidth,sl+(e.touches[0].clientX-sx)))+'px';panel.style.top=Math.max(0,Math.min(innerHeight-panel.offsetHeight,st+(e.touches[0].clientY-sy)))+'px';window.reportArea();},{passive:false});
  document.addEventListener("mousemove",function(e){if(!drag)return;panel.style.left=Math.max(0,Math.min(innerWidth-panel.offsetWidth,sl+(e.clientX-sx)))+'px';panel.style.top=Math.max(0,Math.min(innerHeight-panel.offsetHeight,st+(e.clientY-sy)))+'px';window.reportArea();});
  document.addEventListener("touchend",function(){drag=false;});
  document.addEventListener("mouseup",function(){drag=false;});
})();

/* -- TRIGGER LAUNCH CONTROLLER DRAGGING -- */
(function(){
  var sx,sy,sl,st,drag=false,moved=false;
  function getXY(e){if(e.touches&&e.touches.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY};return{x:e.clientX,y:e.clientY};}
  function start(e){moved=false;drag=true;var p=getXY(e),r=miniBtn.getBoundingClientRect();sx=p.x;sy=p.y;sl=r.left;st=r.top;miniBtn.style.right='auto';miniBtn.style.bottom='auto';miniBtn.style.left=sl+'px';miniBtn.style.top=st+'px';}

  miniBtn.addEventListener("touchstart",start,{passive:true});
  miniBtn.addEventListener("mousedown",function(e){start(e);e.preventDefault();});

  function move(p){
      var dx=p.x-sx,dy=p.y-sy;
      if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;
      if(moved){
          miniBtn.style.left=Math.max(0,Math.min(innerWidth-miniBtn.offsetWidth,sl+dx))+'px';
          miniBtn.style.top=Math.max(0,Math.min(innerHeight-miniBtn.offsetHeight,st+dy))+'px';
          window.reportArea();
      }
  }
  document.addEventListener("mousemove",function(e){if(drag)move({x:e.clientX,y:e.clientY});});
  document.addEventListener("touchmove",function(e){
      if(drag){ move({x:e.touches[0].clientX,y:e.touches[0].clientY}); e.preventDefault(); }
  },{passive:false});

  function endTrigger(e){if(drag){var m=moved;drag=false;moved=false;if(!m){openPanel();}}}
  document.addEventListener("mouseup",endTrigger);
  document.addEventListener("touchend",endTrigger);
})();
