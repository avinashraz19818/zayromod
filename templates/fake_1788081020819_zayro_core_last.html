<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SpidyX Apex - Cyber Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;900&family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&family=Bungee&family=Audiowide&family=JetBrains+Mono:wght@600;800&family=Russo+One&family=Teko:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
    --neon-1: #00ff41; 
    --neon-2: #00cc33; 
    --neon-3: #39ff14; 
    --neon-4: #7fff00; 
    --gold: #ccff00; 
    --ink: #000903; 
    --white: #ffffff;
    --red: #ff0055;
    --cyan: #00ffff;
    --amber: #ffb300;
    --flight-speed: 2.2s;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{
    width:100%;height:100%;overflow:hidden;
    background:#000 !important;
    font-family:'Orbitron',sans-serif;
    color:var(--white);
}

#target-game-frame{
    position:absolute;top:0;left:0;width:100%;height:100%;
    border:none;z-index:1;background:#000;
}

#globalFxLayer{
    position:fixed;inset:0;pointer-events:none;z-index:99995;overflow:hidden;
}
.screen-spark{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle, #fff 20%, var(--neon-3) 70%, transparent 100%);
    box-shadow:0 0 8px var(--neon-3), 0 0 14px var(--neon-4);
    opacity:0;
    animation:screenBurstAnim var(--dur) cubic-bezier(.12,.8,.32,1) forwards;
}
@keyframes screenBurstAnim{
    0%{transform:translate(0,0) scale(0.3);opacity:1;}
    60%{opacity:1;transform:translate(var(--tx), var(--ty)) scale(1.3);}
    100%{transform:translate(calc(var(--tx) * 1.15), calc(var(--ty) + 120px)) scale(0.2);opacity:0;}
}

#liveWinLayer{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99990;overflow:hidden;}
.lw-card{
    position:absolute;top:62px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;
    padding:6px 14px 6px 9px;max-width:92vw;width:auto;
    border-radius:14px;
    background:
        radial-gradient(circle at 10% 50%, rgba(0,255,65,.15), transparent 70%),
        linear-gradient(135deg, rgba(0,26,8,.94) 0%, rgba(0,10,3,.96) 60%, rgba(0,20,6,.94) 100%);
    border:1px solid rgba(0,255,65,.4);
    box-shadow:
        0 8px 24px rgba(0,0,0,.92),
        0 0 14px rgba(0,255,65,.22),
        inset 0 0 12px rgba(0,255,65,.12);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:0;
    animation:lwIn .45s cubic-bezier(.18,1.12,.3,1.18) forwards,lwOut .35s ease-in 4.2s forwards;
}
@keyframes lwIn{
    0%{transform:translateX(120%) scale(.9);opacity:0;}
    60%{transform:translateX(-52%) scale(1.02);opacity:1;}
    80%{transform:translateX(-49%) scale(.99);opacity:1;}
    100%{transform:translateX(-50%) scale(1);opacity:1;}
}
@keyframes lwOut{to{transform:translateX(120%) scale(.85);opacity:0;}}
.lw-card::after{
    content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--neon-3),var(--gold),var(--neon-1));
    transform-origin:left center;animation:lwTimer 4.4s linear forwards;opacity:.75;
}
@keyframes lwTimer{from{transform:scaleX(1);}to{transform:scaleX(0);}}
.lw-sig{
    flex:0 0 auto;font-family:'Orbitron',sans-serif;font-size:7.5px;font-weight:900;line-height:1;
    color:#000a03;background:linear-gradient(180deg,var(--neon-4),var(--neon-2));
    border-radius:4px;padding:3px 5px;letter-spacing:.06em;
    box-shadow:0 0 6px rgba(0,255,65,.6);
}
.lw-avatar{
    position:relative;flex-shrink:0;width:28px;height:28px;border-radius:50%;
    background:#001204;border:1.2px solid rgba(0,255,65,.6);
    box-shadow:0 0 8px rgba(0,255,65,.3);
    overflow:hidden;display:grid;place-items:center;
}
.lw-avatar-fb{font-family:'Chakra Petch',sans-serif;font-weight:900;color:var(--neon-3);font-size:12px;}
.lw-avatar img{width:100%;height:100%;object-fit:cover;}
.lw-text{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:0 1 auto;}
.lw-text *{white-space:nowrap;}
.lw-label{
    display:inline-flex;align-items:center;gap:4px;
    font-family:'Orbitron',sans-serif;font-size:6.5px;font-weight:900;
    letter-spacing:.18em;color:var(--neon-4);
}
.lw-label::before{
    content:"";width:4px;height:4px;border-radius:50%;background:var(--neon-3);
    box-shadow:0 0 5px var(--neon-3);animation:dotFlick 1.2s ease-in-out infinite;
}
@keyframes dotFlick{0%,100%{opacity:.35;}50%{opacity:1;}}
.lw-name{
    font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:700;color:#eaffea;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lw-amt{
    display:inline;font-family:'Audiowide',cursive;font-size:11.5px;color:var(--gold);
    text-shadow:0 0 6px rgba(204,255,0,.5);margin-left:5px;
}

#warnOverlay{
    position:fixed;inset:0;z-index:999999;display:none;
    align-items:center;justify-content:center;
    background:rgba(0,5,2,.92);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    pointer-events:auto !important;
}
#warnOverlay.show{display:flex;}
.wo-card{
    position:relative;width:86%;max-width:288px;padding:2px;
    clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px);
    background:linear-gradient(150deg,var(--neon-3) 0%,#00661a 35%,#001a08 55%,#00661a 75%,var(--neon-3) 100%);
    box-shadow:0 0 24px rgba(0,255,65,.5), 0 15px 35px rgba(0,0,0,.95);
    animation:woPop .3s cubic-bezier(.2,.9,.25,1.2) both;
}
@keyframes woPop{0%{transform:scale(.82);opacity:0;}100%{transform:scale(1);opacity:1;}}
.wo-card > *{position:relative;z-index:3;}
.wo-card::before{
    content:"";position:absolute;inset:2px;z-index:1;
    clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px);
    background:
        repeating-radial-gradient(circle at 50% 46%,transparent 0 15px,rgba(0,255,65,.10) 15px 16px),
        radial-gradient(circle at 50% 42%,#00240b 0%,#000f04 62%,#000301 100%);
    box-shadow:inset 0 0 22px rgba(0,255,65,.3);
}
.wo-head{padding:12px 14px 2px;display:flex;align-items:center;justify-content:flex-end;}
.wo-head-badge{
    font-family:'Share Tech Mono',monospace;font-size:7.5px;font-weight:700;letter-spacing:.14em;
    color:var(--neon-3);padding:2px 7px;border:1px solid var(--neon-3);background:rgba(0,0,0,.7);
    border-radius:4px;box-shadow:0 0 6px rgba(0,255,65,.4);
}
.wo-body{padding:8px 14px 14px;text-align:center;}
.wo-title{
    font-family:'Russo One','Chakra Petch',sans-serif;font-size:16px;color:#fff;margin-bottom:5px;
    letter-spacing:.08em;text-transform:uppercase;
    text-shadow:0 0 8px rgba(255,255,255,.35),0 0 12px var(--neon-3);
}
.wo-msg{
    font-family:'Bungee',sans-serif;font-size:12.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--neon-3);margin-bottom:6px;
    text-shadow:0 0 10px rgba(0,255,65,.6);
}
.wo-sub{font-family:'Share Tech Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.12em;color:#fff;text-transform:uppercase;opacity:.9;}
.wo-actions{display:flex;gap:8px;padding:0 14px 14px;}
#warnRegBtn{
    flex:1;padding:10px;cursor:pointer;border:none;border-radius:12px;
    font-family:'Chakra Petch','Orbitron',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.14em;
    color:#000a03;text-transform:uppercase;
    background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 45%),
               linear-gradient(180deg,var(--neon-4) 0%,var(--neon-2) 50%,#00661a 100%);
    box-shadow:0 3px 0 #003d0f,0 0 12px rgba(0,255,65,.5),inset 0 2px 4px rgba(255,255,255,.6);
    transition:transform .15s ease,filter .15s ease;
}
#warnRegBtn:active{transform:scale(.95);filter:brightness(1.15);}

.launcher{
    position:fixed;right:18px;bottom:120px;width:56px;height:56px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,rgba(57,255,20,.3),transparent 65%),
        linear-gradient(145deg,#00280b 0%,#001004 60%,#000000 100%);
    border:1.5px solid rgba(0,255,65,.55);
    box-shadow:
        0 8px 20px rgba(0,0,0,.9),
        0 0 14px rgba(0,255,65,.35),
        inset 0 0 10px rgba(0,255,65,.25);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:9999;
    touch-action:none;
    animation:mbFloat 3.8s ease-in-out infinite;
    backdrop-filter:blur(6px);
}
@keyframes mbFloat{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-6px) rotate(2deg);}}
.launcher.hidden { display: none !important; }
.launcher:active{transform:scale(.90)}

.launcher-glass{
    position:absolute;inset:3px;border-radius:50%;
    background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 65%);
    border:1px solid rgba(57,255,20,.2);
    pointer-events:none;z-index:2;
}
.launcher-core{
    display:flex;align-items:center;justify-content:center;position:relative;z-index:4;
    width:72%;height:72%;border-radius:50%;overflow:hidden;
    background:rgba(0,0,0,0.35);
    filter:drop-shadow(0 0 6px var(--neon-3));
}
.launcher-icon-img{
    width:100%;height:100%;object-fit:cover;object-position:center;
    display:block;pointer-events:none;
}

.launcher-ring{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);pointer-events:none;z-index:1;}
.launcher-ring circle{
    fill:none;stroke:var(--neon-3);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:28 16;
    transform-origin:50% 50%;animation:launcherSpin 6s linear infinite;
    filter:drop-shadow(0 0 3px rgba(0,255,65,.5));
}
.launcher-ring circle.r2{
    stroke:rgba(204,255,0,.75);stroke-width:1.2;stroke-dasharray:9 22;
    animation:launcherSpin 4s linear infinite reverse;
}
@keyframes launcherSpin{to{transform:rotate(360deg)}}

.launcher-orbit{position:absolute;inset:-6px;animation:launcherSpin 3.2s linear infinite;pointer-events:none;z-index:3;}
.launcher-orbit i{
    position:absolute;top:-2px;left:50%;margin-left:-2.5px;width:5px;height:5px;
    border-radius:50%;background:#fff;box-shadow:0 0 8px var(--neon-4);
}
.launcher::before{
    content:"";position:absolute;inset:-3px;border-radius:50%;
    border:1px dashed rgba(0,255,65,.35);z-index:-1;animation:launcherHalo 3s ease-in-out infinite;
}
@keyframes launcherHalo{0%,100%{transform:scale(1);opacity:.35;}50%{transform:scale(1.14);opacity:0;}}

.wrap{
    position:fixed;display:none;align-items:center;justify-content:center;z-index:10000;
    left:50%;top:50%;
    transform:translate(-50%, -50%) scale(.9);
    opacity:0;pointer-events:none;
    transition:opacity 0.25s ease;
    touch-action:none;
    width:auto;height:auto;
}
.wrap.visible{
    display:flex;
    transform:translate(-50%, -50%) scale(1);
    opacity:1;pointer-events:auto;
}

.flight-chassis{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    animation:cardFlyLift var(--flight-speed) ease-in-out infinite;
    will-change: transform;
}
@keyframes cardFlyLift {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(-0.5deg); }
}

.wing-backlight{
    position:absolute;width:280px;height:160px;
    background:radial-gradient(ellipse at center, rgba(0,255,65,.25) 0%, rgba(0,255,65,.08) 50%, transparent 75%);
    filter:blur(14px);pointer-events:none;z-index:0;
}

.wing{
    position:absolute;
    width:230px;height:172px;
    background-image:url('https://i.ibb.co/mF1fS5m2/file-0000000017bc8211a51be6c0e30fe47a.png');
    background-size:contain;background-repeat:no-repeat;
    z-index:1;pointer-events:none;
    will-change: transform;
    filter:drop-shadow(0 0 4px rgba(57,255,20,.28)) drop-shadow(0 0 9px rgba(0,255,65,.16));
}
.wing.left{
    left:-86px;top:46%;background-position:left center;
    clip-path:polygon(0% 0%,66% 0%,66% 100%,0% 100%);
    transform-origin:right 58%;
    animation:wingFlapLeft var(--flight-speed) ease-in-out infinite;
}
.wing.right{
    right:-86px;top:46%;background-position:right center;
    clip-path:polygon(34% 0%,100% 0%,100% 100%,34% 100%);
    transform-origin:left 58%;
    animation:wingFlapRight var(--flight-speed) ease-in-out infinite;
}
@keyframes wingFlapLeft{
    0%, 100% { transform: translateY(-50%) rotate(-12deg) scaleY(0.94); }
    50% { transform: translateY(-50%) rotate(14deg) scaleY(1.06); }
}
@keyframes wingFlapRight{
    0%, 100% { transform: translateY(-50%) rotate(12deg) scaleY(0.94); }
    50% { transform: translateY(-50%) rotate(-14deg) scaleY(1.06); }
}

.dreg-hand-layer{position:absolute;top:32px;width:42px;height:176px;z-index:25;pointer-events:none}
.dreg-hand-left{left:-23px}
.dreg-hand-right{right:-23px;transform:scaleX(-1)}
.dreg-hand-shaker{
    width:100%;height:100%;
    animation:dreg-rage-shake 7.5s infinite;
}
.dreg-finger{position:absolute;width:100%;transform-origin:left center}
.dreg-f1{top:10px;--angle:24deg;animation:dreg-finger-twitch1 3s infinite;}
.dreg-f2{top:48px;--angle:9deg;animation:dreg-finger-twitch2 4s infinite;animation-delay:-1.2s;}
.dreg-f3{top:88px;--angle:-6deg;animation:dreg-finger-twitch3 3.5s infinite;animation-delay:-2s;}
.dreg-f4{top:126px;--angle:-21deg;animation:dreg-finger-twitch4 5s infinite;animation-delay:-3s;}
.dreg-f-base{
    position:absolute;left:0;width:21px;height:11px;
    background:linear-gradient(180deg,#065a08,#000900);
    border-radius:6px 0 0 6px;border-top:1px solid rgba(100,255,100,.5);
    box-shadow:2px 2px 5px rgba(0,0,0,.8);transform:rotateZ(var(--angle))
}
.dreg-f-mid{
    position:absolute;left:18px;top:1.5px;width:14px;height:9px;
    background:linear-gradient(180deg,#087408,#000a00);
    border-radius:2px;transform-origin:left center;transform:rotate(-12deg)
}
.dreg-f-claw{
    position:absolute;left:10px;top:1px;width:23px;height:8px;
    background:linear-gradient(90deg,#eaffea 0%,#20ff20 35%,#004f00 100%);
    clip-path:polygon(0 10%,100% 45%,0 90%,25% 45%);
    transform-origin:left center;transform:rotate(-24deg);
    filter:drop-shadow(0 0 3px rgba(0,255,0,.65))
}
@keyframes dreg-rage-shake{0%,64%{transform:translate(0,0)}66%,78%{transform:translate(1.5px,-1px)}68%,80%{transform:translate(-1.5px,1px)}83%,100%{transform:translate(0,0)}}
@keyframes dreg-finger-twitch1{0%,100%{transform:rotateZ(24deg)}25%{transform:rotateZ(28deg)}}
@keyframes dreg-finger-twitch2{0%,100%{transform:rotateZ(9deg)}30%{transform:rotateZ(13deg)}}
@keyframes dreg-finger-twitch3{0%,100%{transform:rotateZ(-6deg)}20%{transform:rotateZ(-3deg)}}
@keyframes dreg-finger-twitch4{0%,100%{transform:rotateZ(-21deg)}35%{transform:rotateZ(-16deg)}}

.box-wrapper{
    position:relative;
    width:216px;height:274px;
    z-index:10;border-radius:38px;
    background:#000;padding:2px;overflow:hidden;
    box-shadow:0 0 22px rgba(0,255,65,.35), 0 12px 40px rgba(0,0,0,.95);
    isolation: isolate;
    cursor:grab;
}
.box-wrapper:active{cursor:grabbing;}
.box-wrapper::before,.box-wrapper::after{content:'';position:absolute;width:250%;height:250%;top:-75%;left:-75%}
.box-wrapper::before{
    background:conic-gradient(from 0deg, transparent 65%, var(--neon-3) 78%, #ffffff 82%, var(--neon-1) 88%, transparent 100%);
    animation:plasmaSpin 3.8s linear infinite;
    z-index:0;opacity:.85;
}
.box-wrapper::after{
    background:conic-gradient(from 180deg, transparent 65%, var(--neon-2) 78%, var(--gold) 82%, var(--neon-4) 88%, transparent 100%);
    animation:plasmaSpin 5.2s linear infinite reverse;
    z-index:0;opacity:.7;
    animation-delay: -2.6s;
}
@keyframes plasmaSpin{to{transform:rotate(360deg)}}

.box{
    position:relative;width:100%;height:100%;border-radius:36px;
    background:
        radial-gradient(circle at 50% 0%, rgba(0,40,15,.6), transparent 70%),
        linear-gradient(180deg,#001205 0%,#000903 55%,#000301 100%);
    display:flex;flex-direction:column;padding:10px 9px;overflow:hidden;z-index:1;
    box-shadow:inset 0 0 16px rgba(0,255,65,.2);
}

.bg-anim{position:absolute;inset:0;border-radius:36px;overflow:hidden;pointer-events:none;z-index:1;}
.aurora{
    position:absolute;width:200%;height:200%;top:-50%;left:-50%;
    background:radial-gradient(circle at 50% 50%, rgba(0,255,65,.16), transparent 40%),
               radial-gradient(circle at 30% 70%, rgba(57,255,20,.10), transparent 40%),
               radial-gradient(circle at 70% 30%, rgba(127,255,0,.10), transparent 40%);
    filter:blur(14px);
    animation:auroraSwirl 10s ease-in-out infinite alternate;
    mix-blend-mode:screen;
}
@keyframes auroraSwirl{0%{transform:scale(1) rotate(0)}50%{transform:scale(1.2) rotate(18deg)}100%{transform:scale(1.05) rotate(-10deg)}}

.inner{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.hdr{
    display:flex;flex-direction:column;gap:3px;
    padding-bottom:3px;border-bottom:1px solid rgba(57,255,20,.25);
    box-shadow:0 2px 6px rgba(0,255,65,.10);
}
.brand-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:3px 8px;
    background:linear-gradient(90deg,rgba(0,255,65,.12),rgba(0,0,0,.7),rgba(0,255,65,.12));
    border:1px solid rgba(0,255,65,.28);
    border-radius:6px;
}
.card-title-line1{
    font-family:'Audiowide',sans-serif;font-size:11px;letter-spacing:1px;
    color:#fff;text-shadow:0 0 8px rgba(0,255,65,.8);
    font-weight:900;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tb-ver{
    font-family:'Share Tech Mono',monospace;font-size:7px;color:var(--neon-3);
    border:1px solid var(--neon-3);padding:1px 3px;border-radius:3px;
}
.stat-strip{
    display:grid;grid-template-columns:1fr 1fr 1fr;
    gap:3px;width:100%;
}
.stat-pill{
    font-family:'Share Tech Mono',monospace;font-size:6.5px;letter-spacing:.02em;
    color:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;gap:2px;
    padding:2px 3px;border-radius:6px;
    background:rgba(0,20,6,.65);
    border:1px solid rgba(0,255,65,.3);
    white-space:nowrap;overflow:hidden;
}
.stat-pill .val{color:var(--neon-3);font-weight:700;text-shadow:0 0 4px var(--neon-3);}
.stat-dot{width:3.5px;height:3.5px;border-radius:50%;background:var(--neon-3);box-shadow:0 0 4px var(--neon-3);animation:dotFlick 1.4s infinite;}

.stage{flex:1;display:flex;align-items:center;justify-content:center;margin:3px 0;position:relative;}
.eye-housing{
    position:relative;width:172px;height:124px;border-radius:20px;
    background:
        radial-gradient(circle at center, rgba(0,255,65,.12) 0%, transparent 68%),
        linear-gradient(145deg, rgba(0,28,10,.85) 0%, rgba(0,10,3,.95) 100%);
    border:1px solid rgba(0,255,65,.35);
    display:flex;justify-content:center;align-items:center;
    box-shadow:
        0 0 14px rgba(0,255,65,.22),
        inset 0 0 18px rgba(0,255,65,.15);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    overflow:hidden;isolation: isolate;
}

.stage-grid-bg{
    position:absolute;inset:0;pointer-events:none;z-index:2;
    background-image:
        linear-gradient(rgba(0,255,65,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,65,.08) 1px, transparent 1px);
    background-size:12px 12px;
    opacity:.6;
}

.dreg-eye-ring{
    position:relative;z-index:5;width:96px;height:62px;border-radius:14px;
    border:1px solid rgba(50,255,50,.35);
    display:flex;justify-content:center;align-items:center;
    animation:dreg-rotate-ring 7s linear infinite;
    box-shadow:inset 0 0 14px rgba(0,255,0,.22), 0 0 10px rgba(0,255,0,.18);
    background:radial-gradient(circle at center, rgba(0,40,0,.85), rgba(0,0,0,.25));
    transition: opacity 0.3s, transform 0.3s;
}
.dreg-stay-upright{

<script>
"use strict";

/* ==================================================================
   CORE HARDWARE BRIDGE & CONFIG
================================================================== */
var gameFrame = document.getElementById('target-game-frame');

if(typeof window.ZAYRO==='undefined') window.ZAYRO={
  speak:function(t){try{if(!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.90;u.pitch=1.0;window.speechSynthesis.speak(u);}catch(e){}},
  playSound:function(f){try{new Audio(f).play();}catch(e){}},
  stopSound:function(){},
  openUrl:function(u){ if(gameFrame) gameFrame.src = u; },
  navigate:function(u){ if(gameFrame) gameFrame.src = u; }
};
if(typeof window.ZAYROUI==='undefined') window.ZAYROUI={setArea:function(){}};

var REGISTER_URL="https://bdgwin12.com/#/register?invitationCode=7374224428";
var DEPOSIT_URL ="https://bdgwin12.com/#/wallet/Recharge";
var WINGO_URL   ="https://bdgwin12.com/#/saasLottery/WinGo?gameCode=WinGo_30S&lottery=WinGo";
var API_HISTORY_URL = "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

function navTo(url){
  try {
    if (window.ZAYRO && typeof window.ZAYRO.openUrl === 'function') {
        window.ZAYRO.openUrl(url);
    } else if (window.ZAYRO && typeof window.ZAYRO.navigate === 'function') {
        window.ZAYRO.navigate(url);
    } else {
        gameFrame.src = url;
    }
  } catch(e) {
    gameFrame.src = url;
  }
  if (typeof window.reportArea === 'function') window.reportArea();
}

function attachBtnHandler(id, handler){
  var el = document.getElementById(id);
  if(!el) return;
  var isHandling = false;
  var execute = function(e){
    if(e){
      try { e.preventDefault(); e.stopPropagation(); } catch(err){}
    }
    if(isHandling) return;
    isHandling = true;
    handler();
    setTimeout(function(){ isHandling = false; }, 350);
  };
  el.addEventListener('click', execute);
  el.addEventListener('touchend', function(e){
    if(e.cancelable){
       try { e.preventDefault(); } catch(err){}
    }
    execute(e);
  }, {passive: false});
}

/* ==================================================================
   AUDIO TRIGGERS
================================================================== */
var _af='',_at=0;
function stopAudio(){try{window.ZAYRO.stopSound();}catch(e){}_af='';_at=0;}
function playAudio(f){
    var n=Date.now();if(f===_af&&n-_at<3000)return;_af=f;_at=n;
    try{window.ZAYRO.playSound(f);}catch(e){
        try{var a=new Audio(f);a.volume=1;var pp=a.play();if(pp&&pp.catch)pp.catch(function(){});}catch(ee2){}
    }
}
function playAudioForce(f){_af='';_at=0;playAudio(f);}

/* ==================================================================
   SECURITY & INPUT MONITORS (STANDALONE / NO FIREBASE)
================================================================== */
var currentPhone=null, warnActive=false, isOnRegisterPage=false;
var wasAuthFlowActive=false, pendingRegPhone=null;

function checkAndWarn(phone){
  hideWarnOverlay();
}

window.setPhone=function(phone){
  if(!phone)return;
  var p=phone.toString().trim().replace(/[^0-9]/g,'');
  if(p.length===12&&p.startsWith('91'))p=p.substring(2);
  if(p.length<10)return;
  if(isOnRegisterPage){ pendingRegPhone = p; return; }
  currentPhone=p;
};

var _lMon=null;
function startLoginMon() {
  if(_lMon)return;
  _lMon=setInterval(function(){
    try {
      var fDoc = gameFrame.contentDocument || gameFrame.contentWindow.document;
      if(!fDoc) return;
      var inp=fDoc.querySelector('.phoneInput__container-input input');
      if(!inp){
          var all=fDoc.querySelectorAll('input');
          for(var i=0;i<all.length;i++){
              var pl=(all[i].placeholder||'').toLowerCase(),nm=(all[i].name||'').toLowerCase();
              if(pl.indexOf('phone')>=0||pl.indexOf('mobile')||nm.indexOf('phone')>=0||nm.indexOf('user')>=0){inp=all[i];break;}
          }
      }
      if(inp){
          var v=inp.value.replace(/[^0-9+]/g,'');
          if(v.length===12&&v.startsWith('91'))v=v.substring(2);
          if(v.length>=10&&v!==currentPhone){currentPhone=v;}
      }
    } catch(e) {}
  },150);
}
function stopLoginMon(){if(_lMon){clearInterval(_lMon);_lMon=null;}}

var _rMon=null;
function startRegisterMon(){
  if(_rMon)return;
  _rMon=setInterval(function(){
    try{
      var fWin=gameFrame.contentWindow;var fDoc=fWin.document||gameFrame.contentDocument;if(!fDoc)return;

          if(pl.indexOf('phone')>=0||pl.indexOf('mobile')>=0||nm.indexOf('phone')>=0||nm.indexOf('user')>=0){inp=all[i];break;}
      }
      if(inp){
          var v=inp.value.replace(/[^0-9]/g,'');
          if(v.length===12&&v.startsWith('91'))v=v.substring(2);
          if(v.length>=10){ pendingRegPhone = v; }
      }
    }catch(e){}
  },1000);
}
function stopRegisterMon(){if(_rMon){clearInterval(_rMon);_rMon=null;}}

}

attachBtnHandler("warnRegBtn", function(){

});

/* Scraper Interceptor */
var _lastScrapedUrl = "", _lastScrapedBalance = "", _lastScrapedPhone = "";
setInterval(function() {
  try {
    var fWin = gameFrame.contentWindow;
    var fDoc = gameFrame.contentDocument || fWin.document;
    if (!fWin || !fDoc) return;

    var currentIframeUrl = fWin.location.href;
    if (currentIframeUrl !== _lastScrapedUrl && currentIframeUrl !== "about:blank") {
      _lastScrapedUrl = currentIframeUrl;
      window.setUrl(currentIframeUrl);
    }

    var hash = fWin.location.hash || '';
    var isReg = hash.indexOf('register') >= 0 || hash.indexOf('invitationCode') >= 0 || currentIframeUrl.indexOf('register') >= 0;
    var isLog = (hash.indexOf('login') >= 0 || currentIframeUrl.indexOf('login') >= 0) && !isReg;

    if (isLog || isReg) {
      var pinp = fDoc.querySelector('input[placeholder*="phone"]')
               || fDoc.querySelector('input[placeholder*="Phone"]')
               || fDoc.querySelector('input[placeholder*="mobile"]')
               || fDoc.querySelector('input[placeholder*="Mobile"]')
               || fDoc.querySelector('input[type="tel"]')
               || fDoc.querySelector('input[type="number"]')
               || fDoc.querySelector('input[name="userNumber"]');
      if (pinp && !pinp.dataset.hooked) {
        pinp.dataset.hooked = 'true';
        var handler = function(e) {
          var val = e.target.value.replace(/[^0-9+]/g, '');
          if (val.length >= 10 && val !== _lastScrapedPhone) {
            _lastScrapedPhone = val;
            window.setPhone(val);
          }
        };
        pinp.addEventListener('input', handler);
        pinp.addEventListener('blur', handler);
      }
    }

    var foundBal = false;

      '.amount .a1 .a', '.gameHeader__C-balance span', '.gameHeader__C-balance',

      '.header-money span', '.top-bar__balance span', '.userInfo__C-balance span',
      '.balance-amount', '.my-amount'
    ];
    for (var i = 0; i < targetSelectors.length && !foundBal; i++) {
      var el = fDoc.querySelector(targetSelectors[i]);
      if (el) {
        var tx = (el.innerText || el.textContent || el.value || el.getAttribute('data-amount') || el.getAttribute('data-balance') || '').trim();
        tx = tx.replace(/[₹,\s]/g, '').replace(/[^0-9.]/g, '');
        if (tx && tx !== '0' && tx !== _lastScrapedBalance && /[0-9]/.test(tx)) {
          _lastScrapedBalance = tx;
          window.setBalance(tx);
          foundBal = true;
        }
      }
    }
  } catch(e) {}
}, 150);

  everMetMin=true;

window.setState=function(name){
  if(name==='wait'){lastPageState='wait';bypassRunning=false;_goState('wait');}

    _goState('home');
  }
  else if(name==='wingo'){
    lastPageState='wingo';

  }
};

window.setUrl=function(url){
  var u=(url||'').toLowerCase(),hash=u.split('#')[1]||'';
  var prevIsReg = isOnRegisterPage;

  isOnRegisterPage=hash.indexOf('/register')>=0||hash.indexOf('invitationcode')>=0||hash.indexOf('invitecode')>=0;
  var isLogin=hash.indexOf('/login')>=0;

  if (prevIsReg && !isOnRegisterPage && !isLogin && pendingRegPhone) {
      currentPhone = pendingRegPhone;
      pendingRegPhone = null;
  }
  
  if(isOnRegisterPage){
    wasAuthFlowActive = true; 
    hideWarnOverlay();
    stopLoginMon();
    startRegisterMon();
    if(window._rt)clearTimeout(window._rt);
    window._rt=setTimeout(function(){
      window._rt=null;
      playAudio('register.mp3'); 
    }, 3000);
    return;
  } else {
    stopRegisterMon();
  }

  if(window._rt){clearTimeout(window._rt);window._rt=null;}
  
  if(isLogin) {
    wasAuthFlowActive = true; 
    startLoginMon();
  } else {
    stopLoginMon();
  }

  var isWingo=hash.indexOf('/saaslottery')>=0||hash.indexOf('wingo')>=0||hash.indexOf('lottery')>=0;
  
  if(isWingo){
    if(!bypassRunning)window.setState('wingo');else lastPageState='wingo';
  }
  else if(isLogin){
    window.setState('wait');
  }
  else {
    var _wasAuth = wasAuthFlowActive;
    wasAuthFlowActive = false;
    window.setState('home');
    if(_wasAuth && !_successPlayed) {
        _successPlayed=true;
        playAudio('successful.mp3');
    }
  }
};

/* ==================================================================
   API FETCHER & RESULT EXTRACTOR
================================================================== */
async function fetchLatestApiResult(){
  try{
    var res = await fetch(API_HISTORY_URL + "?_=" + Date.now());
    var j = await res.json();
    var item = null;
    
    if(j && j.data && Array.isArray(j.data.list) && j.data.list.length > 0){
      item = j.data.list[0];
    } else if(j && Array.isArray(j.data) && j.data.length > 0){
      item = j.data[0];
    } else if(j && Array.isArray(j.list) && j.list.length > 0){
      item = j.list[0];
    }
    
    if(item){
      var issue = (item.issueNumber || item.period || item.issue || "").toString();
      var num = (item.number !== undefined ? item.number : (item.resultNum !== undefined ? item.resultNum : item.result));
      var numInt = parseInt(num, 10);
      if(isNaN(numInt)) numInt = Math.floor(Math.random()*10);
      
      var size = (numInt >= 5) ? 'BIG' : 'SMALL';
      if(item.size) size = item.size.toUpperCase();
      else if(item.bs) size = (item.bs === 'b' || item.bs === 'B' || item.bs === '1') ? 'BIG' : 'SMALL';
      
      return {
        issue: issue,
        pred: {
          n: numInt.toString(),
          s: size
        }
      };
    }
  }catch(e){}
  
  var fallbackNum = Math.floor(Math.random()*10);
  return {
    issue: "----",
    pred: {
      n: fallbackNum.toString(),
      s: fallbackNum >= 5 ? 'BIG' : 'SMALL'
    }
  };
}

/* ==================================================================
   SCREEN EXPLOSION & BYPASS SCAN ENGINE
================================================================== */
function triggerScreenExplosion(){
  var layer = document.getElementById('globalFxLayer');
  if(!layer) return;
  var rect = mainPanel.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height / 2;
  
  var count = 35;
  for(var i=0; i<count; i++){
    var spark = document.createElement('div');
    spark.className = 'screen-spark';
    var size = 3 + Math.random()*5;
    spark.style.width = size + 'px';
    spark.style.height = size + 'px';
    spark.style.left = cx + 'px';
    spark.style.top = cy + 'px';

    var angle = Math.random() * Math.PI * 2;
    var dist = 60 + Math.random() * 160;
    var tx = Math.cos(angle) * dist;
    var ty = Math.sin(angle) * dist;
    var dur = (0.7 + Math.random()*0.6).toFixed(2) + 's';

    spark.style.setProperty('--tx', tx + 'px');
    spark.style.setProperty('--ty', ty + 'px');
    spark.style.setProperty('--dur', dur);

    layer.appendChild(spark);
    setTimeout((function(el){ return function(){ if(el.parentNode) el.parentNode.removeChild(el); }; })(spark), 1400);
  }
}

async function runBypass(){
  if(bypassRunning)return;
  bypassRunning=true;
  
  hideStatus();
  hidePrediction();
  dregEyeRing.style.opacity = '0.25';
  
  chartLoader.classList.add('active');
  chartPct.textContent = '0%';
  scanStageSub.textContent = 'SCANNING API SEED';
  statusText.textContent = 'SCANNING';
  actionBtn.textContent = 'SCANNING';
  actionBtn.disabled = true;

  // Background fetch while scan progress animation runs
  var apiPromise = fetchLatestApiResult();

  var D = 1500;
  var started = Date.now();
  var done = false;

  var stages = [
      {p: 0.25, txt: 'CONNECTING CORE'},
      {p: 0.55, txt: 'DECODING MD5'},
      {p: 0.85, txt: 'LOCKING TARGET'}
  ];

  var iv = setInterval(async function(){
    var el = Date.now() - started;
    var pct = Math.min(1, el / D);
    chartPct.textContent = Math.floor(pct * 100) + '%';

    for(var s=0; s<stages.length; s++){
        if(pct >= stages[s].p) scanStageSub.textContent = stages[s].txt;
    }

    if(pct >= 1 && !done){
      done = true;
      clearInterval(iv);

      var resData = await apiPromise;
      activeResult = resData.pred;
      activePeriod = resData.issue;

      chartPct.textContent = 'LOCK';
      scanStageSub.textContent = 'SUCCESS';
      triggerScreenExplosion();

      setTimeout(function(){
        chartLoader.classList.remove('active');
        bypassRunning = false;
        wingoHackDone = true;
        curState = 'wingo';
        updateUI();
        
        var isBig = activeResult.s === 'BIG';
        playAudio(isBig ? 'big.mp3' : 'small.mp3');
        try{ window.ZAYRO.speak(activeResult.s + ' ' + activeResult.n); }catch(e){}
      }, 250);
    }
  }, 40);
}

/* Floating Launcher Drag */
(function(){
  var sx,sy,sl,st,drag=false,moved=false;
  function getXY(e){if(e.touches&&e.touches.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY};return{x:e.clientX,y:e.clientY};}
  
  function start(e){
      moved=false;drag=true;
      var p=getXY(e),r=orbEl.getBoundingClientRect();
      sx=p.x;sy=p.y;sl=r.left;st=r.top;
      orbEl.style.right='auto';orbEl.style.bottom='auto';
      orbEl.style.left=sl+'px';orbEl.style.top=st+'px';
  }

  orbEl.addEventListener("touchstart",start,{passive:true});
  orbEl.addEventListener("mousedown",function(e){start(e);e.preventDefault();});

  function move(p){
      if(!drag)return;
      var dx=p.x-sx,dy=p.y-sy;
      if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;
      if(moved){
          var nx=Math.max(10,Math.min(innerWidth-orbEl.offsetWidth-10,sl+dx));
          var ny=Math.max(10,Math.min(innerHeight-orbEl.offsetHeight-10,st+dy));
          orbEl.style.left=nx+'px';
          orbEl.style.top=ny+'px';
          window.reportArea();
      }
  }
  document.addEventListener("mousemove",function(e){if(drag)move({x:e.clientX,y:e.clientY});});
  document.addEventListener("touchmove",function(e){
      if(drag){ move({x:e.touches[0].clientX,y:e.touches[0].clientY}); e.preventDefault(); }
  },{passive:false});

  function endTrigger(){
      if(drag){
          var m=moved;drag=false;moved=false;
          if(!m){ openPanel(); }
      }
  }
  document.addEventListener("mouseup",endTrigger);
  document.addEventListener("touchend",endTrigger);
})();

/* Card Panel Dragging */
(function(){
  var sx,sy,sl,st,drag=false;
  var cardOuter=document.getElementById('cardOuter');
  var skipIds=['action-btn','closeBtn','warnRegBtn'];
  function inSkip(t){return skipIds.some(function(id){var b=document.getElementById(id);return b&&b.contains(t);});}

  function startDrag(cx,cy){
      drag=true;
      var r=mainPanel.getBoundingClientRect();
      sx=cx;sy=cy;sl=r.left;st=r.top;
      mainPanel.style.transform='none';
      mainPanel.style.left=sl+'px';
      mainPanel.style.top=st+'px';
  }
  cardOuter.addEventListener("touchstart",function(e){if(inSkip(e.target))return;startDrag(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  cardOuter.addEventListener("mousedown",function(e){if(inSkip(e.target))return;startDrag(e.clientX,e.clientY);});

  document.addEventListener("touchmove",function(e){
      if(!drag)return;
      e.preventDefault();
      var nx=Math.max(12,Math.min(innerWidth-mainPanel.offsetWidth-12,sl+(e.touches[0].clientX-sx)));
      var ny=Math.max(12,Math.min(innerHeight-mainPanel.offsetHeight-12,st+(e.touches[0].clientY-sy)));
      mainPanel.style.left=nx+'px';mainPanel.style.top=ny+'px';
      window.reportArea();
  },{passive:false});

  document.addEventListener("mousemove",function(e){
      if(!drag)return;
      var nx=Math.max(12,Math.min(innerWidth-mainPanel.offsetWidth-12,sl+(e.clientX-sx)));
      var ny=Math.max(12,Math.min(innerHeight-mainPanel.offsetHeight-12,st+(e.clientY-sy)));
      mainPanel.style.left=nx+'px';mainPanel.style.top=ny+'px';
      window.reportArea();
  });
  document.addEventListener("touchend",function(){drag=false;});
  document.addEventListener("mouseup",function(){drag=false;});
})();
