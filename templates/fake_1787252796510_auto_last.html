<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SpidyX Apex - Cyber Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;900&family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&family=Bungee&family=Audiowide&family=JetBrains+Mono:wght@600;800&family=Russo+One&family=Teko:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
    --neon-1: #00ff41; 
    --neon-2: #00cc33; 
    --neon-3: #39ff14; 
    --neon-4: #7fff00; 
    --gold: #ffe600; 
    --ink: #000903; 
    --white: #ffffff;
    --text-dim: #c5ffd0;
    --red: #ff0044;
    --cyan: #00e5ff;
    --amber: #ffb300;
    --purple: #bd00ff;
    --flight-speed: 2.2s;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{
    width:100%;height:100%;overflow:hidden;
    background:#000 !important;
    font-family:'Orbitron',sans-serif;
    color:var(--white);
}

/* TARGET GAME IFRAME */
#target-game-frame{
    position:absolute;top:0;left:0;width:100%;height:100%;
    border:none;z-index:1;background:#000;display:block;
}

/* FULL SCREEN PARTICLE BURST CANVAS */
#burstCanvasLayer{
    position:fixed;inset:0;width:100vw;height:100vh;
    pointer-events:none;z-index:99995;overflow:hidden;
}

/* LIVE WINNING POPUP */
#liveWinLayer{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99990;overflow:hidden;}
.lw-card{
    position:absolute;top:62px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;
    padding:6px 14px 6px 9px;max-width:92vw;width:auto;
    border-radius:14px;
    background:
        radial-gradient(circle at 10% 50%, rgba(0,255,65,.25), transparent 70%),
        linear-gradient(135deg, rgba(0,26,8,.96) 0%, rgba(0,10,3,.98) 60%, rgba(0,20,6,.96) 100%);
    border:1.2px solid rgba(0,255,65,.6);
    box-shadow:0 8px 24px rgba(0,0,0,.92), 0 0 16px rgba(0,255,65,.35), inset 0 0 12px rgba(0,255,65,.2);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:0;
    animation:lwIn .45s cubic-bezier(.18,1.12,.3,1.18) forwards,lwOut .35s ease-in 4.2s forwards;
}
@keyframes lwIn{
    0%{transform:translateX(120%) scale(.9);opacity:0;}
    60%{transform:translateX(-52%) scale(1.02);opacity:1;}
    80%{transform:translateX(-49%) scale(.99);opacity:1;}
    100%{transform:translateX(-50%) scale(1);opacity:1;}
}
@keyframes lwOut{to{transform:translateX(120%) scale(.85);opacity:0;}}
.lw-card::after{
    content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--neon-3),var(--gold),var(--neon-1));
    transform-origin:left center;animation:lwTimer 4.4s linear forwards;opacity:.9;
}
@keyframes lwTimer{from{transform:scaleX(1);}to{transform:scaleX(0);}}
.lw-sig{
    flex:0 0 auto;font-family:'Orbitron',sans-serif;font-size:7.5px;font-weight:900;line-height:1;
    color:#000a03;background:linear-gradient(180deg,#fff,var(--neon-4));
    border-radius:4px;padding:3px 5px;letter-spacing:.06em;
    box-shadow:0 0 8px rgba(0,255,65,.8);
}
.lw-avatar{
    position:relative;flex-shrink:0;width:28px;height:28px;border-radius:50%;
    background:#001204;border:1.2px solid rgba(0,255,65,.8);
    box-shadow:0 0 8px rgba(0,255,65,.4);
    overflow:hidden;display:grid;place-items:center;
}
.lw-avatar-fb{font-family:'Chakra Petch',sans-serif;font-weight:900;color:#fff;font-size:12px;}
.lw-avatar img{width:100%;height:100%;object-fit:cover;}
.lw-text{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:0 1 auto;}
.lw-text *{white-space:nowrap;}
.lw-label{
    display:inline-flex;align-items:center;gap:4px;
    font-family:'Orbitron',sans-serif;font-size:6.8px;font-weight:900;
    letter-spacing:.18em;color:var(--cyan);text-shadow:0 0 4px var(--cyan);
}
.lw-label::before{
    content:"";width:4px;height:4px;border-radius:50%;background:var(--neon-3);
    box-shadow:0 0 5px var(--neon-3);animation:dotFlick 1.2s ease-in-out infinite;
}
@keyframes dotFlick{0%,100%{opacity:.35;}50%{opacity:1;}}
.lw-name{
    font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:700;color:#ffffff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lw-amt{
    display:inline;font-family:'Audiowide',cursive;font-size:12px;color:var(--gold);
    text-shadow:0 0 8px rgba(255,230,0,.7);margin-left:5px;
}

/* FLOATING LAUNCHER */
.launcher{
    position:fixed;right:18px;bottom:120px;width:56px;height:56px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,rgba(57,255,20,.35),transparent 65%),
        linear-gradient(145deg,#00280b 0%,#001004 60%,#000000 100%);
    border:1.5px solid rgba(0,255,65,.6);
    box-shadow:0 10px 24px rgba(0,0,0,.92), 0 0 16px rgba(0,255,65,.4), inset 0 0 12px rgba(0,255,65,.3);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:9999;
    touch-action:none;
    animation:mbFloat 3.8s ease-in-out infinite;
    backdrop-filter:blur(6px);
}
@keyframes mbFloat{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-6px) rotate(2deg);}}
.launcher.hidden { display: none !important; }
.launcher:active{transform:scale(.90)}

.launcher-glass{
    position:absolute;inset:3px;border-radius:50%;
    background:linear-gradient(135deg,rgba(255,255,255,.15),transparent 65%);
    border:1px solid rgba(57,255,20,.3);
    pointer-events:none;z-index:2;
}
.launcher-core{
    width:72%;height:72%;border-radius:50%;
    overflow:hidden;background:rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;
    position:relative;z-index:4;
    filter:drop-shadow(0 0 6px var(--neon-3));
}
.launcher-icon-img{
    width:100%;height:100%;object-fit:cover;object-position:center;
    display:block;pointer-events:none;border-radius:50%;
}
.launcher-ring{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);pointer-events:none;z-index:1;}
.launcher-ring circle{
    fill:none;stroke:var(--neon-3);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:28 16;
    transform-origin:50% 50%;animation:launcherSpin 6s linear infinite;
    filter:drop-shadow(0 0 3px rgba(0,255,65,.6));
}
.launcher-ring circle.r2{
    stroke:rgba(204,255,0,.75);stroke-width:1.2;stroke-dasharray:9 22;
    animation:launcherSpin 4s linear infinite reverse;
}
@keyframes launcherSpin{to{transform:rotate(360deg)}}
.launcher-orbit{position:absolute;inset:-6px;animation:launcherSpin 3.2s linear infinite;pointer-events:none;z-index:3;}
.launcher-orbit i{
    position:absolute;top:-2px;left:50%;margin-left:-2px;width:5px;height:5px;
    border-radius:50%;background:#fff;box-shadow:0 0 8px var(--neon-4);
}
.launcher::before{
    content:"";position:absolute;inset:-3px;border-radius:50%;
    border:1px dashed rgba(0,255,65,.4);z-index:-1;animation:launcherHalo 3s ease-in-out infinite;
}
@keyframes launcherHalo{0%,100%{transform:scale(1);opacity:.35;}50%{transform:scale(1.14);opacity:0;}}

/* FLIGHT CHASSIS & WINGS */
.wrap{
    position:fixed;display:none;align-items:center;justify-content:center;z-index:10000;
    left:50%;top:50%;
    transform:translate(-50%, -50%) scale(.9);
    opacity:0;pointer-events:none;
    transition:opacity 0.25s ease;
    touch-action:none;
    width:auto;height:auto;
}
.wrap.visible{
    display:flex;
    transform:translate(-50%, -50%) scale(1);
    opacity:1;pointer-events:auto;
}

.flight-chassis{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    animation:cardFlyLift var(--flight-speed) ease-in-out infinite;
    will-change: transform;
}
@keyframes cardFlyLift {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(-0.5deg); }
}

.wing-backlight{
    position:absolute;width:280px;height:160px;
    background:radial-gradient(ellipse at center, rgba(0,255,65,.28) 0%, rgba(0,255,65,.08) 50%, transparent 75%);
    filter:blur(14px);pointer-events:none;z-index:0;
}
.wing{
    position:absolute;width:220px;height:165px;
    background-image:url('https://i.ibb.co/mF1fS5m2/file-0000000017bc8211a51be6c0e30fe47a.png');
    background-size:contain;background-repeat:no-repeat;
    z-index:1;pointer-events:none;will-change: transform;
    filter:drop-shadow(0 0 4px rgba(57,255,20,.3)) drop-shadow(0 0 10px rgba(0,255,65,.2));
}
.wing.left{
    left:-80px;top:48%;background-position:left center;
    clip-path:polygon(0% 0%,66% 0%,66% 100%,0% 100%);
    transform-origin:right 58%;
    animation:wingFlapLeft var(--flight-speed) ease-in-out infinite;
}
.wing.right{
    right:-80px;top:48%;background-position:right center;
    clip-path:polygon(34% 0%,100% 0%,100% 100%,34% 100%);
    transform-origin:left 58%;
    animation:wingFlapRight var(--flight-speed) ease-in-out infinite;
}
@keyframes wingFlapLeft{0%, 100% { transform: translateY(-50%) rotate(-12deg) scaleY(0.94); } 50% { transform: translateY(-50%) rotate(14deg) scaleY(1.06); }}
@keyframes wingFlapRight{0%, 100% { transform: translateY(-50%) rotate(12deg) scaleY(0.94); } 50% { transform: translateY(-50%) rotate(-14deg) scaleY(1.06); }}

/* DRAGON CLAWS */
.dreg-hand-layer{position:absolute;top:30px;width:42px;height:165px;z-index:25;pointer-events:none}
.dreg-hand-left{left:-20px}
.dreg-hand-right{right:-20px;transform:scaleX(-1)}
.dreg-hand-shaker{width:100%;height:100%;animation:dreg-rage-shake 7.5s infinite;}
.dreg-finger{position:absolute;width:100%;transform-origin:left center}
.dreg-f1{top:10px;--angle:24deg;animation:dreg-finger-twitch1 3s infinite;}
.dreg-f2{top:45px;--angle:9deg;animation:dreg-finger-twitch2 4s infinite;animation-delay:-1.2s;}
.dreg-f3{top:82px;--angle:-6deg;animation:dreg-finger-twitch3 3.5s infinite;animation-delay:-2s;}
.dreg-f4{top:118px;--angle:-21deg;animation:dreg-finger-twitch4 5s infinite;animation-delay:-3s;}
.dreg-f-base{position:absolute;left:0;width:21px;height:11px;background:linear-gradient(180deg,#065a08,#000900);border-radius:6px 0 0 6px;border-top:1px solid rgba(100,255,100,.5);box-shadow:2px 2px 5px rgba(0,0,0,.8);transform:rotateZ(var(--angle))}
.dreg-f-mid{position:absolute;left:18px;top:1.5px;width:14px;height:9px;background:linear-gradient(180deg,#087408,#000a00);border-radius:2px;transform-origin:left center;transform:rotate(-12deg)}
.dreg-f-claw{position:absolute;left:10px;top:1px;width:23px;height:8px;background:linear-gradient(90deg,#eaffea 0%,#20ff20 35%,#004f00 100%);clip-path:polygon(0 10%,100% 45%,0 90%,25% 45%);transform-origin:left center;transform:rotate(-24deg);filter:drop-shadow(0 0 3px rgba(0,255,0,.65))}
@keyframes dreg-rage-shake{0%,64%{transform:translate(0,0)}66%,78%{transform:translate(1.5px,-1px)}68%,80%{transform:translate(-1.5px,1px)}83%,100%{transform:translate(0,0)}}
@keyframes dreg-finger-twitch1{0%,100%{transform:rotateZ(24deg)}25%{transform:rotateZ(28deg)}}
@keyframes dreg-finger-twitch2{0%,100%{transform:rotateZ(9deg)}30%{transform:rotateZ(13deg)}}
@keyframes dreg-finger-twitch3{0%,100%{transform:rotateZ(-6deg)}20%{transform:rotateZ(-3deg)}}
@keyframes dreg-finger-twitch4{0%,100%{transform:rotateZ(-21deg)}35%{transform:rotateZ(-16deg)}}

/* PROPORTIONED MAIN COMPACT CARD */
.box-wrapper{
    position:relative;
    width:214px;
    height:268px;
    z-index:10;border-radius:36px;
    background:#000;padding:2px;overflow:hidden;
    box-shadow:0 0 26px rgba(0,255,65,.35), 0 14px 44px rgba(0,0,0,.95);
    isolation: isolate;cursor:grab;
    display:flex;
}
.box-wrapper:active{cursor:grabbing;}
.box-wrapper::before,.box-wrapper::after{content:'';position:absolute;width:250%;height:250%;top:-75%;left:-75%}
.box-wrapper::before{
    background:conic-gradient(from 0deg, transparent 65%, var(--neon-3) 78%, #ffffff 82%, var(--neon-1) 88%, transparent 100%);
    animation:plasmaSpin 3.8s linear infinite;
    z-index:0;opacity:.85;
}
.box-wrapper::after{
    background:conic-gradient(from 180deg, transparent 65%, var(--neon-2) 78%, var(--gold) 82%, var(--neon-4) 88%, transparent 100%);
    animation:plasmaSpin 5.2s linear infinite reverse;
    z-index:0;opacity:.7;animation-delay: -2.6s;
}
@keyframes plasmaSpin{to{transform:rotate(360deg)}}

.box{
    position:relative;width:100%;height:100%;border-radius:34px;
    background:
        radial-gradient(circle at 50% 0%, rgba(0,40,15,.7), transparent 70%),
        linear-gradient(180deg,#001205 0%,#000903 55%,#000301 100%);
    display:flex;flex-direction:column;justify-content:space-between;
    padding:10px 9px 9px;overflow:hidden;z-index:1;
    box-shadow:inset 0 0 18px rgba(0,255,65,.25);
}

.gloss-stream{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3;}
.gloss-line{
    position:absolute;width:1.5px;
    background:linear-gradient(180deg, transparent 0%, rgba(0,255,65,.2) 20%, #ffffff 60%, rgba(0,255,65,.9) 80%, transparent 100%);
    border-radius:2px;filter:drop-shadow(0 0 3px var(--neon-1));opacity:0;animation:glossFall linear infinite;
}
.gl-1{left:16%;height:46px;animation-duration:2.6s;animation-delay:0s;}
.gl-2{left:38%;height:32px;animation-duration:3.2s;animation-delay:1.1s;}
.gl-3{left:64%;height:52px;animation-duration:2.2s;animation-delay:0.5s;}
.gl-4{left:84%;height:38px;animation-duration:3.0s;animation-delay:1.7s;}
.gl-5{left:50%;height:44px;animation-duration:2.8s;animation-delay:2.1s;}
@keyframes glossFall{0%{transform:translateY(-60px);opacity:0;}25%{opacity:.9;}75%{opacity:.9;}100%{transform:translateY(280px);opacity:0;}}

.cyber-dots-overlay{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden;}
.c-dot{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle,#ffffff 15%,var(--neon-3) 70%,transparent 100%);
    box-shadow:0 0 4px var(--neon-3);opacity:0;animation:dotFloat linear infinite;
}
.cd-1{left:12%;width:3px;height:3px;animation-duration:5s;animation-delay:0s;}
.cd-2{left:30%;width:2px;height:2px;animation-duration:6.2s;animation-delay:1.5s;}
.cd-3{left:55%;width:3.5px;height:3.5px;animation-duration:4.4s;animation-delay:2.8s;}
.cd-4{left:75%;width:2px;height:2px;animation-duration:5.8s;animation-delay:0.8s;}
.cd-5{left:88%;width:3px;height:3px;animation-duration:4.8s;animation-delay:3.2s;}
.cd-6{left:44%;width:2.5px;height:2.5px;animation-duration:6.5s;animation-delay:2.0s;}
@keyframes dotFloat{0%{transform:translateY(270px) scale(0.6);opacity:0;}25%{opacity:.85;}80%{opacity:.85;}100%{transform:translateY(-15px) scale(1.1);opacity:0;}}

.panel-sweep{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;border-radius:34px}
.panel-sweep::before{
    content:'';position:absolute;top:-30%;left:-60%;width:60%;height:160%;
    background:linear-gradient(90deg, transparent 0%, rgba(0,255,65,0.00) 20%, rgba(0,255,65,0.07) 45%, rgba(255,255,255,0.12) 50%, rgba(0,255,65,0.07) 55%, transparent 100%);
    transform:skewX(-18deg);animation:panelSweepMove 6.5s linear infinite;filter:blur(1px);
}
@keyframes panelSweepMove{0%{transform:translateX(0) skewX(-18deg)}100%{transform:translateX(320%) skewX(-18deg)}}

.bg-anim{position:absolute;inset:0;border-radius:34px;overflow:hidden;pointer-events:none;z-index:1;}
.aurora{
    position:absolute;width:200%;height:200%;top:-50%;left:-50%;
    background:radial-gradient(circle at 50% 50%, rgba(0,255,65,.16), transparent 40%),
               radial-gradient(circle at 30% 70%, rgba(57,255,20,.10), transparent 40%),
               radial-gradient(circle at 70% 30%, rgba(127,255,0,.10), transparent 40%);
    filter:blur(14px);animation:auroraSwirl 10s ease-in-out infinite alternate;mix-blend-mode:screen;
}
@keyframes auroraSwirl{0%{transform:scale(1) rotate(0)}50%{transform:scale(1.2) rotate(18deg)}100%{transform:scale(1.05) rotate(-10deg)}}

.inner{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;justify-content:space-between;}
.hdr{
    display:flex;flex-direction:column;gap:3px;
    padding-bottom:3px;border-bottom:1px solid rgba(57,255,20,.35);
    box-shadow:0 2px 6px rgba(0,255,65,.15);
}

.title-bar{
    display:flex;align-items:center;justify-content:center;
    padding:3px 8px;width:100%;min-height:24px;
    background:linear-gradient(90deg,rgba(0,255,65,.2),rgba(0,0,0,.85),rgba(0,255,65,.2));
    border:1px solid rgba(0,255,65,.45);border-radius:8px;
    box-shadow:0 1px 4px rgba(0,0,0,.8);overflow:hidden;
}

.brand-wrapper{
    width:100%;display:flex;align-items:center;justify-content:center;
    overflow:hidden;
}

.card-title-line1{
    font-family:'Audiowide',sans-serif;
    font-size:clamp(8px, 3.5vw, 11px);
    letter-spacing:0.8px;
    color:#ffffff;font-weight:900;text-align:center;
    white-space:nowrap;
    text-shadow:0 0 8px rgba(0,255,65,.8), 0 0 14px rgba(255,255,255,.4);
    display:inline-block;
    transition:font-size 0.2s ease;
}

.stat-strip{
    display:flex;align-items:center;justify-content:space-between;
    padding:1px 0;gap:2px;width:100%;
}
.stat-pill{
    font-family:'Share Tech Mono',monospace;font-size:6.5px;letter-spacing:.02em;
    color:#ffffff;display:inline-flex;align-items:center;gap:2px;
    padding:2px 3px;border-radius:6px;flex:1 1 0;justify-content:center;
    background:linear-gradient(180deg, rgba(0,255,65,.2) 0%, rgba(0,20,6,.75) 100%);
    border:1px solid rgba(0,255,65,.4);white-space:nowrap;
}
.stat-pill .val{color:var(--gold);font-weight:700;text-shadow:0 0 5px var(--gold);}

/* STAGE & HOUSING */
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;margin:4px 0;}
.eye-housing{
    position:relative;
    width:182px;
    height:116px;
    border-radius:18px;
    background:
        radial-gradient(circle at center, rgba(0,255,65,.18) 0%, transparent 70%),
        linear-gradient(145deg, rgba(0,24,8,.95) 0%, rgba(0,8,2,.98) 100%);
    border:1.2px solid rgba(0,255,65,.55);
    display:flex;justify-content:center;align-items:center;
    box-shadow:0 0 18px rgba(0,255,65,.35), inset 0 0 22px rgba(0,255,65,.25);
    overflow:hidden;isolation:isolate;
}

.stage-grid-bg{
    position:absolute;inset:0;pointer-events:none;z-index:2;
    background-image:
        linear-gradient(rgba(0,255,65,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,65,.12) 1px, transparent 1px);
    background-size:10px 10px;opacity:.65;
}
.stage-cross-h{position:absolute;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(0,229,255,.5),transparent);z-index:2;}
.stage-cross-v{position:absolute;height:100%;width:1px;background:linear-gradient(180deg,transparent,rgba(0,229,255,.5),transparent);z-index:2;}

.corner-tick{position:absolute;width:7px;height:7px;border-style:solid;border-color:var(--neon-3);pointer-events:none;z-index:4;filter:drop-shadow(0 0 3px var(--neon-3));}
.ct-tl{top:3px;left:3px;border-width:1.5px 0 0 1.5px;}
.ct-tr{top:3px;right:3px;border-width:1.5px 1.5px 0 0;}
.ct-bl{bottom:3px;left:3px;border-width:0 0 1.5px 1.5px;}
.ct-br{bottom:3px;right:3px;border-width:0 1.5px 1.5px 0;}

/* DRAGON EYE ANIMATION */
.dreg-eye-ring{
    position:relative;z-index:5;width:86px;height:54px;border-radius:12px;
    border:1px solid rgba(50,255,50,.45);
    display:flex;justify-content:center;align-items:center;
    animation:dreg-rotate-ring 7s linear infinite;
    box-shadow:inset 0 0 14px rgba(0,255,0,.3), 0 0 12px rgba(0,255,0,.25);
    background:radial-gradient(circle at center, rgba(0,50,0,.9), rgba(0,0,0,.45));
    transition: opacity 0.3s;
}
.dreg-stay-upright{width:54px;height:28px;display:flex;justify-content:center;align-items:center;animation:dreg-counter-rotate 7s linear infinite;}
.dreg-eye-blink{width:100%;height:100%;animation:dreg-organic-blink 7s cubic-bezier(.8,0,.2,1) infinite;}
.dreg-dragon-eye{
    width:100%;height:100%;background:radial-gradient(ellipse at center, #005a00 0%, #001a00 80%, #000 100%);
    clip-path:path('M 0 14 Q 27 -5 54 14 Q 27 33 0 14');

/* BURST EXPLOSION ENGINE */
var burstCanvas = document.getElementById('burstCanvasLayer');

var burstParticles = [];

function resizeBurstCanvas(){
  if(!burstCanvas) return;
  burstCanvas.width = window.innerWidth;
  burstCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeBurstCanvas);
resizeBurstCanvas();

function triggerBurstExplosion(originX, originY){
  if(!bctx) return;
  var count = 180;
  var colors = ['#00ff41', '#00e5ff', '#ffe600', '#ffffff', '#bd00ff', '#39ff14'];
  
  for(var i=0; i<count; i++){
    var angle = Math.random() * Math.PI * 2;
    var speed = 4 + Math.random() * 18;
    burstParticles.push({
      x: originX,
      y: originY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - (3 + Math.random() * 6),
      gravity: 0.28,
      size: 2.2 + Math.random() * 3.5,
      alpha: 1,
      decay: 0.003 + Math.random() * 0.005,
      color: colors[Math.floor(Math.random() * colors.length)],
      bounce: 0.35 + Math.random() * 0.25,
      isResting: false,
      restTimer: 0,
      glow: Math.random() > 0.4
    });
  }
}

function renderBurstLoop(){
  if(!bctx || !burstCanvas) return;
  bctx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);
  var floorY = burstCanvas.height - 8;

  for(var i = burstParticles.length - 1; i >= 0; i--){
    var p = burstParticles[i];
    
    if(!p.isResting){
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.985;

      if(p.y >= floorY){
        p.y = floorY - Math.random() * 2;
        p.vy = -p.vy * p.bounce;
        p.vx *= 0.6;
        if(Math.abs(p.vy) < 1.2){
          p.isResting = true;
          p.vy = 0;
        }
      }
    } else {
      p.restTimer++;
      if(p.restTimer > 40){
        p.alpha -= 0.015;
      }
    }

    if(p.alpha <= 0){
      burstParticles.splice(i, 1);
      continue;
    }

    bctx.save();
    bctx.globalAlpha = Math.max(0, p.alpha);
    bctx.fillStyle = p.color;
    if(p.glow){
      bctx.shadowBlur = 8;
      bctx.shadowColor = p.color;
    }
    bctx.beginPath();
    bctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    bctx.fill();
    bctx.restore();
  }
  requestAnimationFrame(renderBurstLoop);
}
requestAnimationFrame(renderBurstLoop);

  for(var i=0; i<total; i++){

    var dist = 60 + Math.random() * 70;
    var targetA = (i % 6) * (Math.PI / 3);
    var shapeRadius = (i % 2 === 0) ? 28 : 16;
    var tx = cx + Math.cos(targetA + (i*0.05)) * shapeRadius;
    var ty = cy + Math.sin(targetA + (i*0.05)) * shapeRadius;

    swarmParticles.push({
      x: cx + Math.cos(angle) * dist,
      y: cy + Math.sin(angle) * dist,
      startX: cx + Math.cos(angle) * dist,
      startY: cy + Math.sin(angle) * dist,
      targetX: tx,
      targetY: ty,
      size: 1.5 + Math.random() * 2,
      color: (i % 3 === 0) ? '#00e5ff' : ((i % 3 === 1) ? '#00ff41' : '#ffe600'),
      speed: 0.04 + Math.random() * 0.04
    });

}

function renderSwarmLoop(){
  if(!hctx || !hCanvas) return;
  hctx.clearRect(0, 0, hCanvas.width, hCanvas.height);

  var cx = hCanvas.width / 2;
  var cy = hCanvas.height / 2;
  var prog = convergenceTargetProgress;

  hctx.strokeStyle = "rgba(0, 229, 255, " + (prog * 0.4) + ")";
  hctx.lineWidth = 0.8;

  for(var i=0; i<swarmParticles.length; i++){
    var p = swarmParticles[i];
    p.x += (p.targetX - p.x) * (0.05 + prog * 0.1);
    p.y += (p.targetY - p.y) * (0.05 + prog * 0.1);

    hctx.save();
    hctx.fillStyle = p.color;
    hctx.shadowBlur = 6;
    hctx.shadowColor = p.color;
    hctx.beginPath();
    hctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    hctx.fill();
    hctx.restore();

    if(prog > 0.4 && i % 4 === 0){
      var nextP = swarmParticles[(i + 1) % swarmParticles.length];
      hctx.beginPath();
      hctx.moveTo(p.x, p.y);
      hctx.lineTo(nextP.x, nextP.y);
      hctx.stroke();
    }
  }

  if(prog > 0.6){
    hctx.save();
    hctx.strokeStyle = "rgba(255, 230, 0, " + (prog * 0.8) + ")";
    hctx.lineWidth = 1.5;
    hctx.beginPath();
    hctx.arc(cx, cy, 14 * prog, 0, Math.PI * 2);
    hctx.stroke();
    hctx.restore();
  }

  scanAnimId = requestAnimationFrame(renderSwarmLoop);
}

function calculateNextPeriod(periodStr){
  if(!periodStr) return '----';
  try {
    var bigVal = BigInt(periodStr.trim());
    return (bigVal + 1n).toString();
  } catch(e) {
    var num = parseInt(periodStr, 10);
    return !isNaN(num) ? (num + 1).toString() : periodStr;
  }
}

/* SCANNER EXECUTION */
function runBypass(){
  if(bypassRunning) return;
  bypassRunning = true;
  
  hideStatus();
  predDisplay.style.display = 'none';
  dregEyeRing.style.opacity = '0.05';
  
  stageScanner.classList.add('active');
  scanPctText.textContent = '0%';
  statusText.textContent = 'SCANNING';
  actionBtn.textContent = 'SCANNING';
  actionBtn.disabled = true;

  initSwarmParticles();
  if(!scanAnimId) renderSwarmLoop();

  var STAGES = [
    { at: 0.10, log: "[swarm] <span>CONVERGING MATRIX NODES</span>" },
    { at: 0.35, log: "[crypto] <span>ALIGNING SACRED HEXAGRAM</span>" },
    { at: 0.65, log: "[kernel] <span>DECRYPTING SERVER SEED</span>" },
    { at: 0.88, log: "[singularity] <span>SYNCHRONIZING CORE</span>" }
  ];

  var D = 1400;
  var started = Date.now();
  var done = false;

  var iv = setInterval(function(){
    var el = Date.now() - started;
    var pct = Math.min(1, el / D);
    convergenceTargetProgress = pct;
    scanPctText.textContent = Math.floor(pct * 100) + '%';

    for(var s=0; s<STAGES.length; s++){
      if(pct >= STAGES[s].at) scanLogText.innerHTML = STAGES[s].log;
    }

    if(pct >= 1 && !done){
      done = true;
      clearInterval(iv);

      var res = latestResultData || { n: '5', s: 'BIG' };
      lockedPeriod = nextPredictionPeriod;
      lockedResult = res;

      scanPctText.textContent = 'LOCKED';
      scanLogText.innerHTML = "[done] <span>PREDICTION LOCKED</span>";

      var cardRect = mainPanel.getBoundingClientRect();
      var cX = cardRect.left + cardRect.width / 2;
      var cY = cardRect.top + cardRect.height / 2;
      triggerBurstExplosion(cX, cY);

      setTimeout(function(){
        if(scanAnimId){ cancelAnimationFrame(scanAnimId); scanAnimId = null; }
        stageScanner.classList.remove('active');
        bypassRunning = false;
        updateUI();
        
        var isBig = res.s === 'BIG';
        playAudio(isBig ? 'big.mp3' : 'small.mp3');
        try{ window.ZAYRO.speak(res.s + ' ' + res.n); }catch(e){}
      }, 200);
    }
  }, 35);
}

/* LIVE API RESULT FETCHER WITH PERIOD + 1 */
async function fetchPeriodResult(){
  try{
    var targetUrl = "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";
    var res = await fetch(targetUrl);
    var j = await res.json();
    
    var item = null;
    if(j && j.data && Array.isArray(j.data.list) && j.data.list.length > 0){
      item = j.data.list[0];
    } else if(j && Array.isArray(j.data) && j.data.length > 0){
      item = j.data[0];
    } else if(j && Array.isArray(j.list) && j.list.length > 0){
      item = j.list[0];
    }

    if(item){
      var issue = (item.issueNumber || item.issue || item.period || item.periodNumber || "").toString();
      var num = item.number !== undefined ? item.number : (item.result !== undefined ? item.result : item.openNumber);
      num = parseInt(num, 10);
      
      if(isNaN(num)){
        var rawStr = (item.openNumber || item.result || "").toString();
        var match = rawStr.match(/\d+/);
        num = match ? parseInt(match[0], 10) : 0;
      }

      var size = (num >= 5) ? 'BIG' : 'SMALL';
      latestResultData = { n: num.toString(), s: size };

      if(issue && issue !== rawApiPeriod){
        rawApiPeriod = issue;
        nextPredictionPeriod = calculateNextPeriod(issue);
        
        if(!bypassRunning){
          lockedPeriod = nextPredictionPeriod;
          lockedResult = latestResultData;
          updateUI();
        }
      }
    }
  } catch(e){}
}

(function(){
  var sx,sy,sl,st,drag=false,moved=false;
  function getXY(e){if(e.touches&&e.touches.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY};return{x:e.clientX,y:e.clientY};}
  
  function start(e){
      moved=false;drag=true;
      var p=getXY(e),r=orbEl.getBoundingClientRect();
      sx=p.x;sy=p.y;sl=r.left;st=r.top;
      orbEl.style.right='auto';orbEl.style.bottom='auto';
      orbEl.style.left=sl+'px';orbEl.style.top=st+'px';
  }

  orbEl.addEventListener("touchstart",start,{passive:true});
  orbEl.addEventListener("mousedown",function(e){start(e);e.preventDefault();});

  function move(p){
      if(!drag)return;
      var dx=p.x-sx,dy=p.y-sy;
      if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;
      if(moved){
          var nx=Math.max(10,Math.min(innerWidth-orbEl.offsetWidth-10,sl+dx));
          var ny=Math.max(10,Math.min(innerHeight-orbEl.offsetHeight-10,st+dy));
          orbEl.style.left=nx+'px';
          orbEl.style.top=ny+'px';
          window.reportArea();
      }
  }
  document.addEventListener("mousemove",function(e){if(drag)move({x:e.clientX,y:e.clientY});});
  document.addEventListener("touchmove",function(e){
      if(drag){ move({x:e.touches[0].clientX,y:e.touches[0].clientY}); e.preventDefault(); }
  },{passive:false});

  function endTrigger(){
      if(drag){
          var m=moved;drag=false;moved=false;
          if(!m){ openPanel(); }
      }
  }
  document.addEventListener("mouseup",endTrigger);
  document.addEventListener("touchend",endTrigger);
})();

(function(){
