--------------------------------------------------------------- */

.scan-log{

}
.term-container {

  border-radius: 4px;
  padding: 6px 8px;

  margin: 2px auto 0;
  text-align: left;
  position: relative;

.term-container::before {

}
@keyframes typeLine { 0% { max-width: 0; } 100% { max-width: 100%; } }
.term-line.cmd { color: #fff; font-weight: 700; }
.term-line.info { color: #ff4d4d; }
.term-line.warn { color: #ff9f00; text-shadow: 0 0 4px rgba(255,159,0,0.5); }

/* RESULT VIEW & PERFECT FIT BALL ENHANCEMENTS */
#sv-result { display:none; flex-direction:column; align-items:center; justify-content:center; width:100%; position:relative; z-index:4; gap:3px; animation:svIn .22s cubic-bezier(0.15, 0.6, 0.35, 1) both; }

.result-balls { 
  display: flex; align-items: center; justify-content: center; gap: 14px; 
  width: 100%; padding: 12px 5px 8px; position: relative;
}

.result-ball { 
  position: relative; border-radius: 50%; display: grid; place-items: center; z-index: 2;
  background: transparent;
  box-shadow: none;
  animation: ballAppear .45s cubic-bezier(.175,.885,.32,1.15) both; 
}

/* Outer & Inner rings that tightly fit the balls */
.result-ball::before {
  content: ""; position: absolute; inset: 0px; border-radius: 50%;
  border: 2px dashed rgba(255, 0, 0, 0.9);
  box-shadow: inset 0 0 12px rgba(255,0,0,0.4), 0 0 10px rgba(255,0,0,0.5);
  animation: spinCW 3.5s linear infinite; z-index: 0;
}
.result-ball::after {
  content: ""; position: absolute; inset: -5px; border-radius: 50%;
  border: 1.5px solid rgba(255, 100, 100, 0.2);
  border-top-color: #ff0000; border-bottom-color: #ff0000;
  box-shadow: 0 0 6px rgba(255,0,0,0.3);
  animation: spinCCW 2.5s linear infinite; z-index: 0;
}

.result-ball:nth-child(1) { animation-delay: 0ms; }
.result-ball:nth-child(2) { transform: scale(1.25); margin: 0 5px; animation-delay: 60ms; }
.result-ball:nth-child(3) { animation-delay: 120ms; }

/* The image itself sets the size */
.result-ball .ball-number-img { 
  width: 44px; height: 44px; object-fit: contain; position: relative; z-index: 3; 
  filter: drop-shadow(0 0 8px rgba(255,0,0,0.7)); 
}

/* NEW PERIOD NUMBER DESIGN (BOTTOM ONLY) */
.result-period-bottom {
  margin-top: 5px; position: relative; z-index: 3;
  font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: 700;
  color: #fff; letter-spacing: .15em; text-align: center;
  text-shadow: 0 0 8px var(--red-glow);
  background: linear-gradient(90deg, transparent, rgba(255,0,0,0.5), transparent);
  padding: 4px 20px; border-radius: 4px;
  border-top: 1px solid rgba(255,0,0,0.6); border-bottom: 1px solid rgba(255,0,0,0.6);
  animation: svIn 0.3s ease both; animation-delay: 200ms;
}

@keyframes ballAppear{0%{transform:scale(0.5);opacity:0;filter:blur(4px);}100%{transform:scale(1) (nth-child(2) scale(1.25));opacity:1;filter:blur(0);}}

function resizeCanvas() {
  var screen = document.getElementById('cardScreen');
  if(!screen) return;
  canvas.width = screen.offsetWidth;
  canvas.height = screen.offsetHeight;
  var numCols = Math.floor(canvas.width / fontSize) + 1;
  columns = [];
  for (var i = 0; i < numCols; i++) {
    columns[i] = Math.floor(Math.random() * (canvas.height / fontSize)); 
  }
}

var chars = "01UX????????789456#$@&%*";
function drawMatrixRain() {
  if (canvas.width === 0 || canvas.height === 0) return;
  
  ctx.fillStyle = 'rgba(4, 1, 1, 0.22)'; 
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.font = 'bold ' + fontSize + 'px "Share Tech Mono", monospace';
  
  for (var i = 0; i < columns.length; i++) {
    var text = chars.charAt(Math.floor(Math.random() * chars.length));
    var x = i * fontSize;
    var y = columns[i] * fontSize;
    
    if (Math.random() > 0.96) {
      ctx.fillStyle = '#FFFFFF';
    } else {
      ctx.fillStyle = 'rgba(255, 0, 0, 0.75)'; 
    }
    
    ctx.fillText(text, x, y);
    
    if (y > canvas.height && Math.random() > 0.975) {
      columns[i] = 0;
    }
    columns[i]++;
  }
}
setInterval(drawMatrixRain, 33);

/* -- SYSTEM FINITE STATE MACHINE -- */
var curState='wait',bypassRunning=false;
var lastPeriod=null,predData=null;
var lockedPeriod=null,lockedPrediction=null;
var wingoHackDone=false;
var minDeposit=300,everMetMin=false,lastBalance=-1,lastPageState='wait',_lowBalancePlayed=false, _successPlayed=false;

window.setMinDeposit=function(amt){minDeposit=parseFloat(amt)||300;updateUI();};

window.setBalance=function(bal){
  lastBalance=parseFloat(bal)||0;
  
  if(lastBalance<10){
    everMetMin=false;
    if(curState==='low' || curState==='wingo'||curState==='home'||curState==='wait')_goState('low');
  }
  else if(lastBalance>=minDeposit){
    everMetMin=true;
    if(curState==='low')_goState(lastPageState!=='wait'?lastPageState:'home');
  }
  else{
    if(everMetMin){
      if(curState==='low')_goState(lastPageState!=='wait'?lastPageState:'home');
    }else{
      if(curState!=='wingo'&&curState!=='low')_goState('low');
    }
  }
  updateUI();
};

window.setState=function(name){
  if(name==='wait'){lastPageState='wait';bypassRunning=false;_goState('wait');}
  else if(name==='home'){
    lastPageState='home';
    bypassRunning=false;
    if(everMetMin||lastBalance>=minDeposit) _goState('home');
    else _goState('low');
  }
  else if(name==='wingo'){
    lastPageState='wingo';
    if(bypassRunning)return;
    if(everMetMin||lastBalance>=minDeposit){_goState('wingo');wingoHackDone=false;}
    else _goState('low');
  }
};

/* -- URL ROUTING WITH LOGIC & MP3 -- */
window.setUrl=function(url){
  var u=(url||'').toLowerCase(),hash=u.split('#')[1]||'';
  var prevIsReg = isOnRegisterPage;

  isOnRegisterPage=hash.indexOf('/register')>=0||hash.indexOf('invitationcode')>=0||hash.indexOf('invitecode')>=0||u.indexOf('/register')>=0||u.indexOf('invitecode')>=0;
  var isLogin=(hash.indexOf('/login')>=0||u.indexOf('/login')>=0) && !isOnRegisterPage;

  if (prevIsReg && !isOnRegisterPage && !isLogin && pendingRegPhone) {
      currentPhone = pendingRegPhone;
      pendingRegPhone = null;
  }
  
  if(isOnRegisterPage){
    wasAuthFlowActive = true; 
    hideWarnOverlay();
    stopLoginMon();
    startRegisterMon();
    if(window._rt)clearTimeout(window._rt);
    window._rt=setTimeout(function(){
      window._rt=null;
      playAudio('register.mp3'); 
    }, 3000);
    return;
  } else {
    stopRegisterMon();
    if(!isLogin && pendingRegPhone) {
         currentPhone = pendingRegPhone;
         pendingRegPhone = null;
    }
  }

  if(window._rt){clearTimeout(window._rt);window._rt=null;}
  
  if(isLogin) {
    wasAuthFlowActive = true; 
    startLoginMon();
  } else {
    stopLoginMon();
  }

  var isWingo=hash.indexOf('/saaslottery')>=0||hash.indexOf('wingo')>=0||hash.indexOf('lottery')>=0||u.indexOf('wingo')>=0||u.indexOf('lottery')>=0;
  
  if(isWingo){
    if(!bypassRunning)window.setState('wingo');else lastPageState='wingo';
  }
  else if(isLogin){
    window.setState('wait');
  }
  else {
    var _wasAuth = wasAuthFlowActive;
    wasAuthFlowActive = false;
    window.setState('home');
    if(_wasAuth && !_successPlayed) {
        _successPlayed=true;
        playAudio('successful.mp3');
    }
  }
};

function _goState(n){
  stopAudio();
  curState=n;
  if(n==='wait') { _lowBalancePlayed=false; _successPlayed=false; }
  if(n==='low'){
    if(lastPageState==='wingo'){
      setTimeout(function(){
        if(curState==='low') playAudioForce('deposit.mp3');
      },120);
    } else if(!_lowBalancePlayed){
      _lowBalancePlayed=true;
      setTimeout(function(){
        if(curState==='low') playAudioForce('lowbalance.mp3');
      },120);
    }
  }
  if(n==='wingo'&&!everMetMin){setTimeout(function(){if(!everMetMin&&curState==='wingo')playAudioForce('deposit.mp3');},2200);}
  updateUI();
}

function setMode(t){var m=document.getElementById('modeBadge');if(m)m.textContent=t;}

function updateUI(){
  var btn=document.getElementById('action-btn');
  btn.className='';
  if(curState==='wait'){
    setTheme(THEMES.wait);showOnly('sv-wait');setMode('AUTH');
    btn.textContent='REGISTER';btn.className='locked';btn.disabled=false;
  } else if(curState==='home'){
    setTheme(THEMES.low);showOnly('sv-low');setMode('WINGO');
    var bf=lastBalance>=0?'\u20B9'+lastBalance.toLocaleString('en-IN',{maximumFractionDigits:2}):'\u20B9---';
    document.getElementById('sv-low-amount').textContent='BALANCE '+bf;
    document.getElementById('sv-low-current').textContent='GO TO GAME OR DEPOSIT';
    btn.textContent='OPEN WINGO';btn.className='wingo';btn.disabled=false;
  } else if(curState==='low'){
    setTheme(THEMES.low);showOnly('sv-low');setMode('WALLET');
    document.getElementById('sv-low-amount').textContent='ACCESS DENIED';
    document.getElementById('sv-low-current').textContent='MIN DEPOSIT \u20B9'+minDeposit;
    btn.textContent='DEPOSIT';btn.className='recharge';btn.disabled=false;
  } else if(curState==='wingo'){
    setMode('GAME');
    var rb=document.getElementById('sv-ready-bal');
    if(rb) rb.textContent='BALANCE \u20B9'+(lastBalance>=0?lastBalance.toLocaleString('en-IN',{maximumFractionDigits:2}):'0.00');
    if(wingoHackDone&&lockedPrediction){
      var isBig=lockedPrediction.s==='BIG';
      setTheme(isBig?THEMES.big:THEMES.small);showOnly('sv-result');
      renderResult(lockedPrediction);
      btn.textContent='EXECUTE';btn.className='analyze';btn.disabled=false;
    } else {
      setTheme(THEMES.ready);showOnly('sv-ready');
      btn.textContent='EXECUTE';btn.className='analyze';btn.disabled=false;
    }
  }
}

function renderResult(pred){
  var big=pred.s==='BIG';
  var conf=Math.floor(92+Math.random()*7);
  var cls=big?'big':'small';

  var num1=document.getElementById('ballNum1');
  var num2=document.getElementById('ballNum2');
  var num3=document.getElementById('ballNum3');
  if(num1){ num1.style.display=''; num1.onerror=function(){this.style.display='none';}; num1.src = pred.n + ".png"; }
  if(num2){ num2.style.display=''; num2.onerror=function(){this.style.display='none';}; num2.src = pred.n + ".png"; }
  if(num3){ num3.style.display=''; num3.onerror=function(){this.style.display='none';}; num3.src = pred.n + ".png"; }

  if(lastPeriod){
    var element = document.getElementById('res-period-text');
    if(element) element.textContent = "SEQ NO : " + lastPeriod.slice(-5);
    var pp2=document.getElementById('periodText');
    if(pp2) pp2.textContent = "PERIOD: " + lastPeriod.slice(-4);
    var pl=document.getElementById('res-period-line');
    if(pl) pl.textContent = "PERIOD " + pl.slice(-4);
    var pBot = document.getElementById('res-period-bottom');
    if(pBot) pBot.textContent = "PERIOD: " + lastPeriod.slice(-4);
  }

  animateConfBar(conf,big);
}

/* POPUP CARD BUTTON HANDLERS FIX FOR TOUCH & CLICK */
attachBtnHandler('action-btn', function(){
  if(curState==='wait')navTo(REGISTER_URL);
  else if(curState==='home')navTo(WINGO_URL);
  else if(curState==='low')navTo(DEPOSIT_URL);
  else if(curState==='wingo'){
    if(wingoHackDone){wingoHackDone=false;lockedPrediction=null;lockedPeriod=null;}
    runBypass();
  }
});

attachBtnHandler('hideBtn', function(){
  closePanel();
});


/* -- ULTRA FAST HACKING TERMINAL SYSTEM (NOW WITH REAL API RESULT) -- */
function runBypass(){
  if(bypassRunning)return;bypassRunning=true;
  
  // Execution pe direct fetch hoga nayi prediction ke liye
  fetchPeriod();
  
  var useSamePred=(lockedPeriod&&lockedPeriod===lastPeriod&&lockedPrediction)?lockedPrediction:null;
  var btn=document.getElementById('action-btn');
  setTheme(THEMES.scan);showOnly('sv-scan');

  btn.textContent='SCANNING';btn.className='scanning';btn.disabled=true;

  var log=document.getElementById('scan-log');
  
  log.innerHTML = '<div class="term-container" id="term-box"></div>';
  var termBox = document.getElementById('term-box');

  /* Sequence script with ultra-fast timings (total ~2s) */
  var seq = [
    { time: 0,    cls: 'cmd',     text: 'root@spidyxtrade:~# ./nexara_core --force-inject' },
    { time: 150,  cls: 'info',    text: '[sys] Initializing bypass payload...' },
    { time: 350,  cls: 'warn',    text: '[warn] Cloudflare WAF detected!' },
    { time: 550,  cls: 'success', text: '[ok] WAF bypassed via SQLi proxy.' },
    { time: 750,  cls: 'info',    text: '[sys] Extracting MD5 seed hash...' },
    { time: 900,  cls: 'hex',     text: '' }, 
    { time: 1500, cls: 'success', text: '[ok] Hash decrypted.' },
    { time: 1700, cls: 'info',    text: '[sys] Calculating algorithm prediction...' },
    { time: 1900, cls: 'success', text: '[ok] PAYLOAD DEPLOYED.' }
  ];

  var hexLine = null;
  var hexInterval = null;
  var startTime = Date.now();
  var linesCount = 0;

  function addLine(cls, text) {
    var el = document.createElement('div');
    el.className = 'term-line ' + cls;
    el.textContent = text;
    termBox.appendChild(el);
    linesCount++;
    if(linesCount > 6) { 
      termBox.removeChild(termBox.firstChild);
    }
    return el;
  }

  var seqIdx = 0;
  var iv = setInterval(function(){
    var now = Date.now() - startTime;
    
    while(seqIdx < seq.length && now >= seq[seqIdx].time) {
      var step = seq[seqIdx];
      
      if(step.cls === 'hex') {
         hexLine = addLine('hex', '0x000000000000');
         var chars = "0123456789ABCDEF";
         hexInterval = setInterval(function(){
            var str = "0x";
            for(var i=0; i<12; i++) str += chars[Math.floor(Math.random()*16)];
            if(hexLine) hexLine.textContent = str;
         }, 30);
      } else {
         if(hexInterval && seqIdx > 5) {
            clearInterval(hexInterval); 
            hexInterval = null;
         }
         addLine(step.cls, step.text);
      }
      seqIdx++;
    }

    if(seqIdx >= seq.length && now > 2100) {
      clearInterval(iv);
      if(hexInterval) clearInterval(hexInterval);
      
      bypassRunning=false;wingoHackDone=true;

      var finalPred;
      if(useSamePred){finalPred=useSamePred;}
      else{
        // Prediction ki jagah direct API ka result data use kiya jayega
        var lg = predData || { n: 0, s: 'SMALL' }; // Default fallback agar API load na ho
        finalPred = lg;
        lockedPeriod = lastPeriod;
        lockedPrediction = finalPred;
      }
      curState='wingo';updateUI();btn.disabled=false;
      var big=finalPred.s==='BIG';
      playAudio(big?'big.mp3':'small.mp3');
      try{window.ZAYRO.speak(finalPred.s+' '+finalPred.n);}catch(e){}
    }
  }, 30);
}

// Ye function direct API se data fetch karke usko save karta hai
async function fetchPeriod(){
  try{
    var res=await fetch(API_URL, {
        method: 'GET',
        headers: { 'Accept': 'application/json' }
    });
    var j=await res.json();
    
    // Multiple variations of json data parsing just to be safe
    var list = null;
    if (j.data && Array.isArray(j.data.list)) list = j.data.list;
    else if (j.data && Array.isArray(j.data.issueList)) list = j.data.issueList;
    else if (Array.isArray(j.data)) list = j.data;
    else if (Array.isArray(j.list)) list = j.list;
    else if (Array.isArray(j)) list = j;

    if(list && list.length > 0){
      var latest = list[0]; 
      
      var cur = (latest.issueNumber || latest.issue || latest.period || latest.planNo || "").toString();
      var numStr = (latest.number !== undefined ? latest.number : (latest.result !== undefined ? latest.result : latest.prizeNum));
      var num = parseInt(numStr || "0");
      var size = num >= 5 ? 'BIG' : 'SMALL';

      if(cur !== "" && cur !== lastPeriod){
        lastPeriod = cur;
        
        // Save history result exactly as prediction data
        predData = { n: num, s: size };
        
        var element = document.getElementById('res-period-text');
        if(element) element.textContent = "SEQ NO : " + cur.slice(-5);
        var pp = document.getElementById('periodText');
        if(pp) pp.textContent = "PERIOD: " + cur.slice(-4);
        var pl2 = document.getElementById('res-period-line');
        if(pl2) pl2.textContent = "PERIOD " + cur.slice(-4);
        var pBot = document.getElementById('res-period-bottom');
        if(pBot) pBot.textContent = "PERIOD: " + cur.slice(-4);
      }
    }
  }catch(e){
      // console.warn("API Fetch Failed:", e);
  }
}

/* -- PANEL DRAGGING LISTENERS -- */
(function(){
  var sx,sy,sl,st,drag=false;
  var skipIds=['action-btn','hideBtn','warnRegBtn'];
  function inSkip(t){return skipIds.some(function(id){var b=document.getElementById(id);return b&&b.contains(t);});}
  var cardOuter=document.getElementById('cardOuter');
  function startDrag(cx,cy){drag=true;var r=panel.getBoundingClientRect();sx=cx;sy=cy;sl=r.left;st=r.top;panel.style.right='auto';panel.style.bottom='auto';panel.style.left=sl+'px';panel.style.top=st+'px';}
  cardOuter.addEventListener("touchstart",function(e){if(inSkip(e.target))return;startDrag(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  cardOuter.addEventListener("mousedown",function(e){if(inSkip(e.target))return;startDrag(e.clientX,e.clientY);e.preventDefault();});
  document.addEventListener("touchmove",function(e){if(!drag)return;e.preventDefault();panel.style.left=Math.max(0,Math.min(innerWidth-panel.offsetWidth,sl+(e.touches[0].clientX-sx)))+'px';panel.style.top=Math.max(0,Math.min(innerHeight-panel.offsetHeight,st+(e.touches[0].clientY-sy)))+'px';window.reportArea();},{passive:false});
  document.addEventListener("mousemove",function(e){if(!drag)return;panel.style.left=Math.max(0,Math.min(innerWidth-panel.offsetWidth,sl+(e.clientX-sx)))+'px';panel.style.top=Math.max(0,Math.min(innerHeight-panel.offsetHeight,st+(e.clientY-sy)))+'px';window.reportArea();});
  document.addEventListener("touchend",function(){drag=false;});
  document.addEventListener("mouseup",function(){drag=false;});
})();

/* -- TRIGGER LAUNCH CONTROLLER DRAGGING -- */
(function(){
  var sx,sy,sl,st,drag=false,moved=false;
  function getXY(e){if(e.touches&&e.touches.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY};return{x:e.clientX,y:e.clientY};}
  function start(e){moved=false;drag=true;var p=getXY(e),r=miniBtn.getBoundingClientRect();sx=p.x;sy=p.y;sl=r.left;st=r.top;miniBtn.style.right='auto';miniBtn.style.bottom='auto';miniBtn.style.left=sl+'px';miniBtn.style.top=st+'px';}

  miniBtn.addEventListener("touchstart",start,{passive:true});
  miniBtn.addEventListener("mousedown",function(e){start(e);e.preventDefault();});

  function move(p){
      var dx=p.x-sx,dy=p.y-sy;
      if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;
      if(moved){
          miniBtn.style.left=Math.max(0,Math.min(innerWidth-miniBtn.offsetWidth,sl+dx))+'px';
          miniBtn.style.top=Math.max(0,Math.min(innerHeight-miniBtn.offsetHeight,st+dy))+'px';
          window.reportArea();
      }
  }
  document.addEventListener("mousemove",function(e){if(drag)move({x:e.clientX,y:e.clientY});});
  document.addEventListener("touchmove",function(e){
      if(drag){ move({x:e.touches[0].clientX,y:e.touches[0].clientY}); e.preventDefault(); }
  },{passive:false});

  function endTrigger(e){if(drag){var m=moved;drag=false;moved=false;if(!m){openPanel();}}}
  document.addEventListener("mouseup",endTrigger);
  document.addEventListener("touchend",endTrigger);
})();
