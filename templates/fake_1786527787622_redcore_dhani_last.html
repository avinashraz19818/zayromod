<style>
/* ═══════════════════════════════════════════════════════════════
   1. PREMIUM RED CYBER THEME TOKENS
═══════════════════════════════════════════════════════════════ */
:root{
  --bg-0: transparent;
  --bg-1: #060101;
  --bg-2: #0B0202;
  --ink: #FFF5F5;
  --ink-dim: #D1BABA;
  --ink-mute: #543030;

  --red-light: #FF5252;
  --red-main: #FF0000;
  --red-dark: #8A0000;
  --red-glow: rgba(255, 0, 0, 0.6);
  --red-soft: rgba(255, 0, 0, 0.15);

  --neon: #FF0000;
  --neon-glow: rgba(255, 0, 0, 0.7);

  --hot: #FF1A1A;
  --cyan: #00F5FF;
  --lime: #00FF66;
  --amber: #FF9F00;

  --line: rgba(255, 0, 0, 0.3);
  --line-strong: rgba(255, 0, 0, 0.7);

  /* Gradients */
  --grad-red: linear-gradient(135deg, #FF4444 0%, #FF0000 50%, #7A0000 100%);
  --grad-dark-card: linear-gradient(180deg, #160404 0%, #060000 100%);
  --grad-btn-dark: linear-gradient(180deg, #2E0808 0%, #120101 100%);
  --grad-cyan: linear-gradient(135deg, #00F5FF 0%, #0077B6 100%);
}

/* ═══════════════════════════════════════════════════════════════
   2. RESET & BASE
═══════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;overflow:hidden;}
body{
  font-family:'Share Tech Mono',monospace;
  color:var(--ink);
  background:#000 !important;
  letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;
}
#target-game-frame{position:absolute;top:0;left:0;width:100%;height:100%;border:none;z-index:1;}

/* ═══════════════════════════════════════════════════════════════
   3. LIVE-WINNING TICKER LAYER
═══════════════════════════════════════════════════════════════ */
#liveWinLayer{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:99990;overflow:hidden;
}
.lw-card{
  position:absolute;top:75px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;
  padding:8px 14px 8px 8px;min-width:250px;max-width:92vw;
  background:linear-gradient(120deg,rgba(18,0,0,.96) 0%,rgba(38,4,4,.96) 48%,rgba(12,0,0,.96) 100%);
  border:1px solid rgba(255,45,45,.45);
  border-radius:999px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 10px 24px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);
  opacity:0;
  animation:lwIn .34s cubic-bezier(.16,1.05,.3,1) forwards, lwOut .3s ease-in 4.2s forwards;
}
.lw-card::after{
  content:"";position:absolute;left:8px;right:8px;bottom:3px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,#FF3B3B,#FF9A9A,#FF3B3B);
  transform-origin:left center;animation:lwTimer 4.4s linear forwards;opacity:.75;
}
@keyframes lwTimer{from{transform:scaleX(1);}to{transform:scaleX(0);}}
@keyframes lwIn{
  from{opacity:0;transform:translateX(-50%) translateY(-16px) scale(.9);}
  to{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
}
@keyframes lwOut{
  to{opacity:0;transform:translateX(-50%) translateY(-14px) scale(.94);}
}
.lw-avatar{
  position:relative;flex-shrink:0;
  width:36px;height:36px;border-radius:50%;
  background:#170202;
  border:1.5px solid rgba(255,70,70,.6);
  box-shadow:0 0 10px rgba(255,0,0,.20);
  overflow:hidden;display:grid;place-items:center;
}
.lw-avatar::after{
  content:"";position:absolute;inset:-3px;border-radius:50%;
  border:1px solid rgba(255,60,60,.55);border-top-color:transparent;border-left-color:transparent;
  animation:lwRing 2.4s linear infinite;
}
@keyframes lwRing{to{transform:rotate(360deg);}}
.lw-avatar-fb{font-family:'Chakra Petch',sans-serif;font-weight:900;color:#FF6B6B;font-size:14px;}
.lw-avatar img{width:100%;height:100%;object-fit:cover;}
.lw-text{display:flex;flex-direction:column;line-height:1.32;min-width:0;flex:1;}
.lw-label{
  display:inline-flex;align-items:center;gap:5px;
  font-family:'Chakra Petch','Orbitron',sans-serif;font-size:7px;font-weight:900;
  letter-spacing:.26em;color:#FF6060;
}
.lw-label::before{
  content:"";width:5px;height:5px;border-radius:50%;background:#FF3B3B;
  box-shadow:0 0 6px rgba(255,60,60,.8);animation:lwDot 1.2s ease-in-out infinite;
}
@keyframes lwDot{0%,100%{opacity:.35;}50%{opacity:1;}}
.lw-name{
  font-family:'Chakra Petch',system-ui,sans-serif;font-size:11.5px;font-weight:700;color:#F3E7E7;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lw-name .lw-amt{
  font-family:'Audiowide',cursive;color:#FF4747;font-weight:400;
  text-shadow:0 0 6px rgba(255,50,50,.35);margin-left:5px;
}

/* ═══════════════════════════════════════════════════════════════
   5. FLOATING LAUNCH TRIGGER WITH DETAILED RINGS
═══════════════════════════════════════════════════════════════ */
#miniBtn {
  position: fixed; right: 18px; bottom: 115px; z-index: 9998;
  width: 56px; height: 56px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  touch-action: none; pointer-events: auto !important;
  background:
    radial-gradient(circle at 34% 26%, rgba(255,90,90,.28), transparent 60%),
    linear-gradient(155deg,#240404 0%,#0e0101 55%,#000 100%);
  border: 1px solid rgba(255,70,70,.55);
  box-shadow: 0 8px 16px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.10);
  animation: floatPanelTrigger 4s ease-in-out infinite;
}
@keyframes floatPanelTrigger {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
/* rotating segmented ring */
.mb-ring{position:absolute;inset:-5px;width:calc(100% + 10px);height:calc(100% + 10px);pointer-events:none;}
.mb-ring circle{
  fill:none;stroke:#FF2B2B;stroke-width:2;stroke-linecap:round;
  stroke-dasharray:26 14;transform-origin:50% 50%;
  animation:mbRingSpin 6s linear infinite;
  filter:drop-shadow(0 0 3px rgba(255,40,40,.65));
}
.mb-ring circle.r2{
  stroke:rgba(255,255,255,.75);stroke-width:1.2;stroke-dasharray:6 30;
  animation:mbRingSpin 4s linear infinite reverse;
}
@keyframes mbRingSpin{to{transform:rotate(360deg);}}
/* orbiting node */
.mb-orbit{position:absolute;inset:-5px;animation:mbRingSpin 3.2s linear infinite;pointer-events:none;}
.mb-orbit i{
  position:absolute;top:-2px;left:50%;margin-left:-2.5px;
  width:5px;height:5px;border-radius:50%;background:#fff;
  box-shadow:0 0 8px rgba(255,60,60,.95);
}
/* soft breathing pulse */
#miniBtn::before {
  content: ""; position: absolute; inset: -1px; border-radius: 50%;
  border: 1px solid rgba(255,60,60,.35);
  z-index: -1; animation: mbHalo 2.6s ease-in-out infinite;
}
@keyframes mbHalo{
  0%,100%{ transform: scale(1); opacity:.4; }
  50%{ transform: scale(1.14); opacity:0; }
}
#miniBtn .mb-core { width: 27px; height: 26px; color: #FF4A4A; z-index: 2;
  filter: drop-shadow(0 0 3px rgba(255,40,40,.6)); animation: mbPulse 2.2s ease-in-out infinite; }
@keyframes mbPulse { 0%,100%{ transform: scale(1); opacity:.95; } 50%{ transform: scale(1.08); opacity:1; } }
#miniBtn img { display:none; }
#miniBtn:active { transform: scale(.93); }

/* ═══════════════════════════════════════════════════════════════
   6. SPIDER CORE CHASSIS (SCREENSHOT-MATCH DESIGN)
═══════════════════════════════════════════════════════════════ */
#injector-container{
  position:fixed;right:14px;bottom:95px;z-index:9999;
  width:236px;display:none;touch-action:none; pointer-events: none !important;
  animation:panelPop .13s cubic-bezier(.15,1.1,.3,1) both;
}
@keyframes panelPop{
  from{opacity:0;transform:translateY(6px) scale(.94);}
  to{opacity:1;transform:none;}
}


/* ── WHITE BEZEL + RED GLOW SHELL ── */
.card-outer{
  position:relative;z-index:2;padding:3px;border-radius:28px;
  background:linear-gradient(150deg,#ffffff 0%,#f4f4f4 50%,#d6d6d6 100%);
  box-shadow:
    0 0 3px 0 rgba(255,0,0,.10),
    0 10px 22px rgba(0,0,0,.75);
  animation:shellGlow 4s ease-in-out infinite alternate;
  pointer-events: auto !important;
}
@keyframes shellGlow{
  from{box-shadow:0 0 2px 0 rgba(255,0,0,.08),0 10px 22px rgba(0,0,0,.75);}
  to{box-shadow:0 0 5px 0 rgba(255,0,0,.14),0 10px 22px rgba(0,0,0,.75);}
}

.card-outer::before{
  content:"";position:absolute;inset:-2px;border-radius:30px;z-index:-1;
  background:linear-gradient(160deg,rgba(255,0,0,.85),rgba(255,255,255,.35),rgba(255,0,0,.85));
  filter:blur(4px);opacity:.05;
}
/* ── ANIMATED STROKE (marching dash outline) ── */
.card-stroke{position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none;overflow:visible;}
.card-stroke rect{
  x:2px;y:2px;width:calc(100% - 4px);height:calc(100% - 4px);
  fill:none;stroke:#fff;stroke-width:2.6;
  stroke-dasharray:14 86;stroke-linecap:round;
  filter:drop-shadow(0 0 4px rgba(255,255,255,.7)) drop-shadow(0 0 7px rgba(255,0,0,.5));
  animation:strokeRun 3.2s linear infinite;
}
.card-stroke rect.s2{stroke:#FF2020;animation-delay:-1.6s;stroke-dasharray:10 90;}
@keyframes strokeRun{to{stroke-dashoffset:-100;}}
.card-outer::after{
  content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;z-index:6;
  background:linear-gradient(112deg,transparent 44%,rgba(255,255,255,.55) 49.5%,rgba(255,255,255,.9) 50.5%,rgba(255,255,255,.45) 52%,transparent 57%);
  background-size:300% 100%;opacity:.55;
  animation:shellShine 4.5s ease-in-out infinite;
}
@keyframes shellShine{0%{background-position:200% 0;opacity:0;}10%{opacity:.6;}45%{opacity:.6;}55%,100%{background-position:-100% 0;opacity:0;}}

.card-inner{
  position:relative;overflow:hidden;padding:8px 9px 9px;
  border-radius:25px;
  background:#040000;
  border:5px solid #EC0000;
  box-shadow:inset 0 0 12px rgba(255,0,0,.10), 0 0 3px rgba(255,0,0,.18);
}

/* ── SPIDER WEB RADAR BACKDROP ── */
.cyber-grid-backdrop{
  position:absolute;inset:-18%;pointer-events:none;z-index:1;opacity:.55;
  background-image:
    repeating-radial-gradient(circle at 50% 50%, transparent 0 21px, rgba(255,26,26,.55) 21px 22.4px),
    repeating-conic-gradient(from 8deg at 50% 50%, rgba(255,26,26,.55) 0deg .5deg, transparent .5deg 30deg);
  mask-image:radial-gradient(circle at 50% 50%, #000 62%, transparent 92%);
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 62%, transparent 92%);
  animation:webSpin 60s linear infinite;
}
@keyframes webSpin{to{transform:rotate(360deg);}}

/* ── DIAGONAL LIGHT STREAK ── */
.cyber-laser-sweep{
  position:absolute;top:-40%;left:-30%;width:46%;height:190%;
  background:linear-gradient(90deg,transparent,rgba(90,170,255,.22) 35%,rgba(255,255,255,.4) 50%,rgba(90,170,255,.2) 65%,transparent);
  transform:rotate(22deg);filter:blur(3px);z-index:2;pointer-events:none;
  animation:streakMove 5s ease-in-out infinite;
}
@keyframes streakMove{
  0%{left:-60%;opacity:0;} 20%{opacity:.95;} 60%{opacity:.95;} 100%{left:120%;opacity:0;}
}

.card-header,.card-screen,.card-buttons,.period-pill{position:relative;z-index:5;}

/* ── HEADER : REDCORE + MODE BADGE ── */
.card-header{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:0 2px 5px;
}
.card-title-line1{
  font-family:'Audiowide',cursive;font-size:14px;font-weight:400;
  letter-spacing:.03em;
  background:linear-gradient(100deg,#FF2A2A 0%,#FF2A2A 34%,#FFB3B3 50%,#FF2A2A 66%,#FF2A2A 100%);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 5px rgba(255,0,0,.55));
  animation:titleShine 3.4s linear infinite;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
@keyframes titleShine{to{background-position:-300% 0;}}
.card-title-line1 .at{color:var(--red-main);}
.mode-badge{
  font-family:'Share Tech Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.14em;
  color:#fff;padding:3px 9px;border-radius:999px;
  border:1.5px solid rgba(255,255,255,.9);
  background:linear-gradient(180deg,rgba(255,60,60,.55),rgba(0,0,0,.75));
  box-shadow:0 0 10px rgba(255,60,60,.6), inset 0 0 8px rgba(255,255,255,.2);
  animation:badgeBlink 2.4s ease-in-out infinite alternate;
}
@keyframes badgeBlink{from{box-shadow:0 0 6px rgba(255,60,60,.4), inset 0 0 8px rgba(255,255,255,.15);}to{box-shadow:0 0 16px rgba(255,80,80,.95), inset 0 0 10px rgba(255,255,255,.3);}}
.card-stat-strip{display:none;}

/* ── PERIOD CAPSULE (PREDICTION ONLY) ── */
.period-pill{display:none;}
.card-outer.state-result-big .period-pill,
.card-outer.state-result-small .period-pill{
  display:block;
  margin:0 6px 4px;padding:3px 8px;border-radius:999px;
  border:1px solid rgba(255,90,90,.9);
  background:linear-gradient(90deg,rgba(70,0,0,.95),rgba(160,0,0,.55),rgba(70,0,0,.95));
  background-size:220% 100%;
  box-shadow:0 0 12px rgba(255,0,0,.5), inset 0 0 12px rgba(255,0,0,.3);
  text-align:center;overflow:hidden;
  animation:periodFlow 3s linear infinite, svIn .3s ease both;
}
@keyframes periodFlow{to{background-position:220% 0;}}
.period-pill span{
  font-family:'Share Tech Mono',monospace;font-size:9px;font-weight:700;
  letter-spacing:.16em;color:#fff;text-shadow:0 0 8px var(--red-glow);
}

/* ── SCREEN MODULE ── */
.card-screen{
  position:relative;overflow:visible;
  margin:9px 9px 9px;padding:10px 7px;min-height:92px;
  border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(2,0,0,.55);
  border:3px solid #E10000;
  box-shadow: 0 0 6px rgba(255,0,0,.35), inset 0 0 14px rgba(255,0,0,.14);
}
.card-screen::after{
  content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;z-index:6;overflow:hidden;
  background:linear-gradient(112deg,transparent 46%,rgba(255,255,255,.28) 50%,transparent 55%);
  background-size:300% 100%;animation:screenShine 4.5s ease-in-out .35s infinite;
}
@keyframes screenShine{0%{background-position:200% 0;}55%,100%{background-position:-100% 0;}}
.card-screen.border-red   {border-color:rgba(255,0,0,.55);}
.card-screen.border-orange{border-color:rgba(255,60,60,.6);}
.card-screen.border-blue  {border-color:rgba(255,0,0,.7);}
.card-screen.border-green {border-color:rgba(255,0,0,.6);}
.card-screen.border-big   {border-color:var(--red-main); box-shadow: inset 0 0 26px rgba(255,0,0,.35);}
.card-screen.border-small {border-color:rgba(255,0,0,.75); box-shadow: inset 0 0 26px rgba(255,0,0,.3);}

#matrix-canvas{display:none !important;}

.sc-corner{position:absolute;width:16px;height:16px;border-style:solid;z-index:4;pointer-events:none;}
.sc-tl{top:-9px;left:-9px;border-width:3px 0 0 3px;}
.sc-tr{top:-9px;right:-9px;border-width:3px 3px 0 0;}
.sc-bl{bottom:-9px;left:-9px;border-width:0 0 3px 3px;}
.sc-br{bottom:-9px;right:-9px;border-width:0 3px 3px 0;}
.sc-corner.red,.sc-corner.orange,.sc-corner.blue,.sc-corner.green,
.sc-corner.bright-green,.sc-corner.bright-blue{
  border-color:var(--red-main);filter:drop-shadow(0 0 5px var(--red-main));
}

/* ═══════════════════════════════════════════════════════════════
   7. STATE VIEWS
═══════════════════════════════════════════════════════════════ */
#sv-wait,#sv-low,#sv-ready,#sv-scan,#sv-result{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  width:100%;position:relative;z-index:4;gap:3px;
  animation:svIn .22s cubic-bezier(0.15, 0.6, 0.35, 1) both;
}
@keyframes svIn{ from{opacity:0;transform:scale(0.94);filter:blur(3px);} to{opacity:1;transform:scale(1);filter:blur(0);} }

/* SPIDER EMBLEM */
.spider-emblem{
  position:relative;width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;margin-bottom:2px;
  background:radial-gradient(circle at 35% 28%,#3a0a0a,#120202 65%,#000 100%);
  border:2px solid var(--red-main);
  box-shadow:0 0 18px rgba(255,0,0,.75), inset 0 0 14px rgba(0,0,0,.9);
  animation:emblemPulse 1.8s ease-in-out infinite alternate;
  overflow:hidden;
}
@keyframes emblemPulse{
  from{box-shadow:0 0 12px rgba(255,0,0,.5), inset 0 0 14px rgba(0,0,0,.9);}
  to{box-shadow:0 0 26px rgba(255,0,0,.95), inset 0 0 14px rgba(0,0,0,.9);}
}
.spider-emblem img{width:78%;height:78%;object-fit:contain;border-radius:50%;}
.spider-emblem .sp-glyph{
  width:62%;height:62%;display:grid;place-items:center;color:#FF2A2A;
  filter:drop-shadow(0 0 6px var(--red-glow));
  animation:iconSpinSoft 6s ease-in-out infinite alternate;
}
@keyframes iconSpinSoft{from{transform:scale(.94);}to{transform:scale(1.06);}}
.spider-emblem::after{
  content:"";position:absolute;left:-40%;top:-30%;width:55%;height:170%;
  background:linear-gradient(90deg,transparent,rgba(150,200,255,.55),transparent);
  transform:rotate(24deg);animation:streakMove 4.5s ease-in-out infinite;
}

.sv-wait-title, .sv-low-title, .sv-ready-title{
  font-family:'Chakra Petch','Orbitron',sans-serif;font-size:12.5px;font-weight:700;line-height:1.15;text-align:center;
  color:#fff;letter-spacing:.03em;text-transform:uppercase;
  text-shadow:0 0 8px rgba(255,255,255,.35),0 0 14px var(--red-glow);
}
.sv-wait-sub, .sv-ready-sub, .sv-low-amount{
  font-family:'Chakra Petch','Orbitron',sans-serif;font-size:11px;font-weight:700;line-height:1.15;text-align:center;
  letter-spacing:.06em;text-transform:uppercase;color:var(--red-main);
  text-shadow:0 0 10px var(--red-glow);
}
.sv-wait-hint, .sv-low-current{
  font-family:'Share Tech Mono',monospace;font-size:8.5px;font-weight:700;line-height:1.2;text-align:center;
  letter-spacing:.06em;color:#fff;text-transform:uppercase;
  text-shadow:0 0 6px rgba(255,0,0,.5);
}

/* SCANNER */
.sv-scan-title{
  font-family:'Chakra Petch','Orbitron',sans-serif;font-size:11px;font-weight:900;color:#fff;
  letter-spacing:.08em;text-shadow:0 0 8px var(--red-main);margin-bottom:2px;
}
.scan-log{
  width:100%;font-family:'Share Tech Mono',monospace;font-size:8.5px;font-weight:700;
  color:var(--red-light);line-height:1.5;text-align:center;min-height:46px;
  overflow:hidden;word-break:break-all;
}
.scan-log .hex-stream{color:#9fd8ff;font-size:8px;text-shadow:0 0 5px rgba(120,190,255,.5);}
.scan-bar-track{
  width:100%;height:6px;background:rgba(255,255,255,.04);border-radius:999px;
  overflow:hidden;border:1px solid rgba(255,0,0,.4);margin-top:5px;
}
.scan-bar-fill{
  height:100%;width:0%;background:linear-gradient(90deg,#7A0000,var(--red-main),#FF7B7B);
  box-shadow:0 0 10px var(--red-main);transition:width .08s linear;
}
.scan-bar-status{font-family:'Share Tech Mono',monospace;font-size:8.5px;font-weight:700;color:#fff;margin-top:3px;letter-spacing:.1em;}

/* NEW CYBERPUNK SCANNER UI */
.scan-core{position:relative;width:100%;max-width:140px;height:140px;margin:0 auto 8px;}
.scan-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid transparent;border-top-color:var(--red-main);border-right-color:rgba(255,60,60,0.5);opacity:0.8;}
.scan-ring-1{width:120px;height:120px;animation:scanRingSpin 2s linear infinite;}
.scan-ring-2{width:90px;height:90px;animation:scanRingSpin 1.5s linear infinite reverse;}
.scan-ring-3{width:60px;height:60px;animation:scanRingSpin 1s linear infinite;}
.scan-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;}

var canvas = document.getElementById('matrix-canvas');

function resizeCanvas() {
  var screen = document.getElementById('cardScreen');
  if(!screen) return;
  canvas.width = screen.offsetWidth;
  canvas.height = screen.offsetHeight;
  var numCols = Math.floor(canvas.width / fontSize) + 1;
  columns = [];
  for (var i = 0; i < numCols; i++) {

  }

var chars = "01UX𝚲𝚺𝚽𝛀789456#$@&%*";
function drawMatrixRain() {
  if (canvas.width === 0 || canvas.height === 0) return;
  
  ctx.fillStyle = 'rgba(4, 1, 1, 0.22)'; 
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.font = 'bold ' + fontSize + 'px "Share Tech Mono", monospace';
  
  for (var i = 0; i < columns.length; i++) {
    var text = chars.charAt(Math.floor(Math.random() * chars.length));
    var x = i * fontSize;
    var y = columns[i] * fontSize;
    
    if (Math.random() > 0.96) {
      ctx.fillStyle = '#FFFFFF';
    } else {
      ctx.fillStyle = 'rgba(255, 0, 0, 0.75)'; 
    }
    
    ctx.fillText(text, x, y);

function animateConfBar(pct,isBig){
  var fill=document.getElementById('sv-conf-fill');
  var pctEl=document.getElementById('sv-conf-pct');
  var cls=isBig?'big':'small';
  fill.className='sv-conf-fill';pctEl.className='sv-conf-pct';
  fill.style.width='0%';void fill.offsetWidth;
  fill.classList.add(cls);pctEl.classList.add(cls);pctEl.textContent='0%';
  var start=Date.now(),duration=500;
  function tick(){
    var t=Math.min(1,(Date.now()-start)/duration);
    var eased=1-Math.pow(1-t,3);
    pctEl.textContent=Math.round(pct*eased)+'%';

  }
  setTimeout(function(){fill.style.width=pct+'%';tick();},30);
}

(function(){

<script>
/* ── BRAND NAME (edit this one line to change the name everywhere) ── */
window.BRAND_NAME = window.BRAND_NAME || "SpidyXtrade VIP";
(function(){
  function fit(el){
    var box = el.parentElement && el.parentElement.classList.contains('cb-wrap') ? el.parentElement : el;
    var host = el.closest('.card-brand, .wo-head-title');
    if(!host) return;
    var span = host.querySelector('.cb-main');
    if(!span) return;
    var max = host.classList.contains('wo-head-title') ? 15 : 14;
    var min = 7.5, size = max;
    span.style.fontSize = size+'px';
    var avail = host.clientWidth;
    if(!avail) return;
    var guard = 0;
    while(span.scrollWidth > avail && size > min && guard++ < 80){
      size -= 0.4;
      span.style.fontSize = size.toFixed(2)+'px';
    }
  }
  function apply(){
    var hosts = document.querySelectorAll('.card-brand, .wo-head-title, .card-header');
    for(var i=0;i<hosts.length;i++){
      var s = hosts[i].querySelector('.cb-main');
      if(!s){ s=document.createElement('span'); s.className='cb-main'; hosts[i].appendChild(s); }
      s.textContent = s.getAttribute('data-brand-text') || window.BRAND_NAME;
      var sub = hosts[i].querySelector('.cb-sub');
      if(sub && sub.parentNode) sub.parentNode.removeChild(sub);
      fit(s);
    }
  }
  window.setBrandName = function(n){ window.BRAND_NAME = n; document.querySelectorAll('.card-brand .cb-main,.wo-head-title .cb-main,.card-title-line1.cb-main').forEach(function(s){ s.setAttribute('data-brand-text', n); }); apply(); };
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', apply);
  else apply();
  window.addEventListener('load', apply);
  window.addEventListener('resize', apply);
  setTimeout(apply, 600); setTimeout(apply, 1600);
})();
</script>
