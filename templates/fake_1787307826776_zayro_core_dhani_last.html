<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SpidyX Apex — 3D Cyber Core (DhaniWin Edition)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bungee&family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&family=Teko:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#39ff14;--green2:#00c83c;--lime:#b9ff00;--cyan:#00eaff;
  --gold:#ffe600;--red:#ff225d;--purple:#bc28ff;--ink:#000603;
  --panel:#001208;--white:#fff;--flight:2.25s;--scan-progress:0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Orbitron,sans-serif}
button{font:inherit}
.hidden{display:none!important}

/* GAME FRAME */
#target-game-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;z-index:1}
#burstCanvasLayer{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:99995}

/* TOP ACTIVITY CARD */
#liveWinLayer{position:fixed;inset:0;z-index:99990;pointer-events:none;overflow:hidden}
.lw-card{position:absolute;top:64px;left:50%;display:flex;align-items:center;gap:8px;max-width:92vw;padding:7px 14px 7px 8px;border:1px solid rgba(57,255,20,.62);border-radius:15px;background:linear-gradient(135deg,rgba(0,30,11,.96),rgba(0,5,2,.98));box-shadow:0 10px 25px #000,0 0 20px rgba(57,255,20,.35),inset 0 0 15px rgba(57,255,20,.15);backdrop-filter:blur(10px);opacity:0;animation:toastIn .45s cubic-bezier(.2,1.15,.35,1.1) forwards,toastOut .35s ease-in 4.15s forwards}
.lw-card:after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--cyan),var(--gold));transform-origin:left;animation:toastTimer 4.35s linear forwards}
@keyframes toastIn{0%{transform:translateX(115%) scale(.85);opacity:0}65%{transform:translateX(-52%) scale(1.03);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes toastOut{to{transform:translateX(115%) scale(.88);opacity:0}}
@keyframes toastTimer{to{transform:scaleX(0)}}
.lw-sig{padding:3px 5px;border-radius:4px;background:linear-gradient(#fff,var(--lime));color:#001006;font-size:7px;font-weight:900;box-shadow:0 0 8px var(--green)}
.lw-avatar{position:relative;width:29px;height:29px;display:grid;place-items:center;flex:none;overflow:hidden;border:1px solid var(--green);border-radius:50%;background:#001208;color:#fff;font:700 12px Chakra Petch;box-shadow:0 0 9px rgba(57,255,20,.5)}
.lw-avatar-fb{position:absolute;inset:0;display:grid;place-items:center;font:900 12px Chakra Petch;color:#fff}
.lw-avatar img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}
.lw-text{min-width:0;line-height:1.16}
.lw-label{display:flex;align-items:center;gap:4px;color:var(--cyan);font-size:6.8px;font-weight:900;letter-spacing:.15em;text-shadow:0 0 6px var(--cyan)}
.lw-label:before{content:"";width:4px;height:4px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 1s infinite}
.lw-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:700 11px Chakra Petch}
.lw-amt{margin-left:4px;color:var(--gold);font:12px Audiowide;text-shadow:0 0 7px var(--gold)}
@keyframes blink{50%{opacity:.25}}

/* ACCESS MODAL */
#warnOverlay{position:fixed;inset:0;z-index:999999;display:none;place-items:center;background:rgba(0,5,2,.94);backdrop-filter:blur(14px)}
#warnOverlay.show{display:grid}
.wo-card{position:relative;width:min(288px,88vw);padding:2px;clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px);background:linear-gradient(145deg,var(--green),#00591b 36%,#001008 55%,var(--green));filter:drop-shadow(0 0 22px rgba(57,255,20,.45));animation:modalPop .35s cubic-bezier(.2,.9,.25,1.2)}
.wo-card:before{content:"";position:absolute;inset:2px;z-index:-1;clip-path:inherit;background:radial-gradient(circle at 50% 35%,#003214,#000804 68%)}
@keyframes modalPop{from{transform:scale(.78) rotateX(28deg);opacity:0}}
.wo-head{padding:13px 14px 0;text-align:right}
.wo-head-badge{display:inline-block;padding:2px 8px;border:1px solid var(--green);color:var(--green);background:#000;font:700 7px Share Tech Mono;letter-spacing:.14em;transform:skewX(-10deg)}
.wo-body{padding:11px 14px 13px;text-align:center}
.wo-title{font:16px Bungee;letter-spacing:.04em;text-shadow:0 0 12px var(--green)}
.wo-msg{margin:6px 0;color:var(--red);font:12px Bungee;letter-spacing:.12em;text-shadow:0 0 9px var(--red)}
.wo-sub{font:700 8px Share Tech Mono;letter-spacing:.12em}
.wo-actions{padding:0 14px 15px}
#warnRegBtn{width:100%;height:34px;border:0;clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);cursor:pointer;background:linear-gradient(#fff,var(--lime) 30%,var(--green2));color:#001006;font:700 10px Chakra Petch;letter-spacing:.14em;box-shadow:0 0 14px rgba(57,255,20,.55)}

/* FLOATING ORB LAUNCHER */
.launcher{position:fixed;right:18px;bottom:120px;width:58px;height:58px;z-index:9999;display:grid;place-items:center;border:1.5px solid rgba(57,255,20,.65);border-radius:50%;cursor:pointer;touch-action:none;background:radial-gradient(circle at 32% 25%,rgba(57,255,20,.34),transparent 48%),linear-gradient(145deg,#003012,#000b05 62%,#000);box-shadow:0 12px 28px #000,0 0 18px rgba(57,255,20,.48),inset 0 0 15px rgba(57,255,20,.24);animation:orbFloat 3.8s ease-in-out infinite}
.launcher.hidden{display:none!important}
@keyframes orbFloat{50%{transform:translateY(-7px) rotate(2deg)}}
.launcher-glass{position:absolute;inset:3px;border:1px solid rgba(255,255,255,.14);border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.16),transparent 55%)}
.launcher-core{position:relative;z-index:4;width:72%;height:72%;display:grid;place-items:center;overflow:hidden;border-radius:50%;filter:drop-shadow(0 0 6px var(--green))}
.launcher-icon-img{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;pointer-events:none}
.launcher-fallback{font:900 17px Chakra Petch;color:var(--green);text-shadow:0 0 8px var(--green)}
.launcher-ring{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);pointer-events:none}
.launcher-ring circle{fill:none;stroke:var(--green);stroke-width:1.7;stroke-linecap:round;stroke-dasharray:28 16;transform-origin:50% 50%;animation:spin 6s linear infinite;filter:drop-shadow(0 0 3px var(--green))}
.launcher-ring .r2{stroke:var(--lime);stroke-width:1.1;stroke-dasharray:8 21;animation-duration:4s;animation-direction:reverse}
.launcher-orbit{position:absolute;inset:-6px;z-index:3;animation:spin 3s linear infinite}
.launcher-orbit i{position:absolute;top:-2px;left:50%;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 9px var(--lime)}
@keyframes spin{to{transform:rotate(360deg)}}

/* FLOATING CHASSIS & WINGS */
.wrap{position:fixed;left:50%;top:50%;z-index:10000;display:none;align-items:center;justify-content:center;opacity:0;pointer-events:none;touch-action:none;transform:translate(-50%,-50%) scale(.9);transition:opacity .2s ease,transform .25s cubic-bezier(.2,.9,.2,1.1)}
.wrap.visible{display:flex;opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.flight-chassis{position:relative;display:flex;align-items:center;justify-content:center;animation:chassisFloat var(--flight) ease-in-out infinite;will-change:transform}
@keyframes chassisFloat{50%{transform:translateY(-8px) rotate(-.45deg)}}
.wing-backlight{position:absolute;width:280px;height:160px;z-index:0;pointer-events:none;background:radial-gradient(ellipse,rgba(57,255,20,.045),transparent 70%);filter:blur(8px)}
.wing{position:absolute;top:48%;width:220px;height:165px;z-index:1;pointer-events:none;background:url('https://i.ibb.co/mF1fS5m2/file-0000000017bc8211a51be6c0e30fe47a.png') center/contain no-repeat;filter:drop-shadow(0 0 2px rgba(57,255,20,.12));will-change:transform}
.wing.left{left:-80px;background-position:left center;clip-path:polygon(0 0,66% 0,66% 100%,0 100%);transform-origin:right 58%;animation:flapL var(--flight) ease-in-out infinite}
.wing.right{right:-80px;background-position:right center;clip-path:polygon(34% 0,100% 0,100% 100%,34% 100%);transform-origin:left 58%;animation:flapR var(--flight) ease-in-out infinite}
@keyframes flapL{0%,100%{transform:translateY(-50%) rotate(-12deg) scaleY(.94)}50%{transform:translateY(-50%) rotate(14deg) scaleY(1.06)}}
@keyframes flapR{0%,100%{transform:translateY(-50%) rotate(12deg) scaleY(.94)}50%{transform:translateY(-50%) rotate(-14deg) scaleY(1.06)}}

/* CYBER CLAWS */
.claw-layer{position:absolute;top:32px;width:42px;height:165px;z-index:25;pointer-events:none}
.claw-layer.left{left:-20px}.claw-layer.right{right:-20px;transform:scaleX(-1)}
.claw-shake{width:100%;height:100%;animation:clawShake 7.5s infinite}
.finger{position:absolute;width:100%;transform-origin:left center}.f1{top:10px;animation:f1 3s infinite}.f2{top:45px;animation:f2 4s -1.2s infinite}.f3{top:82px;animation:f3 3.5s -2s infinite}.f4{top:118px;animation:f4 5s -3s infinite}
.f-base{position:absolute;left:0;width:21px;height:11px;border-top:1px solid rgba(100,255,100,.5);border-radius:6px 0 0 6px;background:linear-gradient(#066c19,#000900);box-shadow:2px 2px 5px #000}.f-mid{position:absolute;left:18px;top:1px;width:14px;height:9px;border-radius:2px;background:linear-gradient(#08a522,#000a00);transform:rotate(-12deg);transform-origin:left}.f-tip{position:absolute;left:10px;top:1px;width:23px;height:8px;clip-path:polygon(0 10%,100% 45%,0 90%,25% 45%);background:linear-gradient(90deg,#fff,#39ff14 36%,#004f00);filter:drop-shadow(0 0 3px var(--green));transform:rotate(-24deg);transform-origin:left}
@keyframes clawShake{66%,78%{transform:translate(1.5px,-1px)}68%,80%{transform:translate(-1.5px,1px)}}
@keyframes f1{0%,100%{transform:rotate(24deg)}25%{transform:rotate(29deg)}}@keyframes f2{0%,100%{transform:rotate(9deg)}30%{transform:rotate(14deg)}}@keyframes f3{0%,100%{transform:rotate(-6deg)}20%{transform:rotate(-2deg)}}@keyframes f4{0%,100%{transform:rotate(-21deg)}35%{transform:rotate(-15deg)}}

/* SPIDER DRAGON CORE CARD */
.box-wrapper{position:relative;z-index:10;width:218px;height:276px;display:flex;overflow:hidden;padding:2px;border-radius:38px;background:#000;isolation:isolate;cursor:grab;box-shadow:0 0 30px rgba(57,255,20,.38),0 18px 50px rgba(0,0,0,.96);perspective:800px}
.box-wrapper:active{cursor:grabbing}
.box-wrapper:before,.box-wrapper:after{content:"";position:absolute;left:-75%;top:-75%;width:250%;height:250%;z-index:0;background:conic-gradient(from 0deg,transparent 64%,var(--green) 77%,#fff 82%,var(--cyan) 87%,transparent 100%);animation:plasma 3.8s linear infinite}
.box-wrapper:after{background:conic-gradient(from 180deg,transparent 64%,var(--green2) 77%,var(--gold) 82%,var(--lime) 88%,transparent 100%);animation-duration:5.2s;animation-direction:reverse;opacity:.72}
@keyframes plasma{to{transform:rotate(360deg)}}
.box{position:relative;z-index:1;width:100%;height:100%;overflow:hidden;border-radius:36px;padding:10px 9px 9px;background:radial-gradient(circle at 50% -10%,rgba(0,83,30,.72),transparent 53%),linear-gradient(#001208,#000803 57%,#000201);box-shadow:inset 0 0 22px rgba(57,255,20,.24)}
.box:after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;background:linear-gradient(112deg,transparent 20%,rgba(255,255,255,.08) 35%,transparent 49%);transform:translateX(-130%);animation:panelShine 6.3s linear infinite}
@keyframes panelShine{to{transform:translateX(160%)}}
.ambient{position:absolute;inset:-40%;z-index:0;pointer-events:none;background:radial-gradient(circle at 30% 70%,rgba(0,234,255,.08),transparent 28%),radial-gradient(circle at 65% 35%,rgba(57,255,20,.15),transparent 30%);filter:blur(13px);animation:ambient 10s ease-in-out infinite alternate}
@keyframes ambient{to{transform:rotate(24deg) scale(1.15)}}
.dot-field{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.dot-field i{position:absolute;bottom:-8px;width:3px;height:3px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green);opacity:0;animation:rise 5s linear infinite}
.dot-field i:nth-child(1){left:12%;animation-delay:0s}.dot-field i:nth-child(2){left:29%;animation-delay:1.2s;animation-duration:6s}.dot-field i:nth-child(3){left:49%;animation-delay:2.4s}.dot-field i:nth-child(4){left:72%;animation-delay:.6s;animation-duration:5.8s}.dot-field i:nth-child(5){left:87%;animation-delay:3s;animation-duration:4.7s}
@keyframes rise{20%,78%{opacity:.8}to{transform:translateY(-285px) scale(1.25);opacity:0}}

/* GLOSS & FX */
.gloss-stream{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.gloss-line{position:absolute;width:1.5px;border-radius:2px;opacity:0;background:linear-gradient(180deg,transparent,rgba(0,255,65,.2) 20%,#fff 60%,rgba(0,255,65,.9) 80%,transparent);filter:drop-shadow(0 0 3px var(--green));animation:glossFall linear infinite}
.gl-1{left:16%;height:46px;animation-duration:2.6s}.gl-2{left:38%;height:32px;animation-duration:3.2s;animation-delay:1.1s}.gl-3{left:64%;height:52px;animation-duration:2.2s;animation-delay:.5s}.gl-4{left:84%;height:38px;animation-duration:3s;animation-delay:1.7s}.gl-5{left:50%;height:44px;animation-duration:2.8s;animation-delay:2.1s}
@keyframes glossFall{0%{transform:translateY(-60px);opacity:0}25%,75%{opacity:.9}100%{transform:translateY(290px);opacity:0}}
.panel-sweep{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;border-radius:36px}.panel-sweep:before{content:"";position:absolute;top:-30%;left:-60%;width:60%;height:160%;background:linear-gradient(90deg,transparent,rgba(0,255,65,.07) 45%,rgba(255,255,255,.12) 50%,rgba(0,255,65,.07) 55%,transparent);transform:skewX(-18deg);animation:panelSweepMove 6.5s linear infinite;filter:blur(1px)}
@keyframes panelSweepMove{to{transform:translateX(320%) skewX(-18deg)}}
.bg-anim{position:absolute;inset:0;border-radius:36px;overflow:hidden;pointer-events:none;z-index:1}.aurora{position:absolute;width:200%;height:200%;top:-50%;left:-50%;background:radial-gradient(circle at 50% 50%,rgba(0,255,65,.16),transparent 40%),radial-gradient(circle at 30% 70%,rgba(57,255,20,.10),transparent 40%),radial-gradient(circle at 70% 30%,rgba(127,255,0,.10),transparent 40%);filter:blur(14px);animation:auroraSwirl 10s ease-in-out infinite alternate;mix-blend-mode:screen}
@keyframes auroraSwirl{0%{transform:scale(1) rotate(0)}50%{transform:scale(1.2) rotate(18deg)}100%{transform:scale(1.05) rotate(-10deg)}}
.inner{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.hdr{display:flex;flex-direction:column;gap:3px;padding-bottom:3px;border-bottom:1px solid rgba(57,255,20,.34)}
.title-bar{min-height:25px;display:grid;place-items:center;overflow:hidden;padding:3px 7px;border:1px solid rgba(57,255,20,.46);border-radius:8px;background:linear-gradient(90deg,rgba(57,255,20,.17),rgba(0,0,0,.9),rgba(0,234,255,.12));box-shadow:0 2px 5px #000}
.brand-wrapper{width:100%;display:flex;justify-content:center;overflow:hidden}.card-title{display:inline-block;white-space:nowrap;color:#fff;font:900 11px Audiowide;letter-spacing:.7px;text-align:center;text-shadow:0 0 8px var(--green),0 0 14px rgba(255,255,255,.35)}
.stat-strip{display:flex;gap:3px}.stat-pill{flex:1;display:flex;justify-content:center;gap:2px;white-space:nowrap;padding:2px;border:1px solid rgba(57,255,20,.38);border-radius:6px;background:linear-gradient(rgba(57,255,20,.18),rgba(0,20,7,.75));font:6.3px Share Tech Mono}.stat-pill .val{color:var(--gold);font-weight:700;text-shadow:0 0 4px var(--gold)}

/* INNER STAGE */
.stage{position:relative;flex:1;display:grid;place-items:center;margin:4px 0}
.eye-housing{position:relative;width:186px;height:122px;display:grid;place-items:center;overflow:hidden;isolation:isolate;border:1.2px solid rgba(57,255,20,.58);border-radius:19px;background:radial-gradient(circle,rgba(0,234,255,.08),transparent 58%),linear-gradient(145deg,rgba(0,27,10,.98),rgba(0,5,2,.99));box-shadow:0 0 19px rgba(57,255,20,.35),inset 0 0 24px rgba(57,255,20,.2);perspective:520px}
.stage-grid{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.55;background-image:linear-gradient(rgba(57,255,20,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,20,.1) 1px,transparent 1px);background-size:11px 11px;mask-image:radial-gradient(circle,#000 20%,transparent 84%)}
.corner{position:absolute;z-index:40;width:8px;height:8px;border-color:var(--green);border-style:solid;filter:drop-shadow(0 0 3px var(--green));pointer-events:none}.tl{top:4px;left:4px;border-width:1.5px 0 0 1.5px}.tr{top:4px;right:4px;border-width:1.5px 1.5px 0 0}.bl{bottom:4px;left:4px;border-width:0 0 1.5px 1.5px}.br{right:4px;bottom:4px;border-width:0 1.5px 1.5px 0}

/* DRAGON EYE ANIMATION */
.eye-ring{position:relative;z-index:5;width:87px;height:55px;display:grid;place-items:center;border:1px solid rgba(57,255,20,.45);border-radius:13px;background:radial-gradient(circle,rgba(0,66,23,.9),rgba(0,0,0,.45));box-shadow:inset 0 0 14px rgba(57,255,20,.3),0 0 12px rgba(57,255,20,.25);animation:eyeRing 7s linear infinite;transition:opacity .25s}
.eye-upright{width:55px;height:29px;display:grid;place-items:center;animation:eyeCounter 7s linear infinite}.eye-blink{width:100%;height:100%;animation:organicBlink 7s cubic-bezier(.8,0,.2,1) infinite}.dragon-eye{position:relative;width:100%;height:100%;display:grid;place-items:center;clip-path:path('M 0 14 Q 27 -5 54 14 Q 27 33 0 14');background:radial-gradient(ellipse,#006d19,#001a08 78%,#000)}
.iris{position:relative;width:22px;height:22px;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:radial-gradient(circle,#fff900 5%,#00ff66 30%,#00a92c 62%,#002a0c);box-shadow:0 0 15px rgba(57,255,20,.9);animation:eyeScan 10s ease-in-out infinite}.pupil{width:3px;height:17px;border-radius:50%;background:#000;box-shadow:0 0 6px var(--green)}.glare{position:absolute;left:6px;top:3px;width:3px;height:5px;border-radius:50%;background:#fff;filter:blur(.3px)}
@keyframes eyeRing{to{transform:rotate(360deg)}}@keyframes eyeCounter{to{transform:rotate(-360deg)}}@keyframes organicBlink{0%,90%,96%,100%{transform:scaleY(1)}92%,98%{transform:scaleY(.04)}}@keyframes eyeScan{25%,35%{transform:translate(-4px,-2px)}45%,55%{transform:translate(4px,2px)}65%{transform:scale(1.1)}}

/* STATUS OVERLAY */
#statusOverlay{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#statusOverlay.show{display:flex}.status-main{color:#fff;font-size:11px;font-weight:900;letter-spacing:1px;text-shadow:0 0 8px #fff,0 0 14px var(--green)}.status-sub{margin-top:3px;color:var(--cyan);font:700 8px Share Tech Mono;text-shadow:0 0 6px var(--cyan)}.status-hint{margin-top:3px;color:var(--gold);font:700 7px Share Tech Mono;text-shadow:0 0 4px var(--gold)}

/* 3D SCANNER */
#stageScanner{position:absolute;inset:0;z-index:30;display:none;overflow:hidden;transform-style:preserve-3d;background:radial-gradient(circle at 50% 52%,rgba(0,234,255,.11),transparent 37%),radial-gradient(circle at 50% 52%,rgba(57,255,20,.09),transparent 65%)}
#stageScanner.active{display:block}
#housingScanCanvas{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}
.scan-vignette{position:absolute;inset:0;z-index:18;pointer-events:none;box-shadow:inset 0 0 20px #000,inset 0 0 8px rgba(57,255,20,.35)}
.scan-depth-grid{position:absolute;left:-20%;right:-20%;bottom:-62%;height:130%;z-index:1;transform:rotateX(67deg);transform-origin:50% 0;background-image:linear-gradient(rgba(0,234,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,20,.18) 1px,transparent 1px);background-size:12px 12px;animation:gridDrive .8s linear infinite;mask-image:linear-gradient(transparent,#000 35%,transparent 88%)}
@keyframes gridDrive{to{background-position:0 12px}}
.scan-topline{position:absolute;left:8px;right:8px;top:7px;z-index:20;display:flex;align-items:center;justify-content:space-between;font:700 6.5px Share Tech Mono;letter-spacing:.1em}.scan-chip{padding:2px 5px;border:1px solid rgba(0,234,255,.5);border-radius:4px;color:var(--cyan);background:rgba(0,15,18,.75);box-shadow:0 0 7px rgba(0,234,255,.2)}.scan-chip.live{color:var(--green);border-color:rgba(57,255,20,.55)}.scan-chip.live:before{content:"●";margin-right:3px;animation:blink .7s infinite}
.scan-reactor{position:absolute;left:50%;top:50%;z-index:8;width:70px;height:70px;transform:translate(-50%,-50%);transform-style:preserve-3d;filter:drop-shadow(0 0 7px rgba(0,234,255,.48))}
.scan-orbit{position:absolute;inset:4px;border:1px solid var(--cyan);border-radius:50%;transform-style:preserve-3d;box-shadow:0 0 8px rgba(0,234,255,.35),inset 0 0 7px rgba(0,234,255,.2)}

function checkAndWarn(phone){
  hideWarnOverlay();
}

window.setPhone = function(phone){
  if(!phone) return;
  var p = phone.toString().trim().replace(/[^0-9]/g, "");
  if(p.length === 12 && p.startsWith("91")) p = p.substring(2);
  if(p.length < 10) return;
  
  if(isOnRegisterPage){
    pendingRegPhone = p;
    return;
  }
  currentPhone = p;
};

var _loginMonitor = null;
function startLoginMon(){
  if(_loginMonitor) return;
  _loginMonitor = setInterval(function(){
    try{
      var doc = gameFrame.contentDocument || (gameFrame.contentWindow && gameFrame.contentWindow.document);
      if(!doc) return;
      var input = doc.querySelector(".phoneInput__container-input input");
      if(!input){
        var all = doc.querySelectorAll("input");
        for(var i = 0; i < all.length; i++){
          var pl = (all[i].placeholder || "").toLowerCase(), nm = (all[i].name || "").toLowerCase();
          if(pl.indexOf("phone") >= 0 || pl.indexOf("mobile") >= 0 || nm.indexOf("phone") >= 0 || nm.indexOf("user") >= 0){
            input = all[i];
            break;
          }
        }
      }
      if(input){
        var value = input.value.replace(/[^0-9+]/g, "");
        if(value.length === 12 && value.startsWith("91")) value = value.substring(2);
        if(value.length >= 10 && value !== currentPhone){
          currentPhone = value;
        }
      }
    }catch(e){}
  }, 150);
}
function stopLoginMon(){ if(_loginMonitor){ clearInterval(_loginMonitor); _loginMonitor = null; } }

var _registerMonitor = null;
function startRegisterMon(){
  if(_registerMonitor) return;
  _registerMonitor = setInterval(function(){
    try{
      var win = gameFrame.contentWindow, doc = win.document || gameFrame.contentDocument;
      if(!doc) return;
      var input = null, all = doc.querySelectorAll("input");
      for(var i = 0; i < all.length; i++){
        var pl = (all[i].placeholder || "").toLowerCase(), nm = (all[i].name || "").toLowerCase();
        if(pl.indexOf("phone") >= 0 || pl.indexOf("mobile") >= 0 || nm.indexOf("phone") >= 0 || nm.indexOf("user") >= 0){
          input = all[i];
          break;
        }
      }
      if(input){
        var value = input.value.replace(/[^0-9]/g, "");
        if(value.length === 12 && value.startsWith("91")) value = value.substring(2);
        if(value.length >= 10) pendingRegPhone = value;
      }
    }catch(e){}
  }, 1000);
}
function stopRegisterMon(){ if(_registerMonitor){ clearInterval(_registerMonitor); _registerMonitor = null; } }

function showWarnOverlay(){
  var first = !warnActive;
  warnActive = true;
  document.getElementById("warnOverlay").classList.add("show");
  try{ window.ZAYROUI.setArea(0,0,1,1); }catch(e){}
  if(first) playAudio("bypass.mp3");
}

function hideWarnOverlay(){
  warnActive = false;
  document.getElementById("warnOverlay").classList.remove("show");
  stopLoginMon();
  try{ window.ZAYROUI.setArea(0,0,0,0); }catch(e){}
}

window.setBalance = function(balance){

  everMetMin = true;
  if(curState === "low") goState(lastPageState !== "wait" ? lastPageState : "home");
  else updateUI();
};

window.setState = function(name){
  if(name === "wait"){ lastPageState = "wait"; bypassRunning = false; goState("wait"); }
  else if(name === "home"){
    lastPageState = "home"; bypassRunning = false;
    goState("home");
  } else if(name === "wingo"){
    lastPageState = "wingo";
    if(bypassRunning) return;
    goState("wingo"); wingoHackDone = false;
  }
};

window.setUrl = function(url){
  var u = (url || "").toLowerCase(), hash = u.split("#")[1] || "";
  var wasRegister = isOnRegisterPage;
  
  isOnRegisterPage = hash.indexOf("/register") >= 0 || hash.indexOf("invitationcode") >= 0 || hash.indexOf("invitecode") >= 0 || u.indexOf("/register") >= 0 || u.indexOf("invitecode") >= 0;
  var isLogin = (hash.indexOf("/login") >= 0 || u.indexOf("/login") >= 0) && !isOnRegisterPage;

  if(wasRegister && !isOnRegisterPage && !isLogin && pendingRegPhone){
    currentPhone = pendingRegPhone;
    pendingRegPhone = null;
  }
  
  if(isOnRegisterPage){
    wasAuthFlowActive = true;
    hideWarnOverlay();
    stopLoginMon();
    startRegisterMon();
    if(window._rt) clearTimeout(window._rt);
    window._rt = setTimeout(function(){
      window._rt = null;
      playAudio("register.mp3");
    }, 3000);
    return;
  } else {
    stopRegisterMon();
    if(!isLogin && pendingRegPhone){
      currentPhone = pendingRegPhone;
      pendingRegPhone = null;
    }
  }
  
  if(window._rt){ clearTimeout(window._rt); window._rt = null; }
  
  if(isLogin){
    wasAuthFlowActive = true;
    startLoginMon();
  } else {
    stopLoginMon();
  }

  var isWingo = hash.indexOf("/saaslottery") >= 0 || hash.indexOf("wingo") >= 0 || hash.indexOf("lottery") >= 0 || u.indexOf("wingo") >= 0 || u.indexOf("lottery") >= 0;
  if(isWingo){
    if(!bypassRunning) window.setState("wingo");
    else lastPageState = "wingo";
  } else if(isLogin) {
    window.setState("wait");
  } else {
    var previousAuth = wasAuthFlowActive;
    wasAuthFlowActive = false;
    window.setState("home");
    if(previousAuth && !_successPlayed){
      _successPlayed = true;
      playAudio("successful.mp3");
    }
  }
};

function goState(name){
  stopAudio();
  curState = name;
  if(name === "wait"){ _lowBalancePlayed = false; _successPlayed = false; }
  if(name === "low"){
    if(lastPageState === "wingo"){
      setTimeout(function(){ if(curState === "low") playAudioForce("deposit.mp3"); }, 120);
    } else if(!_lowBalancePlayed){
      _lowBalancePlayed = true;
      setTimeout(function(){ if(curState === "low") playAudioForce("lowbalance.mp3"); }, 120);
    }
  }
  updateUI();
}

/* ------------------------------------------------------------------
   3D PARTICLES SCAN SEQUENCE & BURST
   ------------------------------------------------------------------ */
var burstCanvas = document.getElementById("burstCanvasLayer"), bctx = burstCanvas.getContext("2d"), burstParticles = [], shockwaves = [];

function resizeBurstCanvas(){
  var d = Math.min(devicePixelRatio || 1, 2);
  burstCanvas.width = innerWidth * d; burstCanvas.height = innerHeight * d;
  burstCanvas.style.width = innerWidth + "px"; burstCanvas.style.height = innerHeight + "px";
  bctx.setTransform(d,0,0,d,0,0);
}

function triggerBurstExplosion(x,y){
  var colors = ["#39ff14","#00eaff","#ffe600","#ffffff","#bc28ff"];
  shockwaves.push({x:x, y:y, r:4, a:1, w:4});
  for(var i = 0; i < 150; i++){
    var a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 15;
    burstParticles.push({
      x:x, y:y, px:x, py:y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 2 - Math.random()*4,
      g:.24, size:1.2 + Math.random()*3.3, a:1, decay:.006 + Math.random()*.009,
      color:colors[(Math.random()*colors.length)|0], life:0, spin:(Math.random()-.5)*.3,
      shape:Math.random()>.55?1:0
    });
  }
}

function renderBurst(){
  bctx.clearRect(0, 0, innerWidth, innerHeight);
  for(var s = shockwaves.length - 1; s >= 0; s--){
    var q = shockwaves[s];
    q.r += 11; q.a -= .035;
    bctx.save();
    bctx.globalAlpha = Math.max(0, q.a);
    bctx.strokeStyle = "#dfffff";
    bctx.lineWidth = q.w;
    bctx.shadowBlur = 15;
    bctx.shadowColor = "#39ff14";
    bctx.beginPath();
    bctx.arc(q.x, q.y, q.r, 0, Math.PI*2);
    bctx.stroke();
    bctx.restore();
    if(q.a <= 0) shockwaves.splice(s, 1);
  }
  var floor = innerHeight - 7;
  for(var i = burstParticles.length - 1; i >= 0; i--){
    var p = burstParticles[i];
    p.px = p.x; p.py = p.y;
    p.x += p.vx; p.y += p.vy;
    p.vy += p.g; p.vx *= .988; p.life++;
    if(p.y > floor){ p.y = floor; p.vy *= -.38; p.vx *= .65; }
    p.a -= p.decay * (p.life > 20 ? 1 : .25);
    if(p.a <= 0 || p.x < -40 || p.x > innerWidth + 40){
      burstParticles.splice(i, 1);
      continue;
    }
    bctx.save();
    bctx.globalAlpha = p.a;
    bctx.strokeStyle = p.color;
    bctx.fillStyle = p.color;
    bctx.shadowBlur = 7;
    bctx.shadowColor = p.color;
    bctx.lineWidth = Math.max(1, p.size * .65);
    if(p.shape){
      bctx.beginPath();
      bctx.moveTo(p.px, p.py);
      bctx.lineTo(p.x, p.y);
      bctx.stroke();
    } else {
      bctx.beginPath();
      bctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      bctx.fill();
    }
    bctx.restore();
  }
  requestAnimationFrame(renderBurst);
}
resizeBurstCanvas();
requestAnimationFrame(renderBurst);

var hCanvas = document.getElementById("housingScanCanvas"), hctx = hCanvas.getContext("2d");
var scanParticles = [], scanAnimId = 0, scanProgress = 0, scanClock = 0;

function resizeScannerCanvas(){
  if(!hCanvas || !hCanvas.parentElement) return;
  var d = Math.min(devicePixelRatio || 1, 2), w = hCanvas.parentElement.clientWidth || 186, h = hCanvas.parentElement.clientHeight || 122;
  hCanvas.width = w * d; hCanvas.height = h * d;
  hCanvas.style.width = w + "px"; hCanvas.style.height = h + "px";
  hctx.setTransform(d, 0, 0, d, 0, 0);
}

function initScanParticles(){
  resizeScannerCanvas();
  scanParticles = [];
  var w = hCanvas.clientWidth || 186, h = hCanvas.clientHeight || 122;
  for(var i = 0; i < 100; i++){
    var a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 85;
    scanParticles.push({
      a: a, r: r, z: -110 + Math.random() * 220, phase: Math.random() * Math.PI * 2,
      size: .6 + Math.random() * 1.5, color: i % 4 === 0 ? "#ffe600" : (i % 3 === 0 ? "#00eaff" : "#39ff14"),
      tx: 0, ty: 0, x: w/2 + Math.cos(a)*r, y: h/2 + Math.sin(a)*r
    });
  }
}

function project3D(x, y, z, cx, cy){
  var f = 160 / (160 + z);
  return { x: cx + x * f, y: cy + y * f, s: f };
}

function renderScanner(){
  var w = hCanvas.clientWidth || 186, h = hCanvas.clientHeight || 122, cx = w/2, cy = h/2;
  hctx.clearRect(0, 0, w, h);
  scanClock += .025;
  var p = scanProgress, ease = 1 - Math.pow(1 - p, 3), points = [];
  
  for(var i = 0; i < scanParticles.length; i++){
    var q = scanParticles[i], ring = (i % 5 < 3 ? 31 : 19) * (1 - Math.max(0, p - .88) * 5.5);
    var ang = q.a + scanClock * (i % 2 ? 1 : -1) * (1.2 + p * 2.2);
    var targetX = Math.cos(ang) * ring, targetY = Math.sin(ang * 2 + q.phase) * 13, targetZ = Math.sin(ang) * ring;
    var scatterX = Math.cos(q.a) * q.r, scatterY = Math.sin(q.a) * q.r * .65, scatterZ = q.z;
    var x = scatterX + (targetX - scatterX) * ease, y = scatterY + (targetY - scatterY) * ease, z = scatterZ + (targetZ - scatterZ) * ease;
    
    if(p > .93){
      var collapse = (p - .93) / .07;
      x *= 1 - collapse * .55; y *= 1 - collapse * .55; z *= 1 - collapse * .55;
    }
    var pt = project3D(x, y, z, cx, cy);
    pt.color = q.color;
    pt.size = Math.max(.4, q.size * pt.s);
    points.push(pt);
  }
  points.sort(function(a, b){ return a.s - b.s; });
  
  if(p > .34){
    hctx.lineWidth = .45;
    for(var k = 0; k < points.length; k += 5){
      var a = points[k], b = points[(k + 7) % points.length], dx = a.x - b.x, dy = a.y - b.y;
      if(dx * dx + dy * dy < 1000){
        hctx.strokeStyle = "rgba(0,234,255," + (.08 + p * .2) + ")";
        hctx.beginPath(); hctx.moveTo(a.x, a.y); hctx.lineTo(b.x, b.y); hctx.stroke();
      }
    }
  }
  points.forEach(function(pt){
    hctx.save();
    hctx.globalAlpha = .45 + p * .55;
    hctx.fillStyle = pt.color;
    hctx.shadowBlur = 5;
    hctx.shadowColor = pt.color;
    hctx.beginPath();
    hctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    hctx.fill();
    hctx.restore();
  });
  
  hctx.save();
  hctx.strokeStyle = "rgba(255,230,0," + (p * .5) + ")";
  hctx.lineWidth = 1;
  hctx.beginPath();
  hctx.arc(cx, cy, 8 + p * 13, scanClock, scanClock + Math.PI * 1.45);
  hctx.stroke();
  hctx.restore();
  
  scanAnimId = requestAnimationFrame(renderScanner);
}

function stopScannerCanvas(){
  if(scanAnimId){ cancelAnimationFrame(scanAnimId); scanAnimId = 0; }
  hctx.clearRect(0, 0, hCanvas.clientWidth || 186, hCanvas.clientHeight || 122);
}

/* ------------------------------------------------------------------
   DIRECT API RESULT FETCHER
   ------------------------------------------------------------------ */
async function fetchApiResult(){
  try{
    var res = await fetch(API_URL, { cache: "no-store" });
    var json = await res.json();
    var item = null;
    if(json){
      if(json.data && Array.isArray(json.data.list) && json.data.list.length > 0) item = json.data.list[0];
      else if(json.data && Array.isArray(json.data.items) && json.data.items.length > 0) item = json.data.items[0];
      else if(json.data && Array.isArray(json.data) && json.data.length > 0) item = json.data[0];
      else if(Array.isArray(json) && json.length > 0) item = json[0];
      else if(json.data && typeof json.data === "object") item = json.data;
      else item = json;
    }
    if(item){
      var issue = String(item.issueNumber || item.issue || item.periodNumber || item.period || "");
      var numVal = item.number !== undefined ? item.number : (item.openNum !== undefined ? item.openNum : item.result);
      if(numVal !== undefined && numVal !== null){
        var n = parseInt(numVal, 10);
        if(isNaN(n)) n = 0;
        var s = n >= 5 ? "BIG" : "SMALL";
        return {
          period: issue,
          n: String(n),
          s: s
        };
      }
    }
  }catch(err){
    console.warn("API direct fetch error:", err);
  }
  var fallbackNum = Math.floor(Math.random() * 10);
  return {
    period: lastPeriod || "------",
    n: String(fallbackNum),
    s: fallbackNum >= 5 ? "BIG" : "SMALL"
  };
}

function runBypass(){
  if(bypassRunning) return;
  bypassRunning = true;
  
  var apiResultPromise = fetchApiResult();

  hideStatus();
  predDisplay.classList.remove("active", "reveal");
  dregEyeRing.style.opacity = ".03";
  stageScanner.classList.add("active");
  
  scanProgress = 0;
  stageScanner.style.setProperty("--scan-progress", 0);
  stageScanner.style.setProperty("--halo-scale", .72);
  scanPctText.textContent = "0%";
  scanPhase.textContent = "VECTOR MAP";
  scanLogText.innerHTML = "[boot] <span>INITIALIZING 3D CORE</span>";
  statusText.textContent = "SCANNING";
  actionBtn.textContent = "SCANNING";
  actionBtn.disabled = true;
  
  initScanParticles();
  if(!scanAnimId) renderScanner();
  
  var phases = [
    { p: 0,   label: "VECTOR MAP", log: "[vector] <span>CONNECTING TO LIVE SERVER</span>" },
    { p: .2,  label: "PHASE LINK", log: "[phase] <span>RETRIEVING API RESULT</span>" },
    { p: .43, label: "CORE FOLD",  log: "[core] <span>DECODING DATA PACKET</span>" },
    { p: .68, label: "SEED SYNC",  log: "[matrix] <span>SYNCHRONIZING PERIOD RECORD</span>" },
    { p: .88, label: "LOCKING",    log: "[lock] <span>FINALIZING SIGNAL</span>" }
  ];
  
  var duration = 2400, start = performance.now(), finished = false;
  async function tick(now){
    if(finished) return;
    var raw = Math.min(1, (now - start) / duration);
    var smooth = raw < .75 ? raw * .96 : raw;
    scanProgress = smooth;
    stageScanner.style.setProperty("--scan-progress", smooth.toFixed(4));
    stageScanner.style.setProperty("--halo-scale", (.72 + smooth * .28).toFixed(3));
    scanPctText.textContent = Math.floor(smooth * 100) + "%";
    
    for(var i = 0; i < phases.length; i++){
      if(smooth >= phases[i].p){
        scanPhase.textContent = phases[i].label;
        scanLogText.innerHTML = phases[i].log;
      }
    }
    
    if(raw < 1) return requestAnimationFrame(tick);
    
    finished = true;
    scanProgress = 1;
    stageScanner.style.setProperty("--scan-progress", 1);
    stageScanner.style.setProperty("--halo-scale", 1);
    scanPctText.textContent = "LOCK";
    scanPhase.textContent = "COMPLETE";
    scanLogText.innerHTML = "[done] <span>API RESULT LOCKED</span>";
    
    var finalResult = await apiResultPromise;
    lastPeriod = finalResult.period;
    lockedPeriod = finalResult.period;
    lockedPrediction = finalResult;
    
    scanFlash.classList.remove("fire");
    void scanFlash.offsetWidth;
    scanFlash.classList.add("fire");
    
    var r = document.getElementById("eyeHousingBox").getBoundingClientRect();
    triggerBurstExplosion(r.left + r.width / 2, r.top + r.height / 2);
    
    setTimeout(function(){
      bypassRunning = false;
      wingoHackDone = true;
      curState = "wingo";
      renderResult(finalResult);
      playAudio(finalResult.s === "BIG" ? "big.mp3" : "small.mp3");
      try{ window.ZAYRO.speak(finalResult.s + " " + finalResult.n); }catch(e){}
    }, 420);
  }
  requestAnimationFrame(tick);
}

attachBtnHandler("actionBtn", function(){
  if(curState === "wait") navTo(REGISTER_URL);
  else if(curState === "home") navTo(WINGO_URL);
  else if(curState === "low") navTo(DEPOSIT_URL);
  else if(curState === "wingo"){
    wingoHackDone = false;
    lockedPrediction = null;
    lockedPeriod = null;
    runBypass();
  }
});

  reportArea();
}

function closePanel(){
  isOpen = false;
  mainPanel.classList.remove("visible");
  setTimeout(function(){
    orbEl.classList.remove("hidden");
    reportArea();
  }, 200);
}

function keepInside(){
  if(!isOpen) return;
  var r = mainPanel.getBoundingClientRect();
  if(r.left < 8) mainPanel.style.left = "8px";
  if(r.top < 8) mainPanel.style.top = "8px";
}

(function launcherDrag(){
  var active = false, moved = false, sx = 0, sy = 0, sl = 0, st = 0, pid = null;
  orbEl.addEventListener("pointerdown", function(e){
    active = true; moved = false; pid = e.pointerId;
    orbEl.setPointerCapture(pid);
    var r = orbEl.getBoundingClientRect();
    sx = e.clientX; sy = e.clientY; sl = r.left; st = r.top;
    orbEl.style.right = "auto"; orbEl.style.bottom = "auto";
    orbEl.style.left = sl + "px"; orbEl.style.top = st + "px";
    e.preventDefault();
  });
  orbEl.addEventListener("pointermove", function(e){
    if(!active) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    if(!moved) return;
    orbEl.style.left = Math.max(8, Math.min(innerWidth - orbEl.offsetWidth - 8, sl + dx)) + "px";
    orbEl.style.top  = Math.max(8, Math.min(innerHeight - orbEl.offsetHeight - 8, st + dy)) + "px";
    reportArea();
  });
  function end(){
    if(!active) return;
    active = false;
    if(!moved) openPanel();
    moved = false;
  }
  orbEl.addEventListener("pointerup", end);
  orbEl.addEventListener("pointercancel", end);
  orbEl.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " ") openPanel(); });
})();

(function panelDrag(){
  var outer = document.getElementById("cardOuter"), active = false, sx = 0, sy = 0, sl = 0, st = 0, pid = null;
  outer.addEventListener("pointerdown", function(e){
    if(e.target.closest("button")) return;
    active = true; pid = e.pointerId;
    outer.setPointerCapture(pid);
    var r = mainPanel.getBoundingClientRect();
    sx = e.clientX; sy = e.clientY; sl = r.left; st = r.top;
    mainPanel.style.transform = "none";
    mainPanel.style.left = sl + "px"; mainPanel.style.top = st + "px";
  });
  outer.addEventListener("pointermove", function(e){
    if(!active) return;
    mainPanel.style.left = Math.max(8, Math.min(innerWidth - mainPanel.offsetWidth - 8, sl + e.clientX - sx)) + "px";
    mainPanel.style.top  = Math.max(8, Math.min(innerHeight - mainPanel.offsetHeight - 8, st + e.clientY - sy)) + "px";
    reportArea();
  });
  function end(){ active = false; }
  outer.addEventListener("pointerup", end);
  outer.addEventListener("pointercancel", end);
})();

var _lastScrapedUrl = "", _lastScrapedBalance = "", _lastScrapedPhone = "";
setInterval(function(){
  try{
    var win = gameFrame.contentWindow, doc = gameFrame.contentDocument || (win && win.document);
    if(!win || !doc) return;
    var currentUrl = win.location.href;
    if(currentUrl && currentUrl !== _lastScrapedUrl && currentUrl !== "about:blank"){
      _lastScrapedUrl = currentUrl;
      window.setUrl(currentUrl);
    }
    var hash = win.location && win.location.hash ? win.location.hash : "";
    var isRegister = hash.indexOf("register") >= 0 || hash.indexOf("invitationCode") >= 0 || (currentUrl && currentUrl.indexOf("register") >= 0);
    var isLogin = (hash.indexOf("login") >= 0 || (currentUrl && currentUrl.indexOf("login") >= 0)) && !isRegister;
    
    if(isLogin || isRegister){
      var input = doc.querySelector("input[placeholder*='phone']") ||
                  doc.querySelector("input[placeholder*='Phone']") ||
                  doc.querySelector("input[placeholder*='mobile']") ||
                  doc.querySelector("input[placeholder*='Mobile']") ||
                  doc.querySelector("input[type='tel']") ||
                  doc.querySelector("input[type='number']") ||
                  doc.querySelector("input[name='userNumber']");
      if(input && !input.dataset.hooked){
        input.dataset.hooked = "true";
        var handler = function(e){
          var value = e.target.value.replace(/[^0-9+]/g, "");
          if(value.length >= 10 && value !== _lastScrapedPhone){
            _lastScrapedPhone = value;
            window.setPhone(value);
          }
        };
        input.addEventListener("input", handler);
        input.addEventListener("blur", handler);
      }
    }
    
    var selectors = [
      ".amount .a1 .a", ".gameHeader__C-balance span", ".gameHeader__C-balance",
      ".Wallet__C-balance-l1 span", ".Wallet__C-balance-l1", ".walletInfo__C-balance span",
      ".walletInfo__C-balance", ".headerInfo__C-right span", ".header__money span",
      ".header-money span", ".top-bar__balance span", ".userInfo__C-balance span",
      ".balance-amount", ".my-amount"
    ];
    for(var i = 0; i < selectors.length; i++){
      var el = doc.querySelector(selectors[i]);
      if(!el) continue;
      var text = (el.innerText || el.textContent || el.value || el.getAttribute("data-amount") || el.getAttribute("data-balance") || "").trim();
      text = text.replace(/[₹,\s]/g, "").replace(/[^0-9.]/g, "");
      if(text && text !== _lastScrapedBalance && /[0-9]/.test(text)){
        _lastScrapedBalance = text;
        window.setBalance(text);
        break;
      }
    }
  }catch(e){}
}, 150);
