async function fetchAPIResult(){
  try{
    var url = RESULT_API_URL + "?ts=" + Date.now();
    var res = await fetch(url, {method:"GET", headers:{"Accept":"application/json"}});
    var j = await res.json();
    if(j && j.data && j.data.list && j.data.list.length>0){
      var latest = j.data.list[0];
      var num = parseInt(latest.number,10);
      var issue = String(latest.issueNumber || latest.issue || "");
      if(!isNaN(num) && num>=0 && num<=9 && issue){
        var size = num>=5 ? "BIG" : "SMALL";
        // period automatic change nahi hoga - only set when user triggers
        return {n:String(num), s:size, issue:issue};
      }
    }
  }catch(e){ console.warn("API result fetch failed", e); }
  return null;
}

function runBypass(){
  if(bypassRunning) return; bypassRunning=true;
  var btn=document.getElementById('btn-action');
  showLoader();
  if(btn){ btn.textContent='FETCHING'; btn.disabled=true; }
  if(loaderSub) loaderSub.textContent='CONNECTING API';
  var stages=['CONNECTING API','FETCHING RESULT','DECODING RESULT','LOCKING RESULT'];
  var sIdx=0;
  var stIv=setInterval(function(){
    if(loaderSub && sIdx < stages.length){ loaderSub.textContent=stages[sIdx]; sIdx++; }
  },350);
  var D=1600;
  setTimeout(async function(){
    clearInterval(stIv);
    var apiRes = await fetchAPIResult();
    var finalPred;
    if(apiRes){
      finalPred = {n: apiRes.n, s: apiRes.s};
      // period automatic change nahi hoga - sirf yahan set hota hai
      lastPeriod = apiRes.issue;
      lastKnownIssue = apiRes.issue;
      var pBot=document.getElementById('res-period'); if(pBot) pBot.textContent="PERIOD: "+apiRes.issue.slice(-4);
    } else {
      // fallback to old LOGIC if API fails (still looks like prediction)
      var lg=predData||LOGIC[Math.floor(Math.random()*10)]; if(!predData) predData=lg; finalPred=lg;
      // do not auto change period
    }
    if(apiRes) finalPred = {n: apiRes.n, s: apiRes.s};
    // lock for next same-period click safety
    lockedPeriod=lastPeriod; lockedPrediction=finalPred;
    showPrediction();
    renderResult(finalPred,true);
    bypassRunning=false; wingoHackDone=true;
    curState='wingo'; updateUI();
    if(btn) btn.disabled=false;
    var isBig=finalPred.s==='BIG';
    playAudio(isBig?'big.mp3':'small.mp3');
    try{window.ZAYRO.speak(finalPred.s+' '+finalPred.n);}catch(e){}
    // Trigger wingo button glow
    if(typeof rollBigSmallNumber==='function'){ try{rollBigSmallNumber(finalPred.n);}catch(e){} }
  },D);
}

(function(){
  // ---- ORB DRAG ----
  var sx=0, sy=0, sl=0, st=0, dragging=false, moved=false, hasMoved=false;
  var THRESH=3;
  function getXY(e){ if(e.touches && e.touches.length) return {x:e.touches[0].clientX, y:e.touches[0].clientY}; if(e.changedTouches && e.changedTouches.length) return {x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY}; return {x:e.clientX, y:e.clientY}; }
  function isBtn(t){ while(t && t!==orbEl){ if(t && t.tagName==='BUTTON') return true; t=t ? t.parentNode : null; } return false; }
  function onStart(e){
    if(isBtn(e.target)) return;
    var p=getXY(e);
    var r=orbEl.getBoundingClientRect();
    dragging=true; moved=false; hasMoved=false;
    sx=p.x; sy=p.y; sl=r.left; st=r.top;
    // Clear any transform/right/bottom so left/top becomes absolute
    orbEl.style.setProperty('transform','none','important');
    orbEl.style.setProperty('right','auto','important');
    orbEl.style.setProperty('bottom','auto','important');
    orbEl.style.setProperty('left', sl+'px','important');
    orbEl.style.setProperty('top', st+'px','important');
    orbEl.style.setProperty('transition','none','important');
    if(e.type==='mousedown') e.preventDefault();
  }
  function onMove(e){
    if(!dragging) return;
    var p=getXY(e);
    var dx=p.x - sx, dy=p.y - sy;
    if(!moved){
      if(Math.abs(dx) < THRESH && Math.abs(dy) < THRESH) return;
      moved=true;
    }
    hasMoved=true;
    if(e.cancelable) e.preventDefault();
    var nl = Math.max(4, Math.min(window.innerWidth - orbEl.offsetWidth - 4, sl + dx));
    var nt = Math.max(4, Math.min(window.innerHeight - orbEl.offsetHeight - 4, st + dy));
    orbEl.style.setProperty('left', nl+'px','important');
    orbEl.style.setProperty('top', nt+'px','important');
    if(window.reportArea) window.reportArea();
  }
  function onEnd(e){
    if(!dragging) return;
    dragging=false;
    orbEl.style.removeProperty('transition');
    var wasDrag = hasMoved;
    moved=false; hasMoved=false;
    if(!wasDrag){
      // It was a tap/click -> open panel
      openPanel();
    }
  }
  orbEl.addEventListener('mousedown', onStart);
  orbEl.addEventListener('touchstart', onStart, {passive:true});
  document.addEventListener('mousemove', onMove, {passive:false});
  document.addEventListener('touchmove', onMove, {passive:false});
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
  document.addEventListener('touchcancel', onEnd);
})();
