// ── native-security.gradle — OPTIONAL native security module ──
// build.gradle se sirf tab apply hota hai jab:
//   ./gradlew assembleProtectedRelease -PenableNativeSecurity
// (NDK + CMake install hona chahiye — bina iske Java checks hi active hain.)

android {
	defaultConfig {
		ndk {
			abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
		}
		externalNativeBuild {
			cmake {
				cppFlags "-O2 -fvisibility=hidden -fno-rtti"
			}
		}
	}

	externalNativeBuild {
		cmake {
			path "src/main/cpp/CMakeLists.txt"
			version "3.18.1"
		}
	}
}
