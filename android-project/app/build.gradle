plugins {
	id 'com.android.application'
}

// ── Build variants ──
//   debug             : developer friendly, koi minify nahi
//   release           : R8 + resource shrink (standard production)
//   protectedRelease  : R8 aggressive rules + resource shrink +
//                       security/protected-rules.pro
// Koi native/NDK module nahi — app me koi extra .so ship nahi hota.
// Popup + loading HTML assets me encrypted .bin ki tarah rehte hain.

android {
	compileSdk 34

	useLibrary 'org.apache.http.legacy'

	defaultConfig {
		applicationId "com.zayro.wingsyttt"
		namespace "com.zayro.wingsyttt"
		minSdkVersion 21
		targetSdkVersion 34
		versionCode 1
		versionName "1.0"
	}

	buildTypes {
		debug {
			minifyEnabled false
			shrinkResources false
			debuggable true
		}

		release {
			minifyEnabled true
			shrinkResources true
			debuggable false
			jniDebuggable false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}

		protectedRelease {
			minifyEnabled true
			shrinkResources true
			debuggable false
			jniDebuggable false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'security/protected-rules.pro'
		}
	}

	buildFeatures {
		viewBinding true
	}
}


dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
}
